<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Agenda — Biomassa</title>
<link rel="manifest" href="/agenda-manifest.webmanifest" />
<meta name="theme-color" content="#1F3B57" />
<!-- iOS ignora o manifesto para o ícone da tela inicial. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Agenda" />
<link rel="apple-touch-icon" href="/agenda-icone-192.png" />
<link rel="icon" href="/favicon.ico" />
<style>
  :root {
    --azul: #1F3B57;
    --azul-escuro: #16293C;
    --fundo: #F7F6F2;
    --superficie: #FFFFFF;
    --borda: #E5E3DA;
    --texto: #23231F;
    --texto-2: #6B6B68;
    --vermelho: #C62828;
    --ambar: #B57A12;
    --verde: #00732F;
    box-sizing: border-box;
  }
  *, *::before, *::after { box-sizing: inherit; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--fundo);
    color: var(--texto);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
    /* Respeita a área da barra de status e do indicador de gestos. */
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--azul); color: #fff;
    /* Fino de propósito: a faixa azul serve para identificar o app, não
       para ocupar um quinto da tela. Só o espaço das duas linhas de texto,
       mais a área da barra de status do iPhone. */
    padding: 8px 14px;
    padding-top: calc(8px + env(safe-area-inset-top));
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; line-height: 1.2; }
  header .sub {
    font-size: 11.5px; opacity: .75; margin-top: 1px; line-height: 1.2;
    /* Nome longo não empurra o botão Sair para fora. */
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 62vw;
  }

  main { padding: 12px 14px 90px; }

  .abas { display: flex; gap: 6px; margin-bottom: 14px; }
  .aba {
    flex: 1; padding: 9px 6px; border-radius: 9px; border: 1px solid var(--borda);
    background: var(--superficie); color: var(--texto-2); font-size: 13px;
    font-family: inherit; cursor: pointer;
  }
  .aba[aria-selected="true"] { background: var(--azul); color: #fff; border-color: var(--azul); }

  .data-atrasada { color: var(--vermelho); font-weight: 600; }
  .evento > div[onclick] { cursor: pointer; }

  .evento {
    background: var(--superficie); border: 1px solid var(--borda); border-left: 3px solid var(--texto-2);
    border-radius: 11px; padding: 12px 14px; margin-bottom: 8px;
    display: flex; gap: 12px; align-items: flex-start;
  }
  .evento.alta { border-left-color: var(--vermelho); }
  .evento.baixa { border-left-color: #B9B7AE; }
  .evento.feito { opacity: .45; }
  .evento.feito .titulo { text-decoration: line-through; }

  .evento input[type="checkbox"] { width: 22px; height: 22px; margin-top: 1px; flex: none; accent-color: var(--azul); }
  .titulo { font-weight: 500; line-height: 1.3; }
  .meta { font-size: 12.5px; color: var(--texto-2); margin-top: 3px; }

  .vazio { text-align: center; color: var(--texto-2); padding: 40px 20px; }

  .rodape {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    background: rgba(247,246,242,.95); backdrop-filter: blur(8px);
    border-top: 1px solid var(--borda);
    display: flex; gap: 8px;
  }
  button.primario {
    flex: 1; padding: 13px; border: none; border-radius: 11px;
    background: var(--azul); color: #fff; font-size: 15px; font-weight: 500;
    font-family: inherit; cursor: pointer;
  }
  button.secundario {
    padding: 13px 16px; border: 1px solid var(--borda); border-radius: 11px;
    background: var(--superficie); color: var(--texto); font-size: 15px;
    font-family: inherit; cursor: pointer;
  }

  /* Login e formulário */
  .painel { background: var(--superficie); border: 1px solid var(--borda); border-radius: 13px; padding: 18px; }
  label { display: block; font-size: 12.5px; color: var(--texto-2); margin: 12px 0 5px; }
  input, select, textarea {
    width: 100%; padding: 11px 12px; border: 1px solid var(--borda); border-radius: 9px;
    font-size: 16px; /* 16px evita o zoom automático do iPhone ao focar */
    font-family: inherit; background: var(--superficie); color: var(--texto);
  }
  .erro { color: var(--vermelho); font-size: 13px; margin-top: 10px; }
  .aviso { background: #FBF3E2; border: 1px solid #ECDCB4; color: #7A5205;
           border-radius: 9px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }

  .sobreposicao {
    position: fixed; inset: 0; background: rgba(22,41,60,.45); z-index: 20;
    display: flex; align-items: flex-end;
  }
  .folha {
    background: var(--fundo); width: 100%; max-height: 92vh; overflow-y: auto;
    border-radius: 16px 16px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  }
  .folha h2 { margin: 0 0 4px; font-size: 17px; }

  .pessoas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .pessoa {
    padding: 7px 12px; border-radius: 999px; border: 1px solid var(--borda);
    background: var(--superficie); font-size: 13px; font-family: inherit; cursor: pointer;
  }
  .pessoa[aria-pressed="true"] { background: var(--azul); color: #fff; border-color: var(--azul); }

  .item-check { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .item-check input[type="checkbox"] { width: 22px; height: 22px; flex: none; accent-color: var(--azul); }
  .item-texto { flex: 1; }

  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #14140F; --superficie: #1E1E19; --borda: #34342C;
      --texto: #EDEDE6; --texto-2: #A3A39B;
    }
    .rodape { background: rgba(20,20,15,.95); }
    .aviso { background: #2A2416; border-color: #4A3F22; color: #E8D9A8; }
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
const API = "https://erp-biomassa-backend.onrender.com";

const estado = {
  token: localStorage.getItem("agenda.token") || null,
  usuario: JSON.parse(localStorage.getItem("agenda.usuario") || "null"),
  eventos: [],
  colaboradores: [],
  carregando: false,
  erro: "",
  editando: null,
  push: { permitido: false, inscrito: false },
  // Guardada na abertura: o Safari só aceita a inscrição se ela acontecer
  // dentro do toque, e buscar a chave no meio quebra essa ligação.
  chavePush: null,
};

const app = document.getElementById("app");

/* ---------------------------------------------------------------------------
   Conversa com a API
--------------------------------------------------------------------------- */
async function api(caminho, opcoes = {}) {
  const resposta = await fetch(`${API}${caminho}`, {
    ...opcoes,
    headers: {
      "Content-Type": "application/json",
      ...(estado.token ? { Authorization: `Bearer ${estado.token}` } : {}),
      ...(opcoes.headers || {}),
    },
  });

  if (resposta.status === 401) {
    sair();
    throw new Error("Sessão expirada. Entre de novo.");
  }
  if (!resposta.ok) {
    let mensagem = resposta.statusText;
    try { const corpo = await resposta.json(); mensagem = corpo.erro || mensagem; } catch {}
    throw new Error(mensagem);
  }
  return resposta.status === 204 ? null : resposta.json();
}

function sair() {
  estado.token = null;
  estado.usuario = null;
  localStorage.removeItem("agenda.token");
  localStorage.removeItem("agenda.usuario");
  desenhar();
}

/* ---------------------------------------------------------------------------
   Notificações
--------------------------------------------------------------------------- */
// A chave vem em base64url. Qualquer caractere fora do alfabeto — espaço,
// quebra de linha, aspas coladas no valor — invalida a conversão, e o
// navegador só diz "P-256 inválida". Então limpa antes e confere depois.
const base64ParaUint8 = (base64) => {
  const limpa = String(base64 || "").trim().replace(/[^A-Za-z0-9\-_+/=]/g, "");
  const semPadding = limpa.replace(/=+$/, "");
  const padronizada = semPadding.replace(/-/g, "+").replace(/_/g, "/");
  const preenchida = padronizada + "=".repeat((4 - padronizada.length % 4) % 4);

  const bruto = atob(preenchida);
  const bytes = new Uint8Array(bruto.length);
  for (let i = 0; i < bruto.length; i++) bytes[i] = bruto.charCodeAt(i);
  return bytes;
};

const ehIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent);
const instalado = () =>
  window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;

async function verificarPush() {
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
  estado.push.permitido = Notification.permission === "granted";
  try {
    const registro = await navigator.serviceWorker.ready;
    estado.push.inscrito = Boolean(await registro.pushManager.getSubscription());
  } catch { /* ainda não registrado */ }

  // Busca a chave desde já, para o clique do botão não precisar esperar
  // nada antes de inscrever.
  if (estado.token && !estado.chavePush) {
    try {
      const { chave, configurado } = await api("/push/chave");
      if (configurado) estado.chavePush = chave;
    } catch { /* sem rede agora; tenta de novo na próxima abertura */ }
  }
}

async function ativarNotificacoes() {
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
      alert("Este navegador não trabalha com notificações.");
      return;
    }
    if (ehIOS() && !instalado()) {
      alert("No iPhone, as notificações só funcionam com o app na tela de início.\n\nToque em Compartilhar e depois em Adicionar à Tela de Início.");
      return;
    }

    const chave = estado.chavePush;
    if (!chave) {
      alert("Ainda não recebi a chave de notificação do servidor. Toque em ↻ e tente de novo.");
      return;
    }

    // 65 bytes é o tamanho de uma chave P-256 descomprimida, começando por
    // 0x04. Conferir aqui dá uma mensagem útil em vez do erro do navegador.
    const chaveBytes = base64ParaUint8(chave);
    if (chaveBytes.length !== 65 || chaveBytes[0] !== 4) {
      alert(
        `A chave de notificação do servidor está incorreta.\n\n` +
        `Recebida com ${chave.trim().length} caracteres, que viram ${chaveBytes.length} bytes ` +
        `(o correto é 87 caracteres e 65 bytes).\n\n` +
        `Gere o par de novo e cadastre VAPID_PUBLIC_KEY e VAPID_PRIVATE_KEY juntas.`
      );
      return;
    }

    const registro = await navigator.serviceWorker.ready;

    // Inscrição antiga no aparelho, feita com outra chave, impede criar a
    // nova. A remoção acontece antes de pedir a permissão, para não gastar
    // o gesto do toque com isso.
    const anterior = await registro.pushManager.getSubscription();
    if (anterior) await anterior.unsubscribe();

    // A permissão vem por último antes da inscrição: no Safari as duas
    // precisam acontecer coladas ao toque, sem consulta ao servidor no meio.
    const permissao = await Notification.requestPermission();
    if (permissao !== "granted") {
      alert("As notificações ficaram bloqueadas. Para liberar, acesse os ajustes do iPhone, em Notificações.");
      return;
    }

    // O Safari do iPhone recusa a chave como Uint8Array — quer o ArrayBuffer
    // por baixo. O Chrome aceita os dois, e algumas versões aceitam a string
    // em base64url direto. Então tenta os três, nessa ordem, em vez de
    // escolher um e torcer.
    // Uint8Array primeiro: é o formato dos exemplos da própria Apple.
    const formatos = [
      ["Uint8Array", chaveBytes],
      ["ArrayBuffer", chaveBytes.buffer.slice(chaveBytes.byteOffset, chaveBytes.byteOffset + chaveBytes.byteLength)],
      ["texto", chave.trim()],
    ];

    let inscricao = null;
    const falhas = [];
    for (const [nome, applicationServerKey] of formatos) {
      try {
        inscricao = await registro.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey });
        console.log(`[push] inscrito usando ${nome}`);
        break;
      } catch (e) {
        // Guarda o erro de cada formato: quando todos falham, é a diferença
        // entre eles que diz onde está o problema.
        falhas.push(`${nome}: ${e.name || "Erro"} — ${e.message}`);
      }
    }

    if (!inscricao) {
      // Diagnóstico completo na tela: sem console acessível no iPhone, é
      // daqui que sai a informação para descobrir a causa.
      throw new Error(
        `Nenhum formato foi aceito.\n\n${falhas.join("\n\n")}\n\n` +
        `Chave: ${chave.trim().length} caracteres, ${chaveBytes.length} bytes, começa com ${chaveBytes[0]}.\n` +
        `Instalado na tela inicial: ${instalado() ? "sim" : "NÃO"}.\n` +
        `Permissão: ${Notification.permission}.\n` +
        `Navegador: ${navigator.userAgent.slice(0, 90)}`
      );
    }

    const dados = inscricao.toJSON();
    await api("/push/inscrever", {
      method: "POST",
      body: JSON.stringify({
        endpoint: dados.endpoint,
        keys: dados.keys,
        aparelho: navigator.userAgent.slice(0, 120),
      }),
    });

    estado.push = { permitido: true, inscrito: true };
    desenhar();
    await api("/push/teste", { method: "POST" });
  } catch (e) {
    alert(`Não foi possível ativar: ${e.message}`);
  }
}

// Teste sob demanda. Só o teste feito ao ativar não basta: depois dele não
// havia como saber se o aparelho continuava recebendo, e a falta de aviso
// só era notada quando um compromisso passava batido.
async function testarNotificacao() {
  try {
    const situacao = await api("/push/situacao");
    if (!situacao.configurado) {
      alert("O servidor está com as notificações desligadas (chave VAPID ausente ou inválida). Avise quem cuida do sistema.");
      return;
    }
    if (!situacao.aparelhos) {
      alert("Nenhum aparelho está inscrito neste usuário. Toque em ↻ e use \"Ativar notificações\".");
      return;
    }
    const r = await api("/push/teste", { method: "POST" });
    if (!r.enviados) {
      alert(`O servidor não conseguiu entregar o teste (${situacao.aparelhos} aparelho(s) inscrito(s)). Ative as notificações de novo.`);
      return;
    }
    alert(`Teste enviado a ${r.enviados} aparelho(s). Se nada aparecer em alguns segundos, confira os avisos do app nos ajustes do celular.`);
  } catch (e) {
    alert(`Não foi possível testar: ${e.message}`);
  }
}

/* ---------------------------------------------------------------------------
   Dados
--------------------------------------------------------------------------- */
// Hoje de Cuiabá. toISOString dá o dia em UTC, que depois das 20h já é
// amanhã: eventos de hoje apareciam como atrasados.
const hojeISO = () => new Intl.DateTimeFormat("en-CA", { timeZone: "America/Cuiaba" }).format(new Date());

// Tudo que está em aberto, do mais atrasado ao mais distante, mais os
// concluídos recentes. Dividir em abas obrigava a procurar em qual delas a
// tarefa estava — numa lista desse tamanho, rolar é mais rápido.
function periodoDaLista() {
  const daqui = (dias) => {
    const d = new Date(`${hojeISO()}T12:00:00Z`);
    d.setUTCDate(d.getUTCDate() + dias);
    return d.toISOString().slice(0, 10);
  };
  return { de: daqui(-90), ate: daqui(365), status: "todos" };
}

async function carregar() {
  if (!estado.token) return;
  estado.carregando = true; estado.erro = "";
  desenhar();
  try {
    const params = new URLSearchParams(periodoDaLista());
    // "Só os meus" quando o usuário tem colaborador vinculado.
    if (estado.usuario?.colaboradorId) params.set("responsavelId", estado.usuario.colaboradorId);

    const [agenda, pessoas] = await Promise.all([
      api(`/agenda?${params}`),
      estado.colaboradores.length ? Promise.resolve(estado.colaboradores) : api("/colaboradores"),
    ]);
    estado.eventos = agenda.eventos;
    estado.colaboradores = pessoas;
  } catch (e) {
    estado.erro = e.message;
  } finally {
    estado.carregando = false;
    desenhar();
  }
}

/* ---------------------------------------------------------------------------
   Tela
--------------------------------------------------------------------------- */
const escapar = (texto) => String(texto ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function rotuloDia(dia) {
  const d = new Date(`${dia}T12:00:00Z`);
  const hoje = new Date(`${hojeISO()}T12:00:00Z`);
  const dias = Math.round((d - hoje) / 86400000);
  if (dias === 0) return "Hoje";
  if (dias === 1) return "Amanhã";
  if (dias === -1) return "Ontem";
  const formatado = d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" }).replace(".", "");
  return dias < 0 ? `${formatado} · atrasado` : formatado;
}

function desenhar() {
  if (!estado.token) return desenharLogin();

  // Alta primeiro, depois normal, depois baixa; dentro de cada uma, a data
  // mais recente no topo. Agrupar por dia não cabe mais aqui: a prioridade
  // manda, e um dia teria eventos espalhados pela lista.
  const PESO = { alta: 0, normal: 1, baixa: 2 };
  const ordenados = [...estado.eventos].sort((a, b) => {
    // Concluído vai para o fim, qualquer que seja a prioridade.
    const feito = (e) => (e.status === "concluido" ? 1 : 0);
    if (feito(a) !== feito(b)) return feito(a) - feito(b);

    const prioridade = (PESO[a.prioridade] ?? 1) - (PESO[b.prioridade] ?? 1);
    if (prioridade) return prioridade;

    return String(b.data).slice(0, 10).localeCompare(String(a.data).slice(0, 10));
  });

  const precisaAtivar = !estado.push.inscrito;
  const avisoIOS = ehIOS() && !instalado();

  app.innerHTML = `
    <header>
      <div>
        <h1>Agenda</h1>
        <div class="sub">${escapar(estado.usuario?.nome || "")}</div>
      </div>
      <div style="display:flex;gap:6px;flex:none">
        ${estado.push.inscrito ? `<button class="secundario" style="padding:5px 11px;font-size:12.5px;flex:none" onclick="testarNotificacao()">Testar aviso</button>` : ""}
        <button class="secundario" style="padding:5px 11px;font-size:12.5px;flex:none" onclick="sair()">Sair</button>
      </div>
    </header>

    <main>
      ${avisoIOS ? `
        <div class="aviso">
          Para receber lembretes no iPhone, toque em <strong>Compartilhar</strong> e depois em
          <strong>Adicionar à Tela de Início</strong>. Depois abra o app por esse ícone.
        </div>` : ""}

      ${precisaAtivar && !avisoIOS ? `
        <div class="aviso">
          Lembretes desligados neste aparelho.
          <button class="secundario" style="margin-top:8px;width:100%" onclick="ativarNotificacoes()">
            Ativar notificações
          </button>
        </div>` : ""}

      ${estado.erro ? `<p class="erro">${escapar(estado.erro)}</p>` : ""}
      ${estado.carregando ? `<p class="vazio">Carregando…</p>` : ""}

      ${!estado.carregando && !ordenados.length ? `
        <div class="vazio"><p>Nenhum compromisso.</p></div>` : ""}

      ${ordenados.map((evento) => {
        const dia = String(evento.data).slice(0, 10);
        const atrasado = dia < hojeISO() && evento.status !== "concluido";
        return `
          <div class="evento ${evento.prioridade} ${evento.status === "concluido" ? "feito" : ""}">
            <input type="checkbox" ${evento.status === "concluido" ? "checked" : ""}
              onchange="event.stopPropagation(); alternarConclusao(${evento.id}, '${evento.status}')" />
            <div style="flex:1;min-width:0" onclick="abrirEvento(${evento.id})">
              <div class="titulo">
                ${evento.diaTodo ? "" : escapar(`${evento.horaInicio || ""}${evento.horaFim ? `–${evento.horaFim}` : ""} · `)}${escapar(evento.titulo)}
              </div>
              ${evento.descricao ? `<div class="meta">${escapar(evento.descricao)}</div>` : ""}
              <div class="meta">
                <span class="${atrasado ? "data-atrasada" : ""}">${escapar(rotuloDia(dia))}</span>
                · ${evento.responsaveis?.length
                  ? escapar(evento.responsaveis.map((r) => r.colaborador.nome.split(" ")[0]).join(", "))
                  : "sem responsável"}${evento.itens?.length
                  ? ` · ${evento.itens.filter((i) => i.concluido).length}/${evento.itens.length} itens`
                  : ""}
              </div>
            </div>
          </div>
        `;
      }).join("")}
    </main>

    <div class="rodape">
      <button class="primario" onclick="abrirFormulario()">+ Novo compromisso</button>
      <button class="secundario" onclick="carregar()">↻</button>
    </div>

    ${estado.editando ? desenharFormulario() : ""}
  `;
}

function desenharFormulario() {
  const e = estado.editando;
  return `
    <div class="sobreposicao" onclick="if (event.target === this) fecharFormulario()">
      <div class="folha">
        <h2>${e.id ? "Compromisso" : "Novo compromisso"}</h2>
        <div class="painel" style="margin-top:12px">
          <label>Título</label>
          <input id="f-titulo" value="${escapar(e.titulo || "")}" placeholder="O que precisa ser feito" />

          <label>Data</label>
          <input id="f-data" type="date" value="${e.data || hojeISO()}" />

          <label style="display:flex;align-items:center;gap:10px;margin-top:14px">
            <input id="f-diatodo" type="checkbox" style="width:22px;height:22px" ${e.diaTodo === false ? "" : "checked"}
              onchange="document.getElementById('horas').hidden = this.checked" />
            <span style="font-size:15px;color:var(--texto)">Dia inteiro</span>
          </label>

          <div id="horas" ${e.diaTodo === false ? "" : "hidden"}>
            <label>Horário</label>
            <input id="f-hora" type="time" value="${e.horaInicio || ""}" />
          </div>

          <label>Prioridade</label>
          <select id="f-prioridade">
            <option value="baixa" ${e.prioridade === "baixa" ? "selected" : ""}>Baixa</option>
            <option value="normal" ${!e.prioridade || e.prioridade === "normal" ? "selected" : ""}>Normal</option>
            <option value="alta" ${e.prioridade === "alta" ? "selected" : ""}>Alta</option>
          </select>

          <label>Responsáveis</label>
          <div class="pessoas">
            ${estado.colaboradores.map((c) => `
              <button class="pessoa" aria-pressed="${(e.responsaveis || []).includes(c.id)}"
                onclick="alternarResponsavel(${c.id}, this)">${escapar(c.nome)}</button>
            `).join("")}
          </div>

          <label>
            Lista de verificação
            ${(e.itens || []).length
              ? `<span style="float:right">${e.itens.filter((i) => i.concluido).length} de ${e.itens.length}</span>`
              : ""}
          </label>
          <div id="lista-itens">
            ${(e.itens || []).map((item, i) => `
              <div class="item-check">
                <input type="checkbox" ${item.concluido ? "checked" : ""} onchange="marcarItem(${i}, this.checked)" />
                <input class="item-texto" value="${escapar(item.texto)}"
                  style="${item.concluido ? "text-decoration:line-through;opacity:.6" : ""}"
                  oninput="editarItem(${i}, this.value)" />
                <button class="pessoa" style="padding:6px 10px" onclick="removerItem(${i})">×</button>
              </div>
            `).join("")}
          </div>
          <div class="item-check">
            <input id="f-novo-item" placeholder="Adicionar item…" style="flex:1"
              onkeydown="if (event.key === 'Enter') { event.preventDefault(); adicionarItem(); }" />
            <button class="pessoa" onclick="adicionarItem()">+</button>
          </div>

          <label>Detalhes</label>
          <textarea id="f-descricao" rows="2">${escapar(e.descricao || "")}</textarea>
        </div>

        <div style="display:flex;gap:8px;margin-top:14px">
          ${e.id ? `<button class="secundario" style="color:var(--vermelho)" onclick="excluirEvento(${e.id})">Excluir</button>` : ""}
          <button class="secundario" style="flex:1" onclick="fecharFormulario()">Cancelar</button>
          <button class="primario" onclick="salvarEvento()">Salvar</button>
        </div>
      </div>
    </div>
  `;
}

function desenharLogin() {
  app.innerHTML = `
    <header><h1>Agenda — Biomassa</h1></header>
    <main>
      <div class="painel">
        <label>E-mail</label>
        <input id="login-email" type="email" autocomplete="username" inputmode="email" />
        <label>Senha</label>
        <input id="login-senha" type="password" autocomplete="current-password" />
        <button class="primario" style="width:100%;margin-top:18px" onclick="entrar()">Entrar</button>
        <p id="login-erro" class="erro"></p>
      </div>
    </main>
  `;
  document.getElementById("login-senha").addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") entrar();
  });
}

/* ---------------------------------------------------------------------------
   Ações
--------------------------------------------------------------------------- */
async function entrar() {
  const email = document.getElementById("login-email").value.trim();
  const senha = document.getElementById("login-senha").value;
  const alvoErro = document.getElementById("login-erro");
  alvoErro.textContent = "";

  try {
    const resposta = await fetch(`${API}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, senha, origem: "app" }),
    });
    const dados = await resposta.json();
    if (!resposta.ok) throw new Error(dados.erro || "Não foi possível entrar");

    // Com mais de uma empresa, o login devolve a lista; aqui usamos a
    // primeira — a agenda não é por empresa.
    const token = dados.token || dados.empresas?.[0]?.token;
    if (!token) {
      const primeira = dados.empresas?.[0];
      const segunda = await fetch(`${API}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, senha, empresaId: primeira?.id, origem: "app" }),
      });
      const dadosSegunda = await segunda.json();
      if (!segunda.ok) throw new Error(dadosSegunda.erro || "Não foi possível entrar");
      estado.token = dadosSegunda.token;
      estado.usuario = dadosSegunda.usuario;
    } else {
      estado.token = token;
      estado.usuario = dados.usuario;
    }

    localStorage.setItem("agenda.token", estado.token);
    localStorage.setItem("agenda.usuario", JSON.stringify(estado.usuario));
    await verificarPush();
    carregar();
  } catch (e) {
    alvoErro.textContent = e.message;
  }
}

async function alternarConclusao(id, statusAtual) {
  try {
    await api(`/agenda/${id}/${statusAtual === "concluido" ? "reabrir" : "concluir"}`, { method: "POST" });
    carregar();
  } catch (e) { alert(e.message); }
}

// Abrir um compromisso da lista para conferir ou alterar.
function abrirEvento(id) {
  const evento = estado.eventos.find((e) => e.id === id);
  if (!evento) return;
  estado.editando = {
    id: evento.id,
    titulo: evento.titulo,
    descricao: evento.descricao || "",
    data: String(evento.data).slice(0, 10),
    diaTodo: evento.diaTodo,
    horaInicio: evento.horaInicio || "",
    prioridade: evento.prioridade,
    responsaveis: evento.responsaveis?.map((r) => r.colaboradorId) || [],
    itens: evento.itens?.map((i) => ({ id: i.id, texto: i.texto, concluido: i.concluido })) || [],
    status: evento.status,
  };
  desenhar();
}

function abrirFormulario() {
  estado.editando = {
    responsaveis: estado.usuario?.colaboradorId ? [estado.usuario.colaboradorId] : [],
    itens: [],
  };
  desenhar();
}

function fecharFormulario() { estado.editando = null; desenhar(); }

function alternarResponsavel(id, botao) {
  const lista = estado.editando.responsaveis || [];
  estado.editando.responsaveis = lista.includes(id) ? lista.filter((x) => x !== id) : [...lista, id];
  botao.setAttribute("aria-pressed", String(estado.editando.responsaveis.includes(id)));
}

async function excluirEvento(id) {
  if (!confirm("Excluir este compromisso?")) return;
  try {
    await api(`/agenda/${id}`, { method: "DELETE" });
    estado.editando = null;
    carregar();
  } catch (e) { alert(e.message); }
}

// A lista é editada em memória e salva junto do compromisso. Marcar um
// item sem salvar seria perder a marcação ao fechar a folha.
function adicionarItem() {
  const campo = document.getElementById("f-novo-item");
  const texto = campo.value.trim();
  if (!texto) return;
  estado.editando.itens = [...(estado.editando.itens || []), { texto, concluido: false }];
  // Preserva o que já estava digitado nos outros campos antes de redesenhar.
  guardarFormulario();
  desenhar();
  // Mantém o foco para digitar o próximo item em sequência.
  document.getElementById("f-novo-item")?.focus();
}

function marcarItem(indice, concluido) {
  estado.editando.itens[indice].concluido = concluido;
  guardarFormulario();
  desenhar();
  document.getElementById("f-novo-item")?.focus();
}

function editarItem(indice, texto) {
  estado.editando.itens[indice].texto = texto;
}

function removerItem(indice) {
  estado.editando.itens = estado.editando.itens.filter((_, i) => i !== indice);
  guardarFormulario();
  desenhar();
}

// Copia o que está nos campos para o estado: redesenhar a folha recria os
// campos, e sem isso o que foi digitado se perderia.
function guardarFormulario() {
  const pegar = (id) => document.getElementById(id);
  const e = estado.editando;
  if (!e) return;
  if (pegar("f-titulo")) e.titulo = pegar("f-titulo").value;
  if (pegar("f-data")) e.data = pegar("f-data").value;
  if (pegar("f-diatodo")) e.diaTodo = pegar("f-diatodo").checked;
  if (pegar("f-hora")) e.horaInicio = pegar("f-hora").value;
  if (pegar("f-prioridade")) e.prioridade = pegar("f-prioridade").value;
  if (pegar("f-descricao")) e.descricao = pegar("f-descricao").value;
}

async function salvarEvento() {
  const diaTodo = document.getElementById("f-diatodo").checked;
  const corpo = {
    titulo: document.getElementById("f-titulo").value.trim(),
    data: document.getElementById("f-data").value,
    diaTodo,
    horaInicio: diaTodo ? null : (document.getElementById("f-hora").value || null),
    prioridade: document.getElementById("f-prioridade").value,
    descricao: document.getElementById("f-descricao").value.trim() || null,
    responsaveis: estado.editando.responsaveis || [],
    itens: estado.editando.itens || [],
  };

  if (!corpo.titulo || !corpo.data) {
    alert("Informe o título e a data.");
    return;
  }

  try {
    const id = estado.editando.id;
    await api(id ? `/agenda/${id}` : "/agenda", {
      method: id ? "PUT" : "POST",
      body: JSON.stringify(corpo),
    });
    estado.editando = null;
    carregar();
  } catch (e) { alert(e.message); }
}

/* ---------------------------------------------------------------------------
   Início
--------------------------------------------------------------------------- */

// A sessão se renova a cada abertura: quem usa o app não digita senha de
// novo enquanto não tocar em Sair. Falha aqui é silenciosa — se o token
// ainda vale, o app segue funcionando com ele.
async function renovarSessao() {
  if (!estado.token) return;
  try {
    const dados = await api("/auth/renovar", { method: "POST", body: JSON.stringify({ origem: "app" }) });
    estado.token = dados.token;
    estado.usuario = dados.usuario;
    localStorage.setItem("agenda.token", dados.token);
    localStorage.setItem("agenda.usuario", JSON.stringify(dados.usuario));
  } catch { /* sem rede ou sessão vencida: o próprio carregar() trata */ }
}
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/agenda-sw.js")
    .then(() => verificarPush())
    .then(() => { if (estado.token) desenhar(); })
    .catch((e) => console.warn("service worker:", e));
}

desenhar();
if (estado.token) renovarSessao().then(carregar);

// Voltar ao app depois de um tempo também renova, sem precisar reabrir.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && estado.token) {
    renovarSessao().then(carregar);
  }
});
</script>
</body>
