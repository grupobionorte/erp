        <div className="modal-footer">
          <button className="btn btn-primary" onClick={onFechar}>Fechar</button>
        </div>
      </div>
    </div>
  );
}

function ContasPagarView() {
  const hoje = new Date().toISOString().slice(0, 10);
  const primeiroDia = `${hoje.slice(0, 8)}01`;
  const ultimoDiaMes = (() => {
    const d = new Date(`${hoje.slice(0, 8)}01T12:00:00Z`);
    d.setUTCMonth(d.getUTCMonth() + 1);
    d.setUTCDate(0);
    return d.toISOString().slice(0, 10);
  })();

  const { items: fornecedores } = useApiCollection("fornecedores");

  const [filtro, setFiltro] = useState({ de: primeiroDia, ate: ultimoDiaMes, status: "aberta" });
  const [dados, setDados] = useState(null);
  const [erro, setErro] = useState("");
  const [carregando, setCarregando] = useState(false);

  const [categorias, setCategorias] = useState([]);
  const [centros, setCentros] = useState([]);

  const [contaEmEdicao, setContaEmEdicao] = useState(null);
  const [contaParaBaixa, setContaParaBaixa] = useState(null);
  const [gerenciarCadastros, setGerenciarCadastros] = useState(false);

  const carregarApoio = useCallback(async () => {
    try {
      const [cats, ccs] = await Promise.all([
        apiRequest("/contas-pagar/categorias"),
        apiRequest("/contas-pagar/centros-custo"),
      ]);
      setCategorias(cats);
      setCentros(ccs);
    } catch { /* a tela funciona sem classificação */ }
  }, []);

  const carregar = useCallback(async () => {
    setCarregando(true); setErro("");
    try {
      const params = new URLSearchParams(
        Object.entries(filtro).filter(([, v]) => v !== "" && v !== null)
      );
      setDados(await apiRequest(`/contas-pagar?${params}`));
    } catch (e) {
      setErro([e.message, e.detalhe].filter(Boolean).join(" — "));
      setDados(null);
    } finally { setCarregando(false); }
  }, [filtro]);

  useEffect(() => { carregarApoio(); }, [carregarApoio]);
  useEffect(() => { carregar(); }, [carregar]);

  const excluir = async (conta) => {
    const doGrupo = conta.grupo && conta.parcelaTotal > 1
      && window.confirm(`Excluir TODAS as ${conta.parcelaTotal} parcelas em aberto desse lançamento?\n\nCancelar exclui só esta.`);
    if (!doGrupo && !window.confirm("Excluir essa conta?")) return;
    try {
      await apiRequest(`/contas-pagar/${conta.id}${doGrupo ? "?grupo=1" : ""}`, { method: "DELETE" });
      carregar();
    } catch (e) {
      alert(`Não foi possível excluir: ${e.message}${e.detalhe ? `\n\n${e.detalhe}` : ""}`);
    }
  };

  const estornar = async (conta) => {
    if (!window.confirm("Desfazer a baixa dessa conta? Ela volta para em aberto.")) return;
    try {
      await apiRequest(`/contas-pagar/${conta.id}/estornar`, { method: "POST" });
      carregar();
    } catch (e) { alert(`Não foi possível estornar: ${e.message}`); }
  };

  const dataBr = (iso) => new Date(String(iso).slice(0, 10) + "T12:00:00Z").toLocaleDateString("pt-BR");

  // Situação pelo vencimento: é o que decide a cor da linha.
  const situacao = (conta) => {
    if (conta.status === "paga") return { texto: "paga", cor: "#00732F" };
    if (conta.status === "cancelada") return { texto: "cancelada", cor: "#8a887f" };
    const hojeZero = new Date(); hojeZero.setHours(0, 0, 0, 0);
    const venc = new Date(String(conta.vencimento).slice(0, 10) + "T12:00:00Z");
    const dias = Math.round((venc - hojeZero) / 86400000);
    if (dias < 0) return { texto: `atrasada ${Math.abs(dias)}d`, cor: "#c62828" };
    if (dias === 0) return { texto: "vence hoje", cor: "#b57a12" };
    if (dias <= 7) return { texto: `vence em ${dias}d`, cor: "#b57a12" };
    return { texto: "em aberto", cor: "#6b6b68" };
  };

  const T = dados?.totais;

  return (
    <div>
      <div className="view-header">
        <div className="view-title">
          <div className="icon-badge" style={{ background: "#fbf3e2", color: "#7a5205" }}>
            <FileText size={20} />
          </div>
          <div>
            <h2>Contas a pagar</h2>
            <p className="subtle">{dados?.contas.length || 0} conta{dados?.contas.length !== 1 ? "s" : ""} no filtro</p>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button className="btn" style={{ padding: "6px 12px", fontSize: 13 }} onClick={() => setGerenciarCadastros(true)}>
            Categorias e centros
          </button>
          <button className="btn btn-primary" onClick={() => setContaEmEdicao({})}>
            <Plus size={16} /> Nova conta
          </button>
        </div>
      </div>

      {T && (
        <div className="cte-resumo" style={{ marginBottom: 14 }}>
          <div>
            <span className="cte-resumo-rotulo">Atrasadas</span>
            <span className="cte-resumo-valor" style={{ color: T.atrasadas > 0 ? "#c62828" : undefined }}>
              R$ {formatarMoeda(T.atrasadas)}
            </span>
          </div>
          <div>
            <span className="cte-resumo-rotulo">Vence em 7 dias</span>
            <span className="cte-resumo-valor" style={{ color: T.proximosSeteDias > 0 ? "#b57a12" : undefined }}>
              R$ {formatarMoeda(T.proximosSeteDias)}
            </span>
          </div>
          <div><span className="cte-resumo-rotulo">Total em aberto</span><span className="cte-resumo-valor">R$ {formatarMoeda(T.abertas)}</span></div>
          <div><span className="cte-resumo-rotulo">Pagas no filtro</span><span className="cte-resumo-valor">R$ {formatarMoeda(T.pagas)}</span></div>
        </div>
      )}

      <div className="nf-section">
        <div className="nf-grid-3">
          <div className="field-group">
            <label className="field-label">Vencimento de</label>
            <input type="date" value={filtro.de} onChange={e => setFiltro(f => ({ ...f, de: e.target.value }))} />
          </div>
          <div className="field-group">
            <label className="field-label">Até</label>
            <input type="date" value={filtro.ate} onChange={e => setFiltro(f => ({ ...f, ate: e.target.value }))} />
          </div>
          <div className="field-group">
            <label className="field-label">Situação</label>
            <select value={filtro.status} onChange={e => setFiltro(f => ({ ...f, status: e.target.value }))}>
              <option value="aberta">Em aberto</option>
              <option value="paga">Pagas</option>
              <option value="todas">Todas</option>
            </select>
          </div>
        </div>
      </div>

      {erro && <p className="error-text">{erro}</p>}
      {carregando && <p className="hint">Carregando…</p>}

      {dados && (
        <table className="data-table tabela-densa">
          <thead>
            <tr>
              <th style={{ width: 90 }}>Vencimento</th>
              <th>Descrição</th>
              <th>Fornecedor</th>
              <th>Categoria</th>
              <th>Centro de custo</th>
              <th style={{ width: 110, textAlign: "right" }}>Valor</th>
              <th style={{ width: 110 }}>Situação</th>
              <th className="actions-col"></th>
            </tr>
          </thead>
          <tbody>
            {dados.contas.map(conta => {
              const s = situacao(conta);
              return (
                <tr key={conta.id}>
                  <td>{dataBr(conta.vencimento)}</td>
                  <td>{conta.descricao}{conta.documento ? <span className="subtle"> · {conta.documento}</span> : null}</td>
                  <td>{conta.fornecedor?.nomeRazaoSocial || "—"}</td>
                  <td>{conta.categoria?.nome || "—"}</td>
                  <td>{conta.centroCusto?.nome || "—"}</td>
                  <td style={{ textAlign: "right" }}>R$ {formatarMoeda(conta.valor)}</td>
                  <td style={{ color: s.cor }}>{s.texto}</td>
                  <td className="actions-col" style={{ whiteSpace: "nowrap" }}>
                    {conta.status === "aberta" ? (
                      <>
                        <button className="icon-btn" title="Dar baixa" onClick={() => setContaParaBaixa(conta)}>✓</button>
                        <button className="icon-btn" title="Editar" onClick={() => setContaEmEdicao(conta)}><Pencil size={14} /></button>
                        <button className="icon-btn icon-btn-danger" title="Excluir" onClick={() => excluir(conta)}><Trash2 size={14} /></button>
                      </>
                    ) : (
                      <button className="icon-btn" title="Desfazer baixa" onClick={() => estornar(conta)}>↺</button>
                    )}
                  </td>
                </tr>
              );
            })}
            {!dados.contas.length && <tr><td colSpan={8}>Nenhuma conta nesse filtro.</td></tr>}
          </tbody>
        </table>
      )}

      {contaEmEdicao && (
        <ContaPagarForm
          conta={contaEmEdicao.id ? contaEmEdicao : null}
          fornecedores={fornecedores}
          categorias={categorias}
          centros={centros}
          onFechar={() => setContaEmEdicao(null)}
          onSalvo={() => { setContaEmEdicao(null); carregar(); }}
        />
      )}

      {contaParaBaixa && (
        <BaixaContaModal
          conta={contaParaBaixa}
          onFechar={() => setContaParaBaixa(null)}
          onSalvo={() => { setContaParaBaixa(null); carregar(); }}
        />
      )}

      {gerenciarCadastros && (
        <CategoriasECentrosModal
          categorias={categorias}
          centros={centros}
          onFechar={() => setGerenciarCadastros(false)}
          onMudou={carregarApoio}
        />
      )}
    </div>
  );
}

function NotasFiscaisView({ onIrParaCte }) {
  const { items: clientes, criar: criarCliente } = useApiCollection("clientes");
  const { items: produtosDisponiveis } = useApiCollection("produtos");
  const { items: transportadoras, criar: criarTransportadora } = useApiCollection("transportadoras");
  const { items: colaboradores, criar: criarColaborador } = useApiCollection("colaboradores");
  const { items: veiculos, criar: criarVeiculo } = useApiCollection("veiculos");

  const [notas, setNotas] = useState(null);
  const [erro, setErro] = useState(null);
  const [editando, setEditando] = useState(null);
  const [mostrarForm, setMostrarForm] = useState(false);
  const [processando, setProcessando] = useState(null);
  const [menuAberto, setMenuAberto] = useState(null);
  const [notaParaCorrigir, setNotaParaCorrigir] = useState(null);

  useEffect(() => {
    const fechar = () => setMenuAberto(null);
    document.addEventListener("click", fechar);
    return () => document.removeEventListener("click", fechar);
  }, []);

  const carregar = useCallback(async () => {
    try {
      setErro(null);
      const dados = await apiRequest("/documentos-fiscais?tipo=NFe");
      setNotas(dados);
    } catch (e) {
      setErro(e.message);
      setNotas([]);
    }
  }, []);

  useEffect(() => { carregar(); }, [carregar]);

  const salvar = async (dados) => {
    if (editando?.id) {
      await apiRequest(`/documentos-fiscais/${editando.id}`, { method: "PUT", body: JSON.stringify(dados) });
    } else {
      await apiRequest("/documentos-fiscais/nfe/rascunho", { method: "POST", body: JSON.stringify(dados) });
    }
    setMostrarForm(false);
    setEditando(null);
    carregar();
  };

  const cancelarNota = async (id) => {
    if (!window.confirm("Cancelar essa nota fiscal? Ela não poderá mais ser editada.")) return;
    try {
      await apiRequest(`/documentos-fiscais/${id}`, { method: "DELETE" });
      carregar();
    } catch (e) {
      alert(`Não foi possível cancelar: ${e.message}`);
    }
  };

  // A listagem traz só o resumo de cada documento; para editar é preciso a
  // versão completa, com itens e vínculos.
  const abrirParaEditar = async (id) => {
    try {
      setEditando(await apiRequest(`/documentos-fiscais/${id}`));
      setMostrarForm(true);
    } catch (e) {
      alert(`Não foi possível abrir: ${e.message}`);
    }
  };

  const [notaParaGuia, setNotaParaGuia] = useState(null);

  // A nota autorizada já traz o que o CT-e precisa; o rascunho nasce daqui
  // e só falta o valor do frete.
  const gerarCte = async (nota) => {
    if (!window.confirm(`Gerar um CT-e para a nota ${nota.numero || ""}?`)) return;
    try {
      const r = await apiRequest(`/documentos-fiscais/${nota.id}/gerar-cte`, { method: "POST" });
      alert(r.aviso || "Rascunho de CT-e criado.");
      if (onIrParaCte) onIrParaCte();
    } catch (e) {
      alert(`Não foi possível gerar: ${e.message}${e.detalhe ? `\n\nDetalhe: ${e.detalhe}` : ""}`);
    }
  };
  const [menuRelatorios, setMenuRelatorios] = useState(false);
  const [relatorio, setRelatorio] = useState(null);

  // Clonar: venda que se repete — mesmo cliente, mesmo produto — não
  // precisa ser redigitada. Os itens vêm junto, ao contrário do CT-e, onde
  // cada viagem carrega notas diferentes.
  const clonarNota = async (nota) => {
    try {
      const nova = await apiRequest(`/documentos-fiscais/${nota.id}/clonar`, {
        method: "POST",
        body: JSON.stringify({ copiarItens: true }),
      });
      await carregar();
      setEditando(nova);
      setMostrarForm(true);
    } catch (e) {
      alert(`Não foi possível clonar: ${e.message}${e.detalhe ? `\n\nDetalhe: ${e.detalhe}` : ""}`);
    }
  };

  // Rascunho nunca foi à SEFAZ: não tem número nem valor fiscal, então pode
  // sumir de vez em vez de ficar na lista como cancelado.
  const excluirRascunho = async (nota) => {
    if (!window.confirm(
      `Excluir o rascunho da nota ${nota.numero || ""}?\n\n` +
      "Ele será apagado de vez. Como nunca foi enviado à SEFAZ, não fica registro."
    )) return;
    try {
      await apiRequest(`/documentos-fiscais/${nota.id}?definitivo=1`, { method: "DELETE" });
      carregar();
    } catch (e) {
      alert(`Não foi possível excluir: ${e.message}${e.detalhe ? `\n\nDetalhe: ${e.detalhe}` : ""}`);
    }
  };

  // Nota já autorizada — cancelar manda um evento de verdade pra SEFAZ, e
  // ela exige uma justificativa com pelo menos 15 caracteres.
  const cancelarNotaAutorizada = async (id) => {
    const justificativa = window.prompt("Motivo do cancelamento (mínimo 15 caracteres):");
    if (!justificativa) return;
    if (justificativa.trim().length < 15) {
      alert("A justificativa precisa ter pelo menos 15 caracteres.");
      return;
    }
    if (!window.confirm("Confirmar o cancelamento junto à SEFAZ? Essa ação não pode ser desfeita.")) return;
    setProcessando(id);
    try {
      await apiRequest(`/documentos-fiscais/${id}`, { method: "DELETE", body: JSON.stringify({ justificativa }) });
      carregar();
    } catch (e) {
      alert(`Não foi possível cancelar: ${e.message}${e.detalhe ? `\n\nDetalhe: ${e.detalhe}` : ""}`);
    } finally {
      setProcessando(null);
    }
  };

  // Passo 2 do fluxo: envia o rascunho pra Focus NFe. A emissão fiscal de
  // verdade exige um token da Focus NFe configurado no backend — sem isso,
  // essa chamada volta com erro do provedor (a nota fica "Rejeitado" com o
  // motivo explicando o que faltou).
  // Depois de mandar pra Focus NFe a nota fica "enviado" por um tempinho
  // enquanto a SEFAZ processa — aqui a gente consulta sozinho de tempos em
  // tempos, sem o usuário precisar ficar clicando, até sair desse status
  // (virar autorizado ou rejeitado) ou desistir depois de um tempo.
  const [busca, setBusca] = useState("");

  // Busca por número, cliente ou chave: são os três jeitos de procurar uma
  // nota na prática.
  const notasFiltradas = (notas || []).filter(nota => {
    const termo = busca.trim().toLowerCase();
    if (!termo) return true;
    return [
      String(nota.numero || ""),
      nota.destinatario?.nomeRazaoSocial || "",
      nota.chaveAcesso || "",
    ].some(campo => campo.toLowerCase().includes(termo));
  });

  // Padrão: número maior primeiro — a nota recém-emitida é a que se procura.
  // Rascunho ainda não tem número e fica no topo, que é onde ele precisa
  // estar para virar nota.
  const notasOrdenadas = notasFiltradas.slice().sort((a, b) => {
    const numero = (n) => (n.numero == null ? Infinity : Number(n.numero));
    return numero(b) - numero(a);
  });

  const consultarAteResolver = async (id, tentativa = 0, aba = null) => {
    if (tentativa >= 15) { setProcessando(null); fecharAba(aba); return; } // ~45s, desiste e deixa o botão manual
    await new Promise(r => setTimeout(r, 3000));
    try {
      const atualizado = await apiRequest(`/documentos-fiscais/${id}/status`);
      await carregar();
      if (atualizado.status === "enviado") {
        consultarAteResolver(id, tentativa + 1, aba);
      } else {
        // Autorizou: o DANFE abre na aba que já está esperando.
        if (atualizado.status === "autorizado" && atualizado.pdfUrl) abrirNaAba(aba, atualizado.pdfUrl);
        else fecharAba(aba);
        setProcessando(null);
      }
    } catch {
      // Se der erro na consulta automática, só para quieto — o botão
      // "Consultar status" continua disponível pra tentar na mão.
      fecharAba(aba);
      setProcessando(null);
    }
  };

  const emitirNota = async (id) => {
    if (!window.confirm("Emitir essa nota fiscal? Depois de emitida ela não pode mais ser editada.")) return;
    const aba = abrirAbaDeEspera("nota fiscal", "DANFE");
    setProcessando(id);
    try {
      const resultado = await apiRequest(`/documentos-fiscais/${id}/emitir`, { method: "POST" });
      await carregar();
      if (resultado.status === "enviado") {
        consultarAteResolver(id, 0, aba);
      } else {
        fecharAba(aba);
        setProcessando(null);
      }
    } catch (e) {
      fecharAba(aba);
      alert(`Não foi possível emitir: ${e.message}${e.detalhe ? `

Detalhe: ${e.detalhe}` : ""}`);
      carregar();
      setProcessando(null);
    }
  };

  const consultarStatusNota = async (id) => {
    setProcessando(id);
    try {
      const resultado = await apiRequest(`/documentos-fiscais/${id}/status`);
      carregar();
      if (resultado.statusProvedor) {
        alert(`A SEFAZ ainda está processando essa emissão (status: "${resultado.statusProvedor}"). Tente consultar de novo daqui a alguns minutos.`);
      }
    } catch (e) {
      alert(`Não foi possível consultar: ${e.message}${e.detalhe ? `

Detalhe: ${e.detalhe}` : ""}`);
    } finally {
      setProcessando(null);
    }
  };

  const enviarEmailNota = async (nota) => {
    const emailPadrao = nota.destinatario?.email || "";
    const digitado = window.prompt("Enviar o DANFE por e-mail para:", emailPadrao);
    if (!digitado) return;
    setProcessando(nota.id);
    try {
      await apiRequest(`/documentos-fiscais/${nota.id}/enviar-email`, {
        method: "POST",
        body: JSON.stringify({ emails: [digitado] }),
      });
      alert(`Enviado para ${digitado}.`);
    } catch (e) {
      alert(`Não foi possível enviar: ${e.message}${e.detalhe ? `

Detalhe: ${e.detalhe}` : ""}`);
    } finally {
      setProcessando(null);
    }
  };

  if (notas === null) {
    return <div className="loading">Carregando notas fiscais…</div>;
  }

  return (
    <div>
      <div className="view-header">
        <div className="view-title">
          <div className="icon-badge" style={{ background: "#fcebeb", color: "#791f1f" }}>
            <FileText size={20} />
          </div>
          <div>
            <h2>Vendas/NFe</h2>
            <p className="subtle">
              {busca ? `${notasFiltradas.length} de ${notas.length}` : notas.length} nota{notas.length !== 1 ? "s" : ""}
            </p>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
          {/* Relatórios de venda ficam junto da listagem de notas, não num
              menu separado: é aqui que se pensa neles. */}
          <div className="nf-menu" style={{ position: "relative" }}>
            <button className="btn" style={{ padding: "6px 12px", fontSize: 13 }}
              onClick={() => setMenuRelatorios(v => !v)}>
              <FileText size={14} /> Relatórios
            </button>
            {menuRelatorios && (
              <>
                <div style={{ position: "fixed", inset: 0, zIndex: 10 }} onClick={() => setMenuRelatorios(false)} />
                <div className="nf-dropdown" style={{ zIndex: 11 }}>
                  <button className="nf-dropdown-item" onClick={() => { setMenuRelatorios(false); setRelatorio("nfe"); }}>
                    <FileText size={14} /> Relação de NF-e emitidas
                  </button>
                </div>
              </>
            )}
          </div>
          <button className="btn btn-primary" onClick={() => { setEditando(null); setMostrarForm(true); }}>
            <Plus size={16} /> Nova Nota Fiscal
          </button>
        </div>
      </div>

      <div className="search-bar">
        <Search size={16} className="search-icon" />
        <input
          placeholder="Buscar por número, cliente ou chave…"
          value={busca}
          onChange={e => setBusca(e.target.value)}
        />
      </div>

      {erro && (
        <div className="error-banner">
          <AlertCircle size={16} />
          <span>Não consegui carregar: {erro}. <button className="link-btn" onClick={carregar}>Tentar de novo</button></span>
        </div>
      )}

      {notas.length === 0 ? (
        <div className="empty-state">
          <FileText size={32} strokeWidth={1.5} />
          <p>Nenhuma nota fiscal ainda.</p>
          <button className="btn btn-primary" onClick={() => setMostrarForm(true)}>
            <Plus size={16} /> Criar a primeira
          </button>
        </div>
      ) : (
        <table className="data-table tabela-compacta">
          <thead>
            <tr>
              {/* O cliente fica com todo o espaço que sobra; as demais
                  colunas têm largura do tamanho do conteúdo, encostadas
                  umas nas outras. */}
              <th style={{ width: 70 }}>Número</th>
              <th>Cliente</th>
              <th style={{ width: 105, textAlign: "right" }}>Valor total</th>
              <th style={{ width: 95 }}>Status</th>
              <th style={{ width: 115 }}>Guia Florestal</th>
              <th style={{ width: 130 }}>Chave / Motivo</th>
              <th style={{ width: 78 }}>Emissão</th>
              <th className="actions-col"></th>
            </tr>
          </thead>
          <tbody>
            {notasOrdenadas.map(nota => (
              <tr key={nota.id}>
                {/* Série sai da coluna: é sempre a mesma e só ocupava
                    espaço. Fica no tooltip para quem precisar conferir. */}
                <td title={nota.serie ? `Série ${nota.serie}` : undefined}>{nota.numero || "—"}</td>
                <td>{nota.destinatario?.nomeRazaoSocial || "—"}</td>
                <td style={{ textAlign: "right" }}>{nota.valorTotal != null ? `R$ ${formatarMoeda(nota.valorTotal)}` : "—"}</td>
                <td>
                  <StatusDocumento status={nota.status} />
                  {processando === nota.id && nota.status === "enviado" && (
                    <span style={{ color: "#8a887f", fontSize: 11.5, marginLeft: 6 }}>· consultando…</span>
                  )}
                </td>
                {/* Guia Florestal em coluna própria: é informação de
                    controle, não de status do documento. */}
                <td style={{ whiteSpace: "nowrap" }}>
                  {nota.status === "autorizado" ? (() => {
                    const gf = situacaoGuia(nota);
                    return <span style={{ fontSize: 12, color: gf.cor }}>{gf.texto}</span>;
                  })() : "—"}
                </td>
                <td style={{ maxWidth: 180 }} title={nota.chaveAcesso || nota.motivoRejeicao || nota.justificativaCancelamento || ""}>
                  {nota.status === "cancelado" && nota.justificativaCancelamento
                    ? `Cancelada: ${nota.justificativaCancelamento}`
                    : nota.chaveAcesso || (nota.status === "rejeitado" ? nota.motivoRejeicao : null) || "—"}
                </td>
                <td>{new Date(nota.dataEmissao).toLocaleDateString("pt-BR")}</td>
                <td className="actions-col" style={{ position: "relative" }}>
                  {/* Menor que o padrão: numa lista compacta, o botão de
                      ações é o que mais estica a altura da linha. */}
                  <button
                    className="icon-btn nf-menu-trigger"
                    style={{ padding: 2 }}
                    aria-label="Ações"
                    onClick={(e) => { e.stopPropagation(); setMenuAberto(menuAberto === nota.id ? null : nota.id); }}
                  >
                    <MoreVertical size={14} />
                  </button>
                  {menuAberto === nota.id && (
                    <div className="nf-dropdown" onClick={(e) => e.stopPropagation()}>
                      {(nota.status === "rascunho" || nota.status === "rejeitado") && (
                        <>
                          <button className="nf-dropdown-item" onClick={() => { setMenuAberto(null); abrirParaEditar(nota.id); }}>
                            <Pencil size={14} /> Editar
                          </button>
                          <button
                            className="nf-dropdown-item"
                            disabled={processando === nota.id}
                            onClick={() => { setMenuAberto(null); emitirNota(nota.id); }}
                          >
                            <FileText size={14} /> {processando === nota.id ? "Aguardando SEFAZ…" : nota.status === "rejeitado" ? "Tentar emitir de novo" : "Emitir nota"}
                          </button>
                          {nota.status === "rascunho" ? (
                            <button className="nf-dropdown-item nf-dropdown-item-danger" onClick={() => { setMenuAberto(null); excluirRascunho(nota); }}>
                              <Trash2 size={14} /> Excluir rascunho
                            </button>
                          ) : (
                            <button className="nf-dropdown-item nf-dropdown-item-danger" onClick={() => { setMenuAberto(null); cancelarNota(nota.id); }}>
                              <Trash2 size={14} /> Cancelar
                            </button>
                          )}
                        </>
                      )}
                      {nota.status === "enviado" && (
                        <button
                          className="nf-dropdown-item"
                          disabled={processando === nota.id}
                          onClick={() => { setMenuAberto(null); consultarStatusNota(nota.id); }}
                        >
                          <Search size={14} /> {processando === nota.id ? "Consultando…" : "Consultar status"}
                        </button>
                      )}
                      {nota.status === "autorizado" && (
                        <>
                          {nota.pdfUrl?.startsWith("http") ? (
                            <a className="nf-dropdown-item" href={nota.pdfUrl} target="_blank" rel="noreferrer" onClick={() => setMenuAberto(null)}>
                              <FileText size={14} /> Baixar DANFE
                            </a>
                          ) : (
                            <button
                              className="nf-dropdown-item"
                              disabled={processando === nota.id}
                              onClick={() => { setMenuAberto(null); consultarStatusNota(nota.id); }}
                            >
                              <FileText size={14} /> {processando === nota.id ? "Corrigindo…" : "Corrigir link do DANFE"}
                            </button>
                          )}
                          {/* Envio ao motorista: abre o WhatsApp com o número
                              e a mensagem prontos; quem confirma o envio é a
                              pessoa. O telefone vem do cadastro do motorista
                              vinculado ao veículo da nota. */}
                          <button className="nf-dropdown-item" onClick={() => { setMenuAberto(null); clonarNota(nota); }}>
                            <Plus size={14} /> Clonar para nova nota
                          </button>
                          <button className="nf-dropdown-item" onClick={() => { setMenuAberto(null); gerarCte(nota); }}>
                            <Truck size={14} /> Gerar CT-e
                          </button>
                          <button className="nf-dropdown-item" onClick={() => { setMenuAberto(null); setNotaParaGuia(nota); }}>
                            <FileText size={14} /> {nota.gfNumero ? "Guia Florestal" : "Registrar Guia Florestal"}
                          </button>
                          {nota.pdfUrl?.startsWith("http") && (() => {
                            const motorista = nota.veiculo?.motorista;
                            const link = linkWhatsApp(
                              motorista?.telefone,
                              `Nota fiscal ${nota.numero || ""} — ${nota.destinatario?.nomeRazaoSocial || ""}\n` +
                              `Placa ${nota.veiculo?.placa || ""}\n\nDANFE: ${nota.pdfUrl}`
                            );
                            if (!link) {
                              return (
                                <button className="nf-dropdown-item" disabled title={
                                  motorista
                                    ? "Motorista sem telefone cadastrado"
                                    : "Nenhum motorista no veículo dessa nota"
                                }>
                                  <Send size={14} /> Enviar ao motorista
                                </button>
                              );
                            }
                            return (
                              <a className="nf-dropdown-item" href={link} target="_blank" rel="noreferrer"
                                onClick={() => setMenuAberto(null)}>
                                <Send size={14} /> Enviar ao motorista ({motorista.nome.split(" ")[0]})
                              </a>
                            );
                          })()}
                          {nota.xmlUrl?.startsWith("http") ? (
                            <a className="nf-dropdown-item" href={nota.xmlUrl} target="_blank" rel="noreferrer" onClick={() => setMenuAberto(null)}>
                              <FileText size={14} /> Baixar XML
                            </a>
                          ) : (
                            <button
                              className="nf-dropdown-item"
                              disabled={processando === nota.id}
                              onClick={() => { setMenuAberto(null); consultarStatusNota(nota.id); }}
                            >
                              <FileText size={14} /> {processando === nota.id ? "Buscando…" : "Buscar XML"}
                            </button>
                          )}
                          <button
                            className="nf-dropdown-item"
                            disabled={processando === nota.id}
                            onClick={() => { setMenuAberto(null); enviarEmailNota(nota); }}
                          >
                            <FileText size={14} /> {processando === nota.id ? "Enviando…" : "Enviar por e-mail"}
                          </button>
                          <button
                            className="nf-dropdown-item"
                            onClick={() => { setMenuAberto(null); setNotaParaCorrigir(nota); }}
                          >
                            <Pencil size={14} /> Carta de correção
                          </button>
                          <button
                            className="nf-dropdown-item nf-dropdown-item-danger"
                            disabled={processando === nota.id}
                            onClick={() => { setMenuAberto(null); cancelarNotaAutorizada(nota.id); }}
                          >
                            <Trash2 size={14} /> Cancelar nota (SEFAZ)
                          </button>
                        </>
                      )}
                    </div>
                  )}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      {mostrarForm && (
        <NotaFiscalForm
          nota={editando}
          clientes={clientes}
          produtosDisponiveis={produtosDisponiveis}
          transportadoras={transportadoras}
          colaboradores={colaboradores}
          veiculos={veiculos}
          criarCliente={criarCliente}
          criarTransportadora={criarTransportadora}
          criarVeiculo={criarVeiculo}
          criarColaborador={criarColaborador}
          onSave={salvar}
          onCancel={() => { setMostrarForm(false); setEditando(null); }}
        />
      )}
      {notaParaCorrigir && (
        <CartaCorrecaoModal nota={notaParaCorrigir} onClose={() => setNotaParaCorrigir(null)} />
      )}
      {relatorio === "nfe" && <RelatorioNfeModal onFechar={() => setRelatorio(null)} />}
      {notaParaGuia && (
        <GuiaFlorestalModal
          nota={notaParaGuia}
          onFechar={() => setNotaParaGuia(null)}
          onSalvo={() => { setNotaParaGuia(null); carregar(); }}
        />
      )}
    </div>
  );
}

// ---------- CTe (Conhecimento de Transporte Eletrônico) ----------
// Mesma ideia da Nota Fiscal, mas sem itens de produto — em vez disso tem
// origem/destino do trajeto, veículo e motorista.

const DEFINICAO_TOMADOR = ["Remetente", "Expedidor", "Recebedor", "Destinatário", "Outros"];

function NfeCteField({ onSelecionar }) {
  const [busca, setBusca] = useState("");
  const [sugestoes, setSugestoes] = useState([]);
  const [aberto, setAberto] = useState(false);
  const [buscando, setBuscando] = useState(false);

  useEffect(() => {
    if (!busca || busca.length < 3) { setSugestoes([]); return; }
    const espera = setTimeout(async () => {
      setBuscando(true);
      try {
        const resultado = await apiRequest(`/documentos-fiscais/nfes-autorizadas?busca=${encodeURIComponent(busca)}`);
        setSugestoes(resultado);
      } catch {
        setSugestoes([]);
      } finally {
        setBuscando(false);
      }
    }, 350);
    return () => clearTimeout(espera);
  }, [busca]);

  return (
    <div className="ncm-field">
      <input
        value={busca}
        onChange={e => { setBusca(e.target.value); setAberto(true); }}
        onFocus={() => setAberto(true)}
        onBlur={() => setTimeout(() => setAberto(false), 150)}
        placeholder="Busque pela chave de acesso ou número da nota"
      />
      {aberto && (buscando || sugestoes.length > 0) && (
        <div className="ncm-suggestions">
          {buscando && <div className="ncm-suggestion-loading">Buscando…</div>}
          {sugestoes.map(s => (
            <button
              key={s.id}
              type="button"
              className="ncm-suggestion"
              onMouseDown={() => { onSelecionar(s); setBusca(""); setAberto(false); }}
            >
              <span className="ncm-codigo">Nº {s.numero}</span>
              <span className="ncm-descricao">{s.destinatario?.nomeRazaoSocial} — R$ {formatarMoeda(Number(s.valorTotal || 0))}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function CteForm({ cte, clientes, produtos, transportadoras, veiculos, colaboradores, motoristas, criarCliente, criarTransportadora, criarVeiculo, onSave, onCancel }) {
  const hoje = new Date().toISOString().slice(0, 10);
  const [dataEmissao, setDataEmissao] = useState(cte?.dataEmissao ? cte.dataEmissao.slice(0, 10) : hoje);
  // Documento novo já nasce com o colaborador de quem está emitindo — o
  // vínculo vem do cadastro do usuário.
  const [colaboradorResponsavelId, setColaboradorResponsavelId] = useState(
    cte?.colaboradorResponsavelId ? String(cte.colaboradorResponsavelId) : colaboradorDoUsuario()
  );
  // A natureza da operação é a própria descrição do CFOP — ter os dois na
  // tela só criava chance de um contradizer o outro. O campo saiu e o valor
  // passa a vir do CFOP escolhido.
  const [naturezaOperacao, setNaturezaOperacao] = useState(cte?.naturezaOperacao || "");
  // CT-e novo já nasce com o CFOP configurado em Configurações.
  const [cfopPrestacao, setCfopPrestacao] = useState(cte?.cfopPrestacao || cfopPadraoCte());
  const [tipoServico, setTipoServico] = useState(cte?.tipoServico || "Normal");
  const [dataTransporte, setDataTransporte] = useState(cte?.dataTransporte ? cte.dataTransporte.slice(0, 10) : hoje);
  const [horaTransporte, setHoraTransporte] = useState(cte?.horaTransporte || "");
  const [cteGlobalizado, setCteGlobalizado] = useState(cte?.cteGlobalizado ?? false);
  const [tipoCte, setTipoCte] = useState(cte?.tipoCte || "CT-e normal");
  const DOCUMENTO_VAZIO = {
    tipo: "Fiscal", notaFiscalId: null, chaveAcesso: "", numeroDocumento: "", modelo: "55", serie: "1",
    cfopPredominante: "", dataEmissao: "", naturezaMercadoria: "", outrasCaracteristicasCarga: "",
    baseCalculoIcms: "", valorIcms: "", baseCalculoIcmsSt: "", valorIcmsSt: "", valorTotalProdutos: "", valorTotalNota: "",
    pesoBruto: "", m3: "", quantidadeVolumes: "", pesoLiquido: "",
    pinSuframa: "", numeroPedido: "", numeroRomaneio: "", valorCargaAverbacao: "",
  };
  const [documentosTransportados, setDocumentosTransportados] = useState(
    (cte?.documentosTransportados || []).map(d => ({ ...d, dataEmissao: d.dataEmissao ? d.dataEmissao.slice(0, 10) : "", _key: d.id }))
  );
  const [docEmEdicao, setDocEmEdicao] = useState({ ...DOCUMENTO_VAZIO });
  const setDocCampo = (campo, valor) => setDocEmEdicao(prev => ({ ...prev, [campo]: valor }));

  // A chave de acesso costuma ser copiada do DANFE, onde vem separada em
  // blocos de quatro. Tiramos tudo que não é número e, quando os 44 dígitos
  // estão completos, preenchemos o que a própria chave já informa —
  // modelo, série e número do documento vivem dentro dela.
  const preencherPelaChave = (digitado) => {
    const chave = String(digitado || "").replace(/\D/g, "").slice(0, 44);

    setDocEmEdicao(prev => {
      const atualizado = { ...prev, chaveAcesso: chave };
      if (chave.length !== 44) return atualizado;

      // Posições fixas do layout da chave:
      // UF(2) AAMM(4) CNPJ(14) modelo(2) série(3) número(9) ...
      const modelo = chave.slice(20, 22);
      const serie = String(Number(chave.slice(22, 25)));
      const numero = String(Number(chave.slice(25, 34)));

      return {
        ...atualizado,
        modelo: modelo || prev.modelo,
        serie: serie || prev.serie,
        // Não sobrescreve o que já foi digitado à mão.
        numeroDocumento: prev.numeroDocumento || numero,
      };
    });
  };

  // Dígito verificador da chave (módulo 11): chave digitada errado é a
  // causa mais comum de rejeição do CT-e.
  const chaveConfere = (chave) => {
    const d = String(chave || "").replace(/\D/g, "");
    if (d.length !== 44) return null;
    const pesos = [2, 3, 4, 5, 6, 7, 8, 9];
    let soma = 0;
    for (let i = d.length - 2, p = 0; i >= 0; i--, p++) {
      soma += Number(d[i]) * pesos[p % 8];
    }
    const resto = soma % 11;
    const dv = resto === 0 || resto === 1 ? 0 : 11 - resto;
    return dv === Number(d[43]);
  };

  const selecionarNfeParaDocumento = (nota) => {
    const primeiroItem = nota.itens?.[0];
    setDocEmEdicao({
      tipo: "Fiscal",
      notaFiscalId: nota.id,
      chaveAcesso: nota.chaveAcesso || "",
      numeroDocumento: String(nota.numero || ""),
      modelo: "55",
      serie: String(nota.serie || "1"),
      cfopPredominante: primeiroItem?.cfopUtilizado || primeiroItem?.produto?.cfopPadrao || "",
      dataEmissao: nota.dataEmissao ? nota.dataEmissao.slice(0, 10) : "",
      naturezaMercadoria: nota.naturezaOperacao || "",
      outrasCaracteristicasCarga: "",
      baseCalculoIcms: nota.baseCalculoIcms ?? "",
      valorIcms: nota.valorIcms ?? "",
      baseCalculoIcmsSt: nota.baseCalculoIcmsSt ?? "",
      valorIcmsSt: nota.valorIcmsSt ?? "",
      valorTotalProdutos: nota.valorTotal ?? "",
      valorTotalNota: nota.valorTotal ?? "",
      pesoBruto: nota.pesoBrutoTotal ?? "",
      m3: "",
      quantidadeVolumes: nota.quantidadeVolumes ?? "",
      pesoLiquido: nota.pesoLiquidoTotal ?? "",
      pinSuframa: "",
      numeroPedido: "",
      numeroRomaneio: "",
      valorCargaAverbacao: nota.valorTotal ?? "",
    });
  };

  const novoDocumento = () => setDocEmEdicao({ ...DOCUMENTO_VAZIO });
  const [erroDocumento, setErroDocumento] = useState("");

  const adicionarDocumento = () => {
    // Os valores da nota alimentam o valor da carga e a averbação do
    // seguro no CT-e — sem eles o documento sai com carga zerada.
    const faltando = [];
    if (!docEmEdicao.numeroDocumento && !docEmEdicao.chaveAcesso) faltando.push("número do documento ou chave de acesso");
    if (!docEmEdicao.valorTotalProdutos) faltando.push("valor total dos produtos");
    if (!docEmEdicao.valorTotalNota) faltando.push("valor total da nota fiscal");

    if (faltando.length) {
      setErroDocumento(`Preencha ${faltando.join(", ")}.`);
      return;
    }
    setErroDocumento("");
    setDocumentosTransportados(prev => [...prev, { ...docEmEdicao, _key: `novo-${Date.now()}-${Math.random()}` }]);
    novoDocumento();
  };
  const removerDocumento = (key) => setDocumentosTransportados(prev => prev.filter(d => d._key !== key));
  const [quickAdd, setQuickAdd] = useState(null); // { tipo: 'clientes'|'transportadoras'|'veiculos', setter }

  const [remetenteId, setRemetenteId] = useState(cte?.remetenteId ? String(cte.remetenteId) : "");
  const [expedidorId, setExpedidorId] = useState(cte?.expedidorId ? String(cte.expedidorId) : "");
  const [tomadorId, setTomadorId] = useState(cte?.destinatarioId ? String(cte.destinatarioId) : "");
  const [recebedorId, setRecebedorId] = useState(cte?.recebedorId ? String(cte.recebedorId) : "");
  const [definicaoTomador, setDefinicaoTomador] = useState(cte?.definicaoTomador || "Destinatário");

  const [ufInicio, setUfInicio] = useState(cte?.ufInicio || "");
  const [origemPercurso, setOrigemPercurso] = useState(cte?.origemPercurso || "");
  const [ufFim, setUfFim] = useState(cte?.ufFim || "");
  const [destinoPercurso, setDestinoPercurso] = useState(cte?.destinoPercurso || "");

  // O trajeto é preenchido a partir do endereço do remetente e do
  // destinatário, mas para de ser assim que alguém digita ali: coleta que
  // sai de um pátio ou entrega num armazém de terceiros têm trajeto
  // diferente do endereço cadastrado.
  const [trajetoManual, setTrajetoManual] = useState({ inicio: false, fim: false });

  const enderecoDe = (id) => (clientes || []).find(c => String(c.id) === String(id))?.endereco;

  const preencherTrajeto = (ponta, pessoaId) => {
    const endereco = enderecoDe(pessoaId);
    if (!endereco?.uf || !endereco?.cidade) return;
    if (ponta === "inicio" && !trajetoManual.inicio) {
      setUfInicio(endereco.uf);
      setOrigemPercurso(endereco.cidade);
    }
    if (ponta === "fim" && !trajetoManual.fim) {
      setUfFim(endereco.uf);
      setDestinoPercurso(endereco.cidade);
    }
  };
  const [distanciaKm, setDistanciaKm] = useState(cte?.distanciaKm ?? "");

  const [transportadoraId, setTransportadoraId] = useState(cte?.transportadoraId ? String(cte.transportadoraId) : "");
  const [veiculoId, setVeiculoId] = useState(cte?.veiculoId ? String(cte.veiculoId) : "");
  const [veiculoReboqueId, setVeiculoReboqueId] = useState(cte?.veiculoReboqueId ? String(cte.veiculoReboqueId) : "");
  const [motoristaId, setMotoristaId] = useState("");
  const [veiculoReboque2Id, setVeiculoReboque2Id] = useState(cte?.veiculoReboque2Id ? String(cte.veiculoReboque2Id) : "");
  const [veiculoReboque3Id, setVeiculoReboque3Id] = useState(cte?.veiculoReboque3Id ? String(cte.veiculoReboque3Id) : "");

  // Escolher o veículo traz o motorista habitual dele, que vem do cadastro
  // de colaboradores. Só preenche se ainda não houver motorista escolhido:
  // se alguém já trocou porque hoje é outro, mudar o veículo não desfaz.
  const escolherVeiculo = (id) => {
    setVeiculoId(id);
    const veiculo = (veiculos || []).find(v => String(v.id) === String(id));
    if (veiculo?.motoristaId && !motoristaId) escolherMotorista(String(veiculo.motoristaId));
  };

  // O documento guarda nome e CPF porque é isso que vai no XML; o vínculo
  // com o colaborador é o que evita digitar errado.
  const escolherMotorista = (id) => {
    setMotoristaId(id);
    const pessoa = (motoristas || []).find(m => String(m.id) === String(id));
    setNomeMotorista(pessoa?.nome || "");
    setCpfMotorista(pessoa?.cpf ? formatCPF(pessoa.cpf) : "");
  };

  // Cadastra cliente/transportadora/veículo sem sair do CTe, e já
  // seleciona o registro novo no campo certo assim que salvar.
  const CRIAR_POR_TIPO = { clientes: criarCliente, transportadoras: criarTransportadora, veiculos: criarVeiculo };
  const salvarQuickAdd = async (dados) => {
    const criado = await CRIAR_POR_TIPO[quickAdd.tipo](dados);
    quickAdd.setter(String(criado.id));
    setQuickAdd(null);
  };
  const [nomeMotorista, setNomeMotorista] = useState(cte?.nomeMotorista || "");
  const [cpfMotorista, setCpfMotorista] = useState(cte?.cpfMotorista || "");

  const [formaPagamento, setFormaPagamento] = useState(cte?.formaPagamento || "A pagar (FOB)");
  const [valorTotal, setValorTotal] = useState(cte?.valorTotal ?? "");
  const [cstIcmsPrestacao, setCstIcmsPrestacao] = useState(cte?.cstIcmsPrestacao || "");
  const [baseCalculoIcmsPrestacao, setBaseCalculoIcmsPrestacao] = useState(cte?.baseCalculoIcmsPrestacao ?? "");
  const [aliquotaIcmsPrestacao, setAliquotaIcmsPrestacao] = useState(cte?.aliquotaIcmsPrestacao ?? "");
  const [valorIcms, setValorIcms] = useState(cte?.valorIcms ?? "");
  const [percentualReducaoBaseIcms, setPercentualReducaoBaseIcms] = useState(cte?.percentualReducaoBaseIcms ?? "");
  const [valorCreditoPresumidoIcms, setValorCreditoPresumidoIcms] = useState(cte?.valorCreditoPresumidoIcms ?? "");
  // Reforma Tributária: enquanto a cobrança não entra em vigor, todo CT-e
  // sai com a mesma combinação. Ficam travados para ninguém alterar sem
  // querer; quando a lei valer de fato, é aqui que se volta a mexer.
  const IBS_CBS_CST_PADRAO = "000";
  const IBS_CBS_CLASSIFICACAO_PADRAO = "000001";
  const [cstIbsCbsPrestacao, setCstIbsCbsPrestacao] = useState(cte?.cstIbsCbsPrestacao || IBS_CBS_CST_PADRAO);
  const [classificacaoTributariaIbsCbsPrestacao, setClassificacaoTributariaIbsCbsPrestacao] =
    useState(cte?.classificacaoTributariaIbsCbsPrestacao || IBS_CBS_CLASSIFICACAO_PADRAO);

  const [informacoesComplementares, setInformacoesComplementares] = useState(cte?.informacoesComplementares || "");
  const [erro, setErro] = useState("");
  const [salvando, setSalvando] = useState(false);

  const salvar = async () => {
    if (!tomadorId) { setErro("Selecione o destinatário."); return; }
    if (!valorTotal || Number(valorTotal) <= 0) { setErro("Informe o valor da prestação de serviço."); return; }
    setErro("");
    setSalvando(true);
    try {
      await onSave({
        tomadorId: Number(tomadorId),
        remetenteId: remetenteId ? Number(remetenteId) : undefined,
        expedidorId: expedidorId ? Number(expedidorId) : undefined,
        recebedorId: recebedorId ? Number(recebedorId) : undefined,
        documentosTransportados: documentosTransportados.map(d => ({
          notaFiscalId: d.notaFiscalId || undefined,
          tipo: d.tipo,
          chaveAcesso: d.chaveAcesso || undefined,
          numeroDocumento: d.numeroDocumento || undefined,
          modelo: d.modelo || undefined,
          serie: d.serie || undefined,
          cfopPredominante: d.cfopPredominante || undefined,
          dataEmissao: d.dataEmissao || undefined,
          naturezaMercadoria: d.naturezaMercadoria || undefined,
          outrasCaracteristicasCarga: d.outrasCaracteristicasCarga || undefined,
          baseCalculoIcms: d.baseCalculoIcms !== "" ? Number(d.baseCalculoIcms) : undefined,
          valorIcms: d.valorIcms !== "" ? Number(d.valorIcms) : undefined,
          baseCalculoIcmsSt: d.baseCalculoIcmsSt !== "" ? Number(d.baseCalculoIcmsSt) : undefined,
          valorIcmsSt: d.valorIcmsSt !== "" ? Number(d.valorIcmsSt) : undefined,
          valorTotalProdutos: d.valorTotalProdutos !== "" ? Number(d.valorTotalProdutos) : undefined,
          valorTotalNota: d.valorTotalNota !== "" ? Number(d.valorTotalNota) : undefined,
          pesoBruto: d.pesoBruto !== "" ? Number(d.pesoBruto) : undefined,
          m3: d.m3 !== "" ? Number(d.m3) : undefined,
          quantidadeVolumes: d.quantidadeVolumes !== "" ? Number(d.quantidadeVolumes) : undefined,
          pesoLiquido: d.pesoLiquido !== "" ? Number(d.pesoLiquido) : undefined,
          pinSuframa: d.pinSuframa || undefined,
          numeroPedido: d.numeroPedido || undefined,
          numeroRomaneio: d.numeroRomaneio || undefined,
          valorCargaAverbacao: d.valorCargaAverbacao !== "" ? Number(d.valorCargaAverbacao) : undefined,
        })),
        definicaoTomador,
        transportadoraId: transportadoraId ? Number(transportadoraId) : undefined,
        veiculoId: veiculoId ? Number(veiculoId) : undefined,
        veiculoReboqueId: veiculoReboqueId ? Number(veiculoReboqueId) : null,
        veiculoReboque2Id: veiculoReboque2Id ? Number(veiculoReboque2Id) : null,
        veiculoReboque3Id: veiculoReboque3Id ? Number(veiculoReboque3Id) : null,
        nomeMotorista: nomeMotorista || undefined,
        cpfMotorista: cpfMotorista || undefined,
        origemPercurso: origemPercurso || undefined,
        destinoPercurso: destinoPercurso || undefined,
        ufInicio: ufInicio || undefined,
        ufFim: ufFim || undefined,
        distanciaKm: distanciaKm !== "" ? Number(distanciaKm) : undefined,
naturezaOperacao: naturezaOperacao || undefined,
        cfopPrestacao: cfopPrestacao || undefined,
        tipoServico,
        dataTransporte: dataTransporte || undefined,
        horaTransporte: horaTransporte || undefined,
        cteGlobalizado,
        tipoCte,
        formaPagamento,
        informacoesComplementares,
        dataEmissao: dataEmissao || undefined,
        colaboradorResponsavelId: colaboradorResponsavelId ? Number(colaboradorResponsavelId) : undefined,
        cstIcmsPrestacao: cstIcmsPrestacao || undefined,
        baseCalculoIcmsPrestacao: baseCalculoIcmsPrestacao !== "" ? Number(baseCalculoIcmsPrestacao) : undefined,
        aliquotaIcmsPrestacao: aliquotaIcmsPrestacao !== "" ? Number(aliquotaIcmsPrestacao) : undefined,
        valorIcms: valorIcms !== "" ? Number(valorIcms) : undefined,
        percentualReducaoBaseIcms: percentualReducaoBaseIcms !== "" ? Number(percentualReducaoBaseIcms) : undefined,
        valorCreditoPresumidoIcms: valorCreditoPresumidoIcms !== "" ? Number(valorCreditoPresumidoIcms) : undefined,
        cstIbsCbsPrestacao: cstIbsCbsPrestacao || IBS_CBS_CST_PADRAO,
        classificacaoTributariaIbsCbsPrestacao: classificacaoTributariaIbsCbsPrestacao || IBS_CBS_CLASSIFICACAO_PADRAO,
        valorTotal: Number(valorTotal),
        produtoPredominante: produtoPredominante || sugestaoProduto || undefined,
        unidadeMedidaCarga,
        // Os totais saem da lista de notas transportadas. Vão como null
        // para que o servidor some as notas em vez de usar um valor antigo
        // que tenha ficado gravado.
        valorTotalCarga: null,
        pesoBrutoTotal: null,
        pesoLiquidoTotal: null,
        volumeM3Total: null,
      });
    } catch (e) {
      setErro(e.message || "Erro ao salvar o CTe");
    } finally {
      setSalvando(false);
    }
  };

  const opcoesPessoas = (clientes || []).map(c => <option key={c.id} value={c.id}>{rotuloPessoa(c)}</option>);

  const [produtoPredominante, setProdutoPredominante] = useState(cte?.produtoPredominante || "");
  // Como o produto é negociado: decide quais medidas saem no DACTe.
  const [unidadeMedidaCarga, setUnidadeMedidaCarga] = useState(cte?.unidadeMedidaCarga || "KG");

  // Escolher o produto no cadastro já define como a carga é medida — é a
  // unidade do próprio produto que diz se a venda é por peso ou por volume.
  const escolherProdutoPredominante = (descricao) => {
    setProdutoPredominante(descricao);
    const produto = (produtos || []).find(p => p.descricao === descricao);
    if (!produto?.unidade) return;
    const unidade = String(produto.unidade).toUpperCase();
    if (unidade === "M3") setUnidadeMedidaCarga("M3");
    else if (unidade === "TON") setUnidadeMedidaCarga("TON");
    else if (unidade === "KG") setUnidadeMedidaCarga("KG");
  };

  // A carga vem das notas vinculadas; os campos acima só existem para
  // corrigir quando a soma não representa o que está no caminhão.
  const somarNotas = (campo) => documentosTransportados.reduce((t, d) => t + (Number(d[campo]) || 0), 0);
  const somaNotas = somarNotas("valorTotalNota");
  const somaPesoBruto = somarNotas("pesoBruto");
  const somaPesoLiquido = somarNotas("pesoLiquido");
  const somaM3 = somarNotas("m3");
  const sugestaoProduto = documentosTransportados.find(d => d.naturezaMercadoria)?.naturezaMercadoria || "";

  const [aba, setAba] = useState("rota");

  // Foco no primeiro campo da aba aberta. Vale na abertura do formulário —
  // sem isso o TAB começava nos botões da tela de trás — e a cada troca de
  // aba, para quem preenche pelo teclado não precisar pegar o mouse.
  const corpo = useRef(null);
  useEffect(() => {
    const t = setTimeout(() => {
      const painel = corpo.current?.querySelector(`[data-painel="${aba}"]`);
      const campo = painel?.querySelector(
        'input:not([type=hidden]):not([disabled]), select:not([disabled]), textarea:not([disabled])'
      );
      campo?.focus();
    }, 50);
    return () => clearTimeout(t);
  }, [aba]);

  const interestadual = Boolean(ufInicio && ufFim && ufInicio !== ufFim);
  const cfopSugerido = interestadual ? "6353" : "5353";
  const cfopIncompativel = Boolean(cfopPrestacao && ufInicio && ufFim && cfopPrestacao.startsWith("6") !== interestadual);

  return (
    <div className="modal-backdrop">
      <div className="modal modal-cadastro">
        <div className="modal-header" style={{ display: "block", paddingBottom: 0 }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12 }}>
            <h3>{cte?.id ? "Editar" : "Novo"} CTe</h3>
            <button className="icon-btn" onClick={onCancel} aria-label="Fechar"><X size={18} /></button>
          </div>

          <div className="cte-abas" role="tablist">
            <button type="button" role="tab" className="cte-aba" aria-selected={aba === "rota"} onClick={() => setAba("rota")}>
              Rota e pessoas
            </button>
            <button type="button" role="tab" className="cte-aba" aria-selected={aba === "carga"} onClick={() => setAba("carga")}>
              Carga e documentos <span className="cte-contador">{documentosTransportados.length}</span>
            </button>
            <button type="button" role="tab" className="cte-aba" aria-selected={aba === "valores"} onClick={() => setAba("valores")}>
              Valores e impostos
            </button>
          </div>
        </div>
        <div className="modal-body cte-corpo" ref={corpo}>
          <div data-painel="carga" hidden={aba !== "carga"}>
          <div className="nf-section">
            <h4 className="nf-section-title">Carga</h4>
            <div className="nf-grid-3">
              <div className="field-group">
                <label className="field-label">Produto predominante</label>
                {/* Busca no cadastro de produtos: escolher um produto já
                    define como a carga é medida. */}
                <input
                  list="produtos-predominante"
                  value={produtoPredominante}
                  placeholder={sugestaoProduto || "Busque no cadastro de produtos"}
                  onChange={e => escolherProdutoPredominante(e.target.value)}
                />
                <datalist id="produtos-predominante">
                  {(produtos || []).map(p => (
                    <option key={p.id} value={p.descricao}>{[p.codigo, p.unidade].filter(Boolean).join(" · ")}</option>
                  ))}
                </datalist>
                <p className="hint">É o que aparece no DACTe e o que a fiscalização de estrada confere na carroceria.</p>
              </div>
              <div className="field-group">
                <label className="field-label">Produto vendido por</label>
                <select value={unidadeMedidaCarga} onChange={e => setUnidadeMedidaCarga(e.target.value)}>
                  <option value="KG">Quilo (kg)</option>
                  <option value="TON">Tonelada</option>
                  <option value="M3">Metro cúbico (m³)</option>
                </select>
                <p className="hint">
                  {unidadeMedidaCarga === "M3"
                    ? "O DACTe sai com peso bruto e volume em m³."
                    : "O DACTe sai com peso bruto e peso líquido."}
                </p>
              </div>
            </div>
          </div>

          <div className="nf-section">
            <h4 className="nf-section-title">Notas fiscais transportadas</h4>
            {documentosTransportados.length > 0 ? (
              <div className="nf-itens-table" style={{ marginBottom: 14 }}>
                <div className="nf-itens-header" style={{ gridTemplateColumns: "0.8fr 0.6fr 0.45fr 1fr 0.85fr 0.75fr 0.75fr 0.65fr 1fr 28px" }}>
                  <span>Número</span>
                  <span>Modelo</span>
                  <span>Série</span>
                  <span>CFOP</span>
                  <span>Emissão</span>
                  <span>Peso bruto (kg)</span>
                  <span>Peso líq. (kg)</span>
                  <span>m³</span>
                  <span style={{ textAlign: "right" }}>Valor</span>
                  <span></span>
                </div>
                {documentosTransportados.map(d => (
                  <div key={d._key} className="nf-item-row" style={{ gridTemplateColumns: "0.8fr 0.6fr 0.45fr 1fr 0.85fr 0.75fr 0.75fr 0.65fr 1fr 28px" }}>
                    <span>{d.numeroDocumento || "—"}</span>
                    <span>{d.modelo || "—"}</span>
                    <span>{d.serie || "—"}</span>
                    <span style={{ fontSize: 11.5, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{d.cfopPredominante || "—"}</span>
                    <span>{d.dataEmissao ? new Date(d.dataEmissao).toLocaleDateString("pt-BR") : "—"}</span>
                    <span>{d.pesoBruto || "0"}</span>
                    <span>{d.pesoLiquido || "0"}</span>
                    <span>{d.m3 || "0"}</span>
                    <span className="nf-item-total">R$ {formatarMoeda(Number(d.valorTotalNota || 0))}</span>
                    <button type="button" className="icon-btn icon-btn-danger" onClick={() => removerDocumento(d._key)} aria-label="Remover">
                      <Trash2 size={14} />
                    </button>
                  </div>
                ))}
                {/* Estes totais são o que vai para o DACTe quando os campos
                    de carga são deixados em branco. */}
                <div style={{ display: "grid", gridTemplateColumns: "0.8fr 0.6fr 0.45fr 1fr 0.85fr 0.75fr 0.75fr 0.65fr 1fr 28px", padding: "8px 10px", borderTop: "1px solid #e5e3da", fontSize: 12, fontWeight: 600, color: "#55534c" }}>
                  <span style={{ gridColumn: "1 / 5" }}>Total ({documentosTransportados.length})</span>
                  <span></span>
                  <span>{formatarDecimal(somaPesoBruto, 3)}</span>
                  <span>{formatarDecimal(somaPesoLiquido, 3)}</span>
                  <span>{formatarDecimal(somaM3, 3)}</span>
                  <span style={{ textAlign: "right" }}>R$ {formatarMoeda(somaNotas)}</span>
                  <span></span>
                </div>
              </div>
            ) : (
              <p className="hint" style={{ marginTop: 0 }}>Nenhum documento adicionado ainda.</p>
            )}

            <p className="nf-section-title" style={{ marginTop: 4 }}>Identificação do documento</p>
            <div className="nf-grid-3">
              <div className="field-group">
                <label className="field-label">Tipo do documento</label>
                <select value={docEmEdicao.tipo} onChange={e => setDocCampo("tipo", e.target.value)}>
                  <option value="Fiscal">Fiscal</option>
                  <option value="Declaração">Declaração</option>
                  <option value="Dutoviário">Dutoviário</option>
                  <option value="CF-e SAT">CF-e SAT</option>
                  <option value="Outros">Outros</option>
                </select>
              </div>
              {docEmEdicao.tipo === "Fiscal" && (
                <div className="field-group" style={{ gridColumn: "span 2" }}>
                  <label className="field-label">Buscar nota fiscal (chave ou número)</label>
                  <NfeCteField onSelecionar={selecionarNfeParaDocumento} />
                </div>
              )}
            </div>
            <div className="nf-grid-3">
              <div className="field-group">
                <label className="field-label">Chave de acesso</label>
                <input
                  value={docEmEdicao.chaveAcesso}
                  inputMode="numeric"

              <div className="field-group">

                { papel: "Expedidor", descricao: "opcional", valor: expedidorId, setter: setExpedidorId, vazio: "Nenhum" },
                { papel: "Recebedor", descricao: "opcional", valor: recebedorId, setter: setRecebedorId, vazio: "Nenhum" },
                { papel: "Destinatário", descricao: "quem recebe", valor: tomadorId,
                  setter: (v) => { setTomadorId(v); preencherTrajeto("fim", v); }, vazio: "Selecione…", obrigatorio: true },

            <div className="nf-grid-4" style={{ marginTop: 14 }}>
              <div className="field-group">
                <label className="field-label">UF início<span className="req">*</span></label>

                  <p className="hint" style={{ margin: "4px 0 0", fontSize: 11.5 }}>do endereço do destinatário</p>

            <div className="field-group" style={{ marginBottom: 0, maxWidth: 200 }}>

              <input type="number" value={distanciaKm} onChange={e => setDistanciaKm(e.target.value)} />

          </div>

          <div className="nf-section">

                    {(veiculos || []).map(v => <option key={v.id} value={v.id}>{v.placa}</option>)}
                  </select>
                  <button type="button" tabIndex={-1} className="icon-btn nf-menu-trigger" title="Cadastrar veículo novo" onClick={() => setQuickAdd({ tipo: "veiculos", setter: setVeiculoId })}><Plus size={14} /></button>
                </div>
              </div>
              {[
                { rotulo: "1º reboque", valor: veiculoReboqueId, setter: setVeiculoReboqueId },
                { rotulo: "2º reboque", valor: veiculoReboque2Id, setter: setVeiculoReboque2Id },
                { rotulo: "3º reboque", valor: veiculoReboque3Id, setter: setVeiculoReboque3Id },

                    <button type="button" tabIndex={-1} className="icon-btn nf-menu-trigger" title="Cadastrar veículo novo"

            </div>
            <div className="nf-grid-4">
              <div className="field-group">

                </div>
              </div>
              <div className="field-group">
                <label className="field-label">CPF do motorista</label>
                <input value={cpfMotorista} onChange={e => setCpfMotorista(formatCPF(e.target.value))} maxLength={14} />

            </div>
            <p className="hint">

          </div>

          </div>

          <div data-painel="valores" hidden={aba !== "valores"}>
          <div className="nf-section">

                <select value={formaPagamento} onChange={e => setFormaPagamento(e.target.value)}>

                  <option value="Pago (CIF)">Pago (CIF)</option>
                  <option value="Outros">Outros</option>
                </select>
              </div>
              <div className="field-group">
                <label className="field-label">Valor da prestação (R$)<span className="req">*</span></label>
                <InputMoeda value={valorTotal} onChange={setValorTotal} />
              </div>
              <div className="field-group">
                <label className="field-label">Situação tributária (CST)</label>
                <select value={cstIcmsPrestacao} onChange={e => setCstIcmsPrestacao(e.target.value)}>
                  <option value="">Selecione…</option>
                  <option value="00">00 - Tributada integralmente</option>
                  <option value="20">20 - Tributada com redução de base de cálculo</option>
                  <option value="30">30 - Isenta/não tributada com ICMS ST</option>
                  <option value="40">40 - Isenta</option>
                  <option value="41">41 - Não tributada</option>
                  <option value="51">51 - Diferimento</option>
                  <option value="60">60 - Cobrado anteriormente por substituição tributária</option>
                  <option value="70">70 - Tributada com redução de base e ICMS ST</option>
                  <option value="90">90 - Outras (Regime Normal)</option>
                  <option value="90_simples_nacional">90 - Outras (Simples Nacional)</option>
                </select>
              </div>
            </div>
            <div className="nf-grid-4">

              <div className="field-group">

              </div>
              <div className="field-group">
                <label className="field-label">Valor do ICMS (R$)</label>
                <InputMoeda value={valorIcms} onChange={setValorIcms} />
              </div>
              <div className="field-group">
                <label className="field-label">% Redução da base</label>
                <input type="number" value={percentualReducaoBaseIcms} onChange={e => setPercentualReducaoBaseIcms(e.target.value)} />
              </div>
            </div>
            <div className="field-group">
              <label className="field-label">Valor de crédito presumido (R$)</label>
              <InputMoeda value={valorCreditoPresumidoIcms} onChange={setValorCreditoPresumidoIcms} style={{ maxWidth: 220 }} />
            </div>
            <div className="nf-grid-3">
              <div className="field-group">
                <label className="field-label">IBS/CBS — CST (Reforma Tributária)</label>
                <input value={cstIbsCbsPrestacao} disabled />
              </div>
              <div className="field-group">
                <label className="field-label">IBS/CBS — Classificação (cClassTrib)</label>
                <input value={classificacaoTributariaIbsCbsPrestacao} disabled />
              </div>
              <div className="field-group">
                <p className="hint" style={{ marginTop: 22 }}>
                  Fixos enquanto a Reforma Tributária não entra em vigor. Quando a cobrança começar, esses
                  dois campos voltam a ser editáveis e devem ser conferidos com o contador.
                </p>
              </div>
            </div>
            <div className="field-group" style={{ marginBottom: 0 }}>
              <label className="field-label">Informações complementares</label>
              <input value={informacoesComplementares} onChange={e => setInformacoesComplementares(e.target.value)} />
            </div>
          </div>

          </div>

          {erro && <p className="error-text">{erro}</p>}
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onCancel} disabled={salvando}>Cancelar</button>
          <button className="btn btn-primary" onClick={salvar} disabled={salvando}>{salvando ? "Salvando…" : "Salvar rascunho"}</button>
        </div>
      </div>
      {quickAdd && (
        <RecordForm
          moduleKey={quickAdd.tipo}
          record={null}
          onSave={salvarQuickAdd}
          onCancel={() => setQuickAdd(null)}
        />
      )}
    </div>
  );
}
