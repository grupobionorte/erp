<script type="text/babel">

// URL do backend publicado no Render. Troque aqui se o nome do serviço mudar.
const API_BASE_URL = "https://erp-biomassa-backend.onrender.com";

// ---------- Config de módulos ----------

const UFS = ["AC","AL","AP","AM","BA","CE","DF","ES","GO","MA","MT","MS","MG","PA","PB","PR","PE","PI","RJ","RN","RS","RO","RR","SC","SP","SE","TO"];

const CST_ICMS = [

  { value: "202", label: "202 - Tributada pelo Simples Nacional sem permissão de crédito e com ICMS ST" },
  { value: "203", label: "203 - Isenção do ICMS para faixa de receita bruta e com ICMS ST" },
  { value: "300", label: "300 - Imune" },
  { value: "400", label: "400 - Não tributada pelo Simples Nacional" },
  { value: "500", label: "500 - ICMS cobrado anteriormente por substituição tributária ou por antecipação" },
  { value: "900", label: "900 - Outros" },
];
const CST_PIS_COFINS = ["01","02","03","04","05","06","07","08","09","49","50","51","52","53","54","55","56","60","61","62","63","64","65","66","67","70","71","72","73","74","75","98","99"];

const emptyEndereco = { cep: "", logradouro: "", numero: "", complemento: "", bairro: "", cidade: "", uf: "MT" };

// ---------- Máscaras (CPF, CNPJ, CEP) ----------
// Aplicadas conforme o usuário digita: guardamos só os dígitos por baixo,
// mas mostramos com pontos/traço/barra formatados.
function formatCPF(v) {
  const d = v.replace(/\D/g, "").slice(0, 11);
  if (d.length > 9) return `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}`;
  if (d.length > 6) return `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6)}`;
  if (d.length > 3) return `${d.slice(0,3)}.${d.slice(3)}`;
  return d;
}
function formatCNPJ(v) {
  const d = v.replace(/\D/g, "").slice(0, 14);
  if (d.length > 12) return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12)}`;
  if (d.length > 8) return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8)}`;
  if (d.length > 5) return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5)}`;
  if (d.length > 2) return `${d.slice(0,2)}.${d.slice(2)}`;
  return d;
}
// Campo "documento" aceita CPF ou CNPJ: enquanto tiver 11 dígitos ou menos
// formata como CPF; passando disso, assume que é CNPJ.
function formatDocumento(v) {
  const d = v.replace(/\D/g, "");
  return d.length > 11 ? formatCNPJ(v) : formatCPF(v);
}
function formatCEP(v) {
  const d = v.replace(/\D/g, "").slice(0, 8);
  if (d.length > 5) return `${d.slice(0,5)}-${d.slice(5)}`;
  return d;
}

// ---------- Valores em reais ----------
// Exibição e digitação no padrão brasileiro: ponto separando milhar e
// vírgula nos centavos (1.234,56). Internamente o valor continua sendo
// número com ponto decimal, que é o que a API e a SEFAZ esperam.
// Colunas das listagens que representam dinheiro e por isso saem com R$.
const COLUNAS_MOEDA = new Set(["valorUnitario", "valorTotal", "valorTotalNota", "valorCarga"]);

const FORMATADOR_MOEDA = new Intl.NumberFormat("pt-BR", {
  minimumFractionDigits: 2,
  maximumFractionDigits: 2,
});

function formatarMoeda(valor) {
  const n = Number(valor);
  if (valor === "" || valor === null || valor === undefined || Number.isNaN(n)) return "";
  return FORMATADOR_MOEDA.format(n);
}

// "1.234,56" -> 1234.56
function moedaParaNumero(texto) {
  if (typeof texto === "number") return texto;
  if (!texto) return 0;
  return Number(String(texto).replace(/\./g, "").replace(",", ".")) || 0;
}

// Campo de digitação de valor: o usuário digita só números e o valor vai se
// formando da direita pra esquerda (centavos primeiro), como em caixa de
// supermercado. onChange devolve o número como string com ponto decimal,
// pra não mudar nada de quem consome esse valor.
function InputMoeda({ value, onChange, placeholder = "0,00", casas = 2, ...resto }) {
  const [texto, setTexto] = useState(() => formatarMoeda(value));
  const [editando, setEditando] = useState(false);

  // Fora de edição mostra formatado (5.000,00); ao focar, mostra o número
  // puro para digitar por cima.
  useEffect(() => {
    if (!editando) setTexto(formatarMoeda(value));
  }, [value, editando]);

  const digitar = (e) => {
    // Só dígitos e uma vírgula. Digitar 5000 vale cinco mil, e os centavos
    // só entram quando se digita a vírgula — como se escreve à mão, e não
    // como caixa de supermercado.
    let limpo = e.target.value.replace(/[^\d,]/g, "");
    const partes = limpo.split(",");
    if (partes.length > 2) limpo = `${partes[0]},${partes.slice(1).join("")}`;
    const [inteiro, decimais] = limpo.split(",");
    if (decimais !== undefined && decimais.length > casas) {
      limpo = `${inteiro},${decimais.slice(0, casas)}`;
    }
    setTexto(limpo);
    onChange(limpo === "" || limpo === "," ? "" : String(decimalParaNumero(limpo)));
  };

  return (
    <input
      inputMode="decimal"
      value={texto}
      placeholder={placeholder}
      onFocus={() => {
        setEditando(true);
        setTexto(value === "" || value === null || value === undefined ? "" : String(value).replace(".", ","));
      }}
      onBlur={() => setEditando(false)}
      onChange={digitar}
      {...resto}
      style={{ textAlign: "right", ...(resto.style || {}) }}
    />
  );
}

// Peso e volume: mesma leitura brasileira do dinheiro (27.500,750), mas a
// digitação aqui é livre — peso se digita inteiro ("27500"), não em
// centavos. O ponto é ignorado enquanto se digita, então quem escrever
// "27.500" continua com 27500 e não com 27,5.
function formatarDecimal(valor, casas = 3) {
  const n = Number(valor);
  if (valor === "" || valor === null || valor === undefined || Number.isNaN(n)) return "";
  return new Intl.NumberFormat("pt-BR", { minimumFractionDigits: casas, maximumFractionDigits: casas }).format(n);
}

function decimalParaNumero(texto) {
  if (typeof texto === "number") return texto;
  if (!texto) return "";
  const limpo = String(texto).replace(/\./g, "").replace(",", ".");
  const n = Number(limpo);
  return Number.isNaN(n) ? "" : n;
}

function InputDecimal({ value, onChange, casas = 3, ...resto }) {
  const [texto, setTexto] = useState(() => formatarDecimal(value, casas));
  const [editando, setEditando] = useState(false);

  // Fora de edição, o campo mostra o número formatado; ao focar, mostra o
  // que dá pra editar sem os separadores de milhar atrapalhando.
  useEffect(() => {
    if (!editando) setTexto(formatarDecimal(value, casas));
  }, [value, casas, editando]);

  const digitar = (e) => {
    // Só dígitos e uma vírgula — ponto digitado é descartado, o que elimina
    // a dúvida entre separador de milhar e decimal.
    let limpo = e.target.value.replace(/[^\d,]/g, "");
    const partes = limpo.split(",");
    if (partes.length > 2) limpo = `${partes[0]},${partes.slice(1).join("")}`;
    setTexto(limpo);
    onChange(limpo === "" || limpo === "," ? "" : String(decimalParaNumero(limpo)));
  };

  return (
    <input
      inputMode="decimal"
      value={texto}
      onFocus={() => { setEditando(true); setTexto(value === "" || value == null ? "" : String(value).replace(".", ",")); }}
      onBlur={() => setEditando(false)}
      onChange={digitar}
      {...resto}
      style={{ textAlign: "right", ...(resto.style || {}) }}
    />
  );
}

function mapEndereco(endereco) {
  if (!endereco) return emptyEndereco;
  const { cep, logradouro, numero, complemento, bairro, cidade, uf } = endereco;
  return { cep: cep || "", logradouro: logradouro || "", numero: numero || "", complemento: complemento || "", bairro: bairro || "", cidade: cidade || "", uf: uf || "MT" };
}

// Alguns módulos (como o cadastro de usuários) só fazem sentido pra quem
// é admin — os demais nem aparecem no menu de um operador.
function modulosParaUsuario(usuario) {
  return Object.entries(MODULES).filter(([, cfg]) => !cfg.adminOnly || usuario?.papel === "admin");
}

// ---------- Cliente da API ----------

// Token fica no localStorage do navegador só desse artifact — cada pessoa
// que abrir precisa logar com seu próprio usuário.
function getToken() {
  try { return localStorage.getItem("erpBiomassaToken"); } catch { return null; }
}
function setToken(token) {
  try {
    if (token) localStorage.setItem("erpBiomassaToken", token);
    else localStorage.removeItem("erpBiomassaToken");
  } catch { /* localStorage indisponível — sessão não persiste ao recarregar */ }
}

async function apiRequest(path, options = {}) {
  const token = getToken();
  const res = await fetch(`${API_BASE_URL}${path}`, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
      ...(options.headers || {}),
    },
  });
  if (res.status === 401) {
    setToken(null);
    window.dispatchEvent(new Event("erp-sessao-expirada"));
  }
  if (!res.ok) {
    let detalhe = res.statusText;
    let detalheProvedor;
    try {
      const corpo = await res.json();
      detalhe = corpo.erro || detalhe;
      detalheProvedor = corpo.detalhe;
    } catch {
      // resposta sem corpo JSON
    }
    const erro = new Error(detalhe);
    erro.detalhe = detalheProvedor;
    throw erro;
  }
  if (res.status === 204) return null;
  return res.json();
}

// Busca, cria, edita e apaga usando o backend real — nada fica só no
// navegador, então qualquer pessoa que abrir esse artifact e apontar pro
// mesmo backend vê os mesmos dados.
function useApiCollection(moduleKey) {
  const config = MODULES[moduleKey];
  const [items, setItems] = useState(null);
  const [erro, setErro] = useState(null);

  const [mostrarInativas, setMostrarInativas] = useState(false);

  const carregar = useCallback(async () => {
    try {
      setErro(null);
      const partes = [config.listQuery, mostrarInativas ? "inativas=1" : null].filter(Boolean);
      const query = partes.length ? `?${partes.join("&")}` : "";
      const dados = await apiRequest(`${config.apiPath}${query}`);
      setItems(dados.map(config.fromApi));
    } catch (e) {
      setErro(e.message);
      setItems([]);
    }
  }, [moduleKey, mostrarInativas]);

  const reativar = useCallback(async (id) => {
    await apiRequest(`${config.apiPath}/${id}/reativar`, { method: "POST" });
    await carregar();
  }, [moduleKey, carregar]);

  useEffect(() => { carregar(); }, [carregar]);

  const criar = useCallback(async (data) => {
    const registro = await apiRequest(config.createPath || config.apiPath, {
      method: "POST",
      body: JSON.stringify(config.toApi(data)),
    });
    const criado = config.fromApi(registro);
    setItems((atual) => [...(atual || []), criado]);
    return criado;
  }, [moduleKey]);

  const editar = useCallback(async (id, data) => {
    const registro = await apiRequest(`${config.apiPath}/${id}`, {
      method: "PUT",
      body: JSON.stringify(config.toApi(data)),
    });
    setItems((atual) => atual.map((it) => (it.id === id ? config.fromApi(registro) : it)));
  }, [moduleKey]);

  const remover = useCallback(async (id) => {
    await apiRequest(`${config.apiPath}/${id}`, { method: "DELETE" });
    setItems((atual) => atual.filter((it) => it.id !== id));
  }, [moduleKey]);

  return { items, erro, recarregar: carregar, criar, editar, remover, reativar, mostrarInativas, setMostrarInativas };
}

// navegador bloqueia abrir janela fora de um clique. Por isso a aba é aberta

function abrirAbaDeEspera(documento, anexo) {
  try {
    const aba = window.open("", "_blank");
    if (aba) {
      aba.document.write(
        `<title>Emitindo ${documento}…</title>` +
        "<body style='font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#16293C;color:#EAF1F6;" +
        "display:flex;align-items:center;justify-content:center;height:100vh;margin:0'>" +
        `<div style='text-align:center'><h2 style='font-weight:400'>Emitindo ${documento}…</h2>` +
        `<p style='opacity:.7;font-size:14px'>O ${anexo} abre aqui assim que a SEFAZ autorizar.</p></div></body>`
      );
    }
    return aba;
  } catch {
    return null;
  }
}
const abrirNaAba = (aba, url) => { if (aba && !aba.closed) aba.location.href = url; else window.open(url, "_blank"); };
const fecharAba = (aba) => { try { if (aba && !aba.closed) aba.close(); } catch { /* já fechada */ } };

function getPath(obj, path) {
  return path.split(".").reduce((o, k) => (o ? o[k] : undefined), obj);
}

function NcmField({ value, onChange }) {
  const [sugestoes, setSugestoes] = useState([]);
  const [aberto, setAberto] = useState(false);
  const [buscando, setBuscando] = useState(false);

  useEffect(() => {
    if (!value || value.length < 2) { setSugestoes([]); return; }
    const espera = setTimeout(async () => {
      setBuscando(true);
      try {
        const resultado = await apiRequest(`/ncms?busca=${encodeURIComponent(value)}`);
        setSugestoes(resultado);
      } catch {
        setSugestoes([]);
      } finally {
        setBuscando(false);
      }
    }, 350);
    return () => clearTimeout(espera);
  }, [value]);

  return (
    <div className="ncm-field">
      <input
        value={value ?? ""}
        onChange={e => { onChange(e.target.value); setAberto(true); }}
        onFocus={() => setAberto(true)}
        onBlur={() => setTimeout(() => setAberto(false), 150)}
        placeholder="Digite o código ou parte da descrição"
      />
      {aberto && (buscando || sugestoes.length > 0) && (
        <div className="ncm-suggestions">
          {buscando && <div className="ncm-suggestion-loading">Buscando…</div>}
          {sugestoes.map(s => (
            <button
              key={s.codigo}
              type="button"
              className="ncm-suggestion"
              onMouseDown={() => { onChange(s.codigo); setAberto(false); }}
            >
              <span className="ncm-codigo">{s.codigo}</span>
              <span className="ncm-descricao">{s.descricao}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function CfopField({ value, onChange, onDescricao }) {
  const [sugestoes, setSugestoes] = useState([]);
  const [aberto, setAberto] = useState(false);
  const [buscando, setBuscando] = useState(false);
  const [descricao, setDescricao] = useState("");
  const [editando, setEditando] = useState(false);

  // Código sozinho não diz nada pra quem não decorou a tabela. Assim que o
  // código está completo, buscamos a descrição — ela aparece no campo junto
  // do código e também vira a natureza da operação do documento.
  useEffect(() => {
    const codigo = String(value || "").replace(/\D/g, "");
    if (codigo.length !== 4) {
      setDescricao("");
      onDescricao?.("");
      return;
    }
    let cancelado = false;
    (async () => {
      try {
        const resultado = await apiRequest(`/cfops?busca=${codigo}`);
        const exato = resultado.find(c => c.codigo === codigo);
        if (!cancelado) {
          setDescricao(exato?.descricao || "");
          onDescricao?.(exato?.descricao || "");
        }
      } catch {
        if (!cancelado) setDescricao("");
      }
    })();
    return () => { cancelado = true; };
  }, [value]);

  useEffect(() => {
    if (!value || value.length < 2) { setSugestoes([]); return; }
    const espera = setTimeout(async () => {
      setBuscando(true);
      try {
        const resultado = await apiRequest(`/cfops?busca=${encodeURIComponent(value)}`);
        setSugestoes(resultado);
      } catch {
        setSugestoes([]);
      } finally {
        setBuscando(false);
      }
    }, 350);
    return () => clearTimeout(espera);
  }, [value]);

  // Fora de edição o campo mostra "5352 - Prestação de serviço…", que é
  // como se lê um CFOP. Ao clicar, volta ao código puro para digitar ou
  // buscar sem apagar texto à mão.
  const textoExibido = !editando && descricao ? `${value} - ${descricao}` : (value ?? "");

  return (
    <div className="ncm-field">
      <input
        value={textoExibido}
        title={descricao ? `${value} - ${descricao}` : undefined}
        onChange={e => { onChange(e.target.value); setAberto(true); }}
        onFocus={e => { setEditando(true); setAberto(true); setTimeout(() => e.target.select(), 0); }}
        onBlur={() => { setEditando(false); setTimeout(() => setAberto(false), 150); }}
        placeholder="Digite o código ou parte da descrição"
      />
      {aberto && (buscando || sugestoes.length > 0 || (value || "").length >= 2) && (
        <div className="ncm-suggestions">
          {buscando && <div className="ncm-suggestion-loading">Buscando…</div>}
          {/* Sem resultado a lista sumia, e parecia que a busca tinha
              travado no "Buscando". */}
          {!buscando && sugestoes.length === 0 && (value || "").length >= 2 && (
            <div className="ncm-suggestion-loading">Nenhum CFOP encontrado para "{value}"</div>
          )}
          {sugestoes.map(s => (
            <button
              key={s.codigo}
              type="button"
              className="ncm-suggestion"
              onMouseDown={() => { onChange(s.codigo); setDescricao(s.descricao); onDescricao?.(s.descricao); setAberto(false); }}
            >
              <span className="ncm-codigo">{s.codigo}</span>
              <span className="ncm-descricao">{s.descricao}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function Field({ field, value, onChange, disabled }) {
  // Campo que puxa outro cadastro para vincular (usuário <-> colaborador).
  // A lista vem da própria API, então o que aparece aqui é sempre o que
  // está cadastrado de verdade.
  if (field.type === "vinculo") {
    const [opcoes, setOpcoes] = useState(null);
    const [erroFonte, setErroFonte] = useState("");

    useEffect(() => {
      let cancelado = false;
      (async () => {
        try {
          const dados = await apiRequest(field.fonte);
          if (!cancelado) setOpcoes(dados);
        } catch (e) {
          // Listar usuários é coisa de admin: um operador abrindo a tela de
          // colaboradores não deve ver erro, só o campo indisponível.
          if (!cancelado) { setErroFonte(e.message); setOpcoes([]); }
        }
      })();
      return () => { cancelado = true; };
    }, [field.fonte]);

    const rotuloDe = (registro) => (field.rotulo ? field.rotulo(registro) : registro.nome);

    return (
      <div className="field-group">
        <label className="field-label">{field.label}</label>
        <select
          value={value ?? ""}
          disabled={disabled || opcoes === null || !!erroFonte}
          onChange={e => onChange(e.target.value ? Number(e.target.value) : null)}
        >
          <option value="">{opcoes === null ? "Carregando…" : field.vazio || "Sem vínculo"}</option>
          {(opcoes || []).map(o => (
            <option key={o.id} value={o.id}>{rotuloDe(o)}</option>
          ))}
        </select>
        {erroFonte && <p className="pf-ajuda">Só um admin pode ver essa lista.</p>}
        {!erroFonte && field.ajuda && <p className="pf-ajuda">{field.ajuda}</p>}
      </div>
    );
  }

  if (field.type === "endereco") {
    const v = value || emptyEndereco;
    const [buscandoCep, setBuscandoCep] = useState(false);
    const set = (k, val) => onChange({ ...v, [k]: val });

    // Assim que o CEP tem 8 dígitos, busca o endereço na base pública dos
    // Correios (ViaCEP) e preenche rua, bairro, cidade e UF sozinho — o
    // usuário só confere e completa o número.
    const buscarPorCep = async (cepDigitado) => {
      const digitos = cepDigitado.replace(/\D/g, "");
      set("cep", cepDigitado);
      if (digitos.length !== 8) return;
      setBuscandoCep(true);
      try {
        const res = await fetch(`https://viacep.com.br/ws/${digitos}/json/`);
        const dados = await res.json();
        if (!dados.erro) {
          onChange({
            ...v,
            cep: cepDigitado,
            logradouro: dados.logradouro || v.logradouro,
            bairro: dados.bairro || v.bairro,
            cidade: dados.localidade || v.cidade,
            uf: dados.uf || v.uf,
          });
        }
      } catch {
        // sem internet ou CEP inválido — usuário preenche na mão mesmo
      } finally {
        setBuscandoCep(false);
      }
    };

    return (
      <div className="field-group">
        <label className="field-label">{field.label}</label>
        <div className="endereco-grid">
          <input placeholder={buscandoCep ? "Buscando…" : "CEP"} value={v.cep} onChange={e => buscarPorCep(formatCEP(e.target.value))} maxLength={9} />
          <input placeholder="Logradouro" value={v.logradouro} onChange={e => set("logradouro", e.target.value)} className="col-span-2" />
          <input placeholder="Número" value={v.numero} onChange={e => set("numero", e.target.value)} />
          <input placeholder="Complemento" value={v.complemento} onChange={e => set("complemento", e.target.value)} />
          <input placeholder="Bairro" value={v.bairro} onChange={e => set("bairro", e.target.value)} />
          <input placeholder="Cidade" value={v.cidade} onChange={e => set("cidade", e.target.value)} />
          <select value={v.uf} onChange={e => set("uf", e.target.value)}>
            {UFS.map(uf => <option key={uf} value={uf}>{uf}</option>)}
          </select>
        </div>
      </div>
    );
  }

  if (field.type === "imagem-upload") {
    const [erroUpload, setErroUpload] = useState("");
    const inputRef = React.useRef(null);

    const selecionarArquivo = (e) => {
      const arquivo = e.target.files?.[0];
      if (!arquivo) return;
      if (!arquivo.type.startsWith("image/")) {
        setErroUpload("Escolha um arquivo de imagem.");
        return;
      }
      if (arquivo.size > 2 * 1024 * 1024) {
        setErroUpload("A imagem precisa ter até 2 MB.");
        return;
      }
      setErroUpload("");
      const leitor = new FileReader();
      leitor.onload = () => onChange(leitor.result);
      leitor.readAsDataURL(arquivo);
    };

    return (
      <div className="field-group">
        <label className="field-label">{field.label}</label>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{
            width: 56, height: 56, borderRadius: 8, border: "1px solid #e5e3da",
            display: "flex", alignItems: "center", justifyContent: "center",
            overflow: "hidden", background: "#fafaf8", flexShrink: 0,
          }}>
            {value
              ? <img src={value} alt="Logo da empresa" style={{ width: "100%", height: "100%", objectFit: "contain" }} />
              : <Building2 size={22} color="#b4b2a9" />}
          </div>
          <div>
            <button type="button" className="btn" onClick={() => inputRef.current?.click()}>
              {value ? "Trocar imagem" : "Escolher imagem"}
            </button>
            {value && (
              <button type="button" className="btn" style={{ marginLeft: 8 }} onClick={() => onChange("")}>
                Remover
              </button>
            )}
            <input ref={inputRef} type="file" accept="image/*" onChange={selecionarArquivo} style={{ display: "none" }} />
          </div>
        </div>
        {erroUpload && <p className="error-text">{erroUpload}</p>}
        <p className="hint">PNG ou JPG, até 2 MB. Aparece na tela de login.</p>
      </div>
    );
  }

  if (field.type === "empresas-multiselect") {
    const [opcoes, setOpcoes] = useState(null);
    useEffect(() => {
      let cancelado = false;
      apiRequest("/empresas")
        .then((dados) => { if (!cancelado) setOpcoes(dados); })
        .catch(() => { if (!cancelado) setOpcoes([]); });
      return () => { cancelado = true; };
    }, []);
    const selecionadas = value || [];
    const toggle = (id) => {
      onChange(selecionadas.includes(id) ? selecionadas.filter(x => x !== id) : [...selecionadas, id]);
    };
    return (
      <div className="field-group">
        <label className="field-label">{field.label}</label>
        <div className="checklist">
          {opcoes === null && <p className="hint">Carregando…</p>}
          {opcoes?.length === 0 && <p className="hint">Nenhuma empresa cadastrada ainda.</p>}
          {(opcoes || []).map(emp => (
            <label key={emp.id} className="checklist-item">
              <input type="checkbox" checked={selecionadas.includes(emp.id)} onChange={() => toggle(emp.id)} />
              {emp.razaoSocial}
            </label>
          ))}
        </div>
        <p className="hint">Só vale pra usuários com papel Operador — Admin acessa todas as empresas automaticamente.</p>
      </div>
    );
  }

  if (field.type === "transportadora-select") {
    const [opcoes, setOpcoes] = useState(null);
    useEffect(() => {
      let cancelado = false;
      apiRequest("/transportadoras")
        .then((dados) => { if (!cancelado) setOpcoes(dados); })
        .catch(() => { if (!cancelado) setOpcoes([]); });
      return () => { cancelado = true; };
    }, []);
    return (
      <div className="field-group">
        <label className="field-label">{field.label}{field.required && <span className="req">*</span>}</label>
        <select value={value ?? ""} onChange={e => onChange(e.target.value)}>
          <option value="">{opcoes === null ? "Carregando…" : "Selecione…"}</option>
          {(opcoes || []).map(t => <option key={t.id} value={t.id}>{t.razaoSocial}</option>)}
        </select>
        {opcoes?.length === 0 && <p className="hint">Nenhuma transportadora cadastrada ainda.</p>}
      </div>
    );
  }

  if (field.type === "ncm-busca") {
    return (
      <div className="field-group">
        <label className="field-label">{field.label}{field.required && <span className="req">*</span>}</label>
        <NcmField value={value} onChange={onChange} />
      </div>
    );
  }

  if (field.type === "cfop-busca") {
    return (
      <div className="field-group">
        <label className="field-label">{field.label}{field.required && <span className="req">*</span>}</label>
        <CfopField value={value} onChange={onChange} />
      </div>
    );
  }

  return (
    <div className="field-group">
      <label className="field-label">{field.label}{field.required && <span className="req">*</span>}</label>
      {field.type === "select" ? (
        <select value={value ?? field.default ?? ""} onChange={e => onChange(e.target.value)} disabled={disabled}>
          <option value="">Selecione…</option>
          {field.options.map(opt => {
            const valorOpcao = typeof opt === "object" ? opt.value : opt;
            const rotuloOpcao = typeof opt === "object" ? opt.label : opt;
            return <option key={valorOpcao} value={valorOpcao}>{rotuloOpcao}</option>;
          })}
        </select>
      ) : field.type === "moeda" ? (
        <InputMoeda value={value ?? ""} onChange={onChange} disabled={disabled} />
      ) : (
        <input
          type={field.type === "number" ? "number" : field.type === "date" ? "date" : field.type === "password" ? "password" : "text"}
          value={value ?? ""}
          disabled={disabled}
          maxLength={field.key === "documento" || field.key === "cnpj" ? 18 : field.key === "cpf" ? 14 : undefined}
          onChange={e => {
            const raw = e.target.value;
            if (field.key === "documento") onChange(formatDocumento(raw));
            else if (field.key === "cnpj") onChange(formatCNPJ(raw));
            else if (field.key === "cpf") onChange(formatCPF(raw));
            else if (field.key === "placa") onChange(raw.toUpperCase());
            else onChange(raw);
          }}
        />
      )}
    </div>
  );
}

// ---------- Cadastro de pessoa (clientes e fornecedores) ----------
// Tela própria em vez do formulário genérico: aqui os campos se ajustam ao
// que está sendo preenchido — pessoa física troca os rótulos, a situação
// fiscal governa a inscrição estadual, e CPF/CNPJ é conferido na digitação.
// Cliente e fornecedor têm telas separadas; por baixo continuam na mesma
// tabela, então o mesmo CNPJ nos dois lugares é um cadastro só.

function soDigitos(v) { return (v || "").replace(/\D/g, ""); }

function formatarDocumento(valor, tipo) {
  const d = soDigitos(valor).slice(0, tipo === "Pessoa Física" ? 11 : 14);
  if (tipo === "Pessoa Física") {
    return d.replace(/^(\d{3})(\d)/, "$1.$2")
            .replace(/^(\d{3})\.(\d{3})(\d)/, "$1.$2.$3")
            .replace(/\.(\d{3})(\d)/, ".$1-$2");
  }
  return d.replace(/^(\d{2})(\d)/, "$1.$2")
          .replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3")
          .replace(/\.(\d{3})(\d)/, ".$1/$2")
          .replace(/(\d{4})(\d)/, "$1-$2");
}

function formatarTelefone(valor) {
  const d = soDigitos(valor).slice(0, 11);
  return d.length > 10
    ? d.replace(/^(\d{2})(\d{5})(\d)/, "($1) $2-$3")
    : d.replace(/^(\d{2})(\d{4})(\d)/, "($1) $2-$3");
}

// Mesma conta que a SEFAZ faz: documento com dígito errado é recusado na
// emissão, então não deixamos entrar no cadastro.
function cnpjValido(c) {
  if (c.length !== 14 || /^(\d)\1+$/.test(c)) return false;
  const calc = (base, pesos) => {
    const soma = base.split("").reduce((t, n, i) => t + Number(n) * pesos[i], 0);
    const r = soma % 11;
    return r < 2 ? 0 : 11 - r;
  };
  return calc(c.slice(0, 12), [5,4,3,2,9,8,7,6,5,4,3,2]) === Number(c[12])
      && calc(c.slice(0, 13), [6,5,4,3,2,9,8,7,6,5,4,3,2]) === Number(c[13]);
}
function cpfValido(c) {
  if (c.length !== 11 || /^(\d)\1+$/.test(c)) return false;
  const dig = (ate) => {
    let soma = 0;
    for (let i = 0; i < ate; i++) soma += Number(c[i]) * (ate + 1 - i);
    const r = (soma * 10) % 11;
    return r === 10 ? 0 : r;
  };
  return dig(9) === Number(c[9]) && dig(10) === Number(c[10]);
}

// ---------- Jornada de trabalho ----------
// Escala com revezamento não cabe em "dia da semana": numa 6x1 a folga
// anda. Por isso a escala é definida por ciclo, a partir de uma data de
// referência, e o deslocamento é o que faz a folga revezar.

const DIAS_SEMANA = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];

function JornadaAba({ colaboradorId }) {
  const [jornadas, setJornadas] = useState(null);
  const [erro, setErro] = useState("");
  const [salvando, setSalvando] = useState(false);
  const hoje = new Date().toISOString().slice(0, 10);

  const [nova, setNova] = useState({
    tipo: "escala",
    vigenciaInicio: hoje,
    toleranciaMinutos: 10,
    diasTrabalho: 6, diasFolga: 1, deslocamentoPorCiclo: 0, dataReferencia: hoje,
    entrada: "07:00", intervaloInicio: "11:00", intervaloFim: "12:00", saida: "17:00",
    dias: DIAS_SEMANA.map((_, i) => ({
      diaSemana: i, folga: i === 0,
      entrada: "07:00", intervaloInicio: "11:00", intervaloFim: "12:00", saida: "17:00",
    })),
  });

  const carregar = useCallback(async () => {
    if (!colaboradorId) { setJornadas([]); return; }
    try { setJornadas(await apiRequest(`/ponto/jornada/${colaboradorId}`)); }
    catch (e) { setErro(e.message); setJornadas([]); }
  }, [colaboradorId]);
  useEffect(() => { carregar(); }, [carregar]);

  const salvar = async () => {
    setErro("");
    setSalvando(true);
    try {
      await apiRequest(`/ponto/jornada/${colaboradorId}`, { method: "POST", body: JSON.stringify(nova) });
      await carregar();
    } catch (e) {
      setErro([e.message, e.detalhe].filter(Boolean).join(" — "));
    } finally {
      setSalvando(false);
    }
  };

  const remover = async (id) => {
    if (!window.confirm("Remover essa jornada? A apuração dos períodos que dependiam dela deixa de ter horário previsto.")) return;
    try { await apiRequest(`/ponto/jornada/${id}`, { method: "DELETE" }); carregar(); }
    catch (e) { alert(`Não foi possível: ${e.message}`); }
  };

  const setCampo = (k, v) => setNova(n => ({ ...n, [k]: v }));
  const setDia = (i, k, v) => setNova(n => ({
    ...n, dias: n.dias.map((d, idx) => idx === i ? { ...d, [k]: v } : d),
  }));

  if (!colaboradorId) {
    return <p className="hint">Salve o colaborador primeiro; depois a aba de jornada fica disponível.</p>;
  }

  const ciclo = (Number(nova.diasTrabalho) || 0) + (Number(nova.diasFolga) || 0);

  return (
    <div>
      {jornadas?.length > 0 && (
        <div className="pf-secao" style={{ paddingTop: 0 }}>
          <h4 className="pf-secao-titulo">Jornadas cadastradas</h4>
          <table className="data-table">
            <thead><tr><th>Vigência</th><th>Tipo</th><th>Horário</th><th>Ciclo</th><th></th></tr></thead>
            <tbody>
              {jornadas.map(j => (
                <tr key={j.id}>
                  <td>
                    {new Date(j.vigenciaInicio).toLocaleDateString("pt-BR")}
                    {j.vigenciaFim ? ` até ${new Date(j.vigenciaFim).toLocaleDateString("pt-BR")}` : " — atual"}
                  </td>
                  <td>{j.tipo === "escala" ? "Escala" : "Semanal"}</td>
                  <td>{[j.entrada, j.intervaloInicio, j.intervaloFim, j.saida].filter(Boolean).join(" · ") || "por dia da semana"}</td>
                  <td>
                    {j.tipo === "escala"
                      ? `${j.diasTrabalho}x${j.diasFolga}${j.deslocamentoPorCiclo ? ` · folga anda ${j.deslocamentoPorCiclo}d` : " · folga fixa"}`
                      : "—"}
                  </td>
                  <td className="actions-col">
                    <button className="icon-btn icon-btn-danger" onClick={() => remover(j.id)} aria-label="Remover"><Trash2 size={15} /></button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      <div className="pf-secao">
        <h4 className="pf-secao-titulo">Nova jornada</h4>
        <p className="hint" style={{ marginTop: -6 }}>
          A jornada anterior é encerrada no dia anterior ao início desta. O histórico fica guardado, para
          que um mês já fechado não seja recalculado com regra nova.
        </p>

        <div className="pf-grade">
          <label className="pf-campo pf-c4">
            <span className="field-label">Tipo</span>
            <select value={nova.tipo} onChange={e => setCampo("tipo", e.target.value)}>
              <option value="escala">Escala por ciclo (6x1, 5x2…)</option>
              <option value="semanal">Horário fixo por dia da semana</option>
            </select>
          </label>
          <label className="pf-campo pf-c4">
            <span className="field-label">Vale a partir de<span className="req">*</span></span>
            <input type="date" value={nova.vigenciaInicio} onChange={e => setCampo("vigenciaInicio", e.target.value)} />
          </label>
          <label className="pf-campo pf-c4">
            <span className="field-label">Tolerância (minutos)</span>
            <input type="number" min="0" max="30" value={nova.toleranciaMinutos}
              onChange={e => setCampo("toleranciaMinutos", e.target.value)} />
            <p className="pf-ajuda">A CLT admite até 10 minutos por dia sem virar hora extra nem desconto.</p>
          </label>
        </div>

        {nova.tipo === "escala" ? (
          <>
            <div className="pf-grade" style={{ marginTop: 12 }}>
              <label className="pf-campo pf-c3">
                <span className="field-label">Dias de trabalho</span>
                <input type="number" min="1" max="30" value={nova.diasTrabalho} onChange={e => setCampo("diasTrabalho", e.target.value)} />
              </label>
              <label className="pf-campo pf-c3">
                <span className="field-label">Dias de folga</span>
                <input type="number" min="1" max="30" value={nova.diasFolga} onChange={e => setCampo("diasFolga", e.target.value)} />
              </label>
              <label className="pf-campo pf-c3">
                <span className="field-label">Primeiro dia trabalhado<span className="req">*</span></span>
                <input type="date" value={nova.dataReferencia} onChange={e => setCampo("dataReferencia", e.target.value)} />
                <p className="pf-ajuda">É daqui que o ciclo é contado.</p>
              </label>
              <label className="pf-campo pf-c3">
                <span className="field-label">A folga anda quantos dias por ciclo</span>
                <input type="number" min="0" max="6" value={nova.deslocamentoPorCiclo}
                  onChange={e => setCampo("deslocamentoPorCiclo", e.target.value)} />
                <p className="pf-ajuda">0 = folga sempre no mesmo dia da semana.</p>
              </label>
            </div>

            {ciclo === 7 && Number(nova.deslocamentoPorCiclo) === 0 && (
              <p className="hint" style={{ background: "#fbf3e2", color: "#7a5205", padding: "10px 12px", borderRadius: 8 }}>
                Ciclo de 7 dias sem deslocamento: a folga vai cair sempre no mesmo dia da semana. Se a
                folga do pessoal reveza, coloque 1 aqui.
              </p>
            )}

            <div className="pf-grade" style={{ marginTop: 12 }}>
              <label className="pf-campo pf-c3">
                <span className="field-label">Entrada<span className="req">*</span></span>
                <input type="time" value={nova.entrada} onChange={e => setCampo("entrada", e.target.value)} />
              </label>
              <label className="pf-campo pf-c3">
                <span className="field-label">Saída para o intervalo</span>
                <input type="time" value={nova.intervaloInicio} onChange={e => setCampo("intervaloInicio", e.target.value)} />
              </label>
              <label className="pf-campo pf-c3">
                <span className="field-label">Volta do intervalo</span>
                <input type="time" value={nova.intervaloFim} onChange={e => setCampo("intervaloFim", e.target.value)} />
              </label>
              <label className="pf-campo pf-c3">
                <span className="field-label">Saída<span className="req">*</span></span>
                <input type="time" value={nova.saida} onChange={e => setCampo("saida", e.target.value)} />
              </label>
            </div>
          </>
        ) : (
          <table className="data-table" style={{ marginTop: 10 }}>
            <thead>
              <tr><th>Dia</th><th>Folga</th><th>Entrada</th><th>Intervalo</th><th>Volta</th><th>Saída</th></tr>
            </thead>
            <tbody>
              {nova.dias.map((d, i) => (
                <tr key={d.diaSemana}>
                  <td>{DIAS_SEMANA[d.diaSemana]}</td>
                  <td><input type="checkbox" checked={d.folga} onChange={e => setDia(i, "folga", e.target.checked)} /></td>
                  <td><input type="time" disabled={d.folga} value={d.entrada || ""} onChange={e => setDia(i, "entrada", e.target.value)} /></td>
                  <td><input type="time" disabled={d.folga} value={d.intervaloInicio || ""} onChange={e => setDia(i, "intervaloInicio", e.target.value)} /></td>
                  <td><input type="time" disabled={d.folga} value={d.intervaloFim || ""} onChange={e => setDia(i, "intervaloFim", e.target.value)} /></td>
                  <td><input type="time" disabled={d.folga} value={d.saida || ""} onChange={e => setDia(i, "saida", e.target.value)} /></td>
                </tr>
              ))}
            </tbody>
          </table>
        )}

        {erro && <p className="pf-aviso">{erro}</p>}
        <button className="btn btn-primary" style={{ marginTop: 14 }} onClick={salvar} disabled={salvando}>
          {salvando ? "Salvando…" : "Salvar jornada"}
        </button>
      </div>
    </div>
  );
}

function PessoaForm({ moduleKey, record, onSave, onCancel }) {
  const config = MODULES[moduleKey];
  const editando = !!record?.id;
  const rotuloSingular = config.label.replace(/es$/, "").replace(/s$/, "");

  const [data, setData] = useState(() => record || { tipo: "Pessoa Jurídica", contribuinte: "Contribuinte", endereco: emptyEndereco });
  const [erro, setErro] = useState("");
  const [salvando, setSalvando] = useState(false);
  const [buscandoCep, setBuscandoCep] = useState(false);
  const [salvo, setSalvo] = useState(false);

  const pf = data.tipo === "Pessoa Física";
  const endereco = data.endereco || emptyEndereco;
  const set = (k, v) => setData(d => ({ ...d, [k]: v }));
  const setEndereco = (k, v) => setData(d => ({ ...d, endereco: { ...(d.endereco || emptyEndereco), [k]: v } }));

  const docDigitos = soDigitos(data.documento);
  const docCompleto = pf ? docDigitos.length === 11 : docDigitos.length === 14;
  const docValido = pf ? cpfValido(docDigitos) : cnpjValido(docDigitos);

  const trocarTipo = (novoTipo) => {
    setData(d => ({ ...d, tipo: novoTipo, documento: "", fantasia: novoTipo === "Pessoa Física" ? "" : d.fantasia }));
  };

  // A inscrição estadual segue a situação fiscal: isento vai como "ISENTO"
  // nos documentos, não contribuinte não leva inscrição. Foi o que nos
  // custou a rejeição 716 no CT-e.
  const trocarContribuinte = (valor) => {
    setData(d => ({
      ...d,
      contribuinte: valor,
      ie: valor === "Contribuinte Isento" ? "ISENTO" : valor === "Não Contribuinte" ? "" : (d.ie === "ISENTO" ? "" : d.ie),
    }));
  };
  const ieBloqueada = data.contribuinte === "Contribuinte Isento" || data.contribuinte === "Não Contribuinte";

  const buscarPorCep = async (cepDigitado) => {
    setEndereco("cep", cepDigitado);
    const digitos = soDigitos(cepDigitado);
    if (digitos.length !== 8) return;
    setBuscandoCep(true);
    try {
      const res = await fetch(`https://viacep.com.br/ws/${digitos}/json/`);
      const dados = await res.json();
      if (!dados.erro) {
        setData(d => ({
          ...d,
          endereco: {
            ...(d.endereco || emptyEndereco),
            cep: cepDigitado,
            logradouro: dados.logradouro || d.endereco?.logradouro || "",
            bairro: dados.bairro || d.endereco?.bairro || "",
            cidade: dados.localidade || d.endereco?.cidade || "",
            uf: dados.uf || d.endereco?.uf || "MT",
          },
        }));
      }
    } catch {
      // sem internet ou CEP inexistente — preenche na mão
    } finally {
      setBuscandoCep(false);
    }
  };

  const salvar = async () => {
    const faltando = [];
    if (!data.nome?.trim()) faltando.push(pf ? "nome completo" : "razão social");
    if (!docDigitos) faltando.push(pf ? "CPF" : "CNPJ");
    if (data.contribuinte === "Contribuinte" && !data.ie?.trim()) faltando.push("inscrição estadual");
    if (faltando.length) { setErro(`Falta preencher: ${faltando.join(", ")}.`); return; }
    if (docCompleto && !docValido) {
      setErro(`O ${pf ? "CPF" : "CNPJ"} informado tem dígito verificador inválido. A SEFAZ recusa documentos emitidos assim.`);
      return;
    }
    setErro("");
    setSalvando(true);
    try {
      await onSave(data);
      setSalvo(true);
    } catch (e) {
      setErro([e.message || "Erro ao salvar no servidor", e.detalhe].filter(Boolean).join(" — "));
    } finally {
      setSalvando(false);
    }
  };

  return (
    <div className="modal-backdrop">
      <div className="modal pessoa-modal">
        <div className="modal-header">
          <div>
            <h3>{editando ? `Editar ${rotuloSingular.toLowerCase()}` : `Novo ${rotuloSingular.toLowerCase()}`}</h3>
            <p className="subtle">Os dados daqui vão direto para a NF-e e o CT-e</p>
          </div>
          <button className="icon-btn" onClick={onCancel} aria-label="Fechar"><X size={18} /></button>
        </div>

        <div className="modal-body">
          <section className="pf-secao">
            <h4 className="pf-secao-titulo">Identificação</h4>
            <div className="pf-grade">
              <div className="pf-c12" style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
                <div className="pf-segmentado" role="group" aria-label="Tipo de pessoa">
                  <button type="button" aria-pressed={!pf} onClick={() => trocarTipo("Pessoa Jurídica")}>Pessoa jurídica</button>
                  <button type="button" aria-pressed={pf} onClick={() => trocarTipo("Pessoa Física")}>Pessoa física</button>
                </div>
                {docCompleto && docValido && (
                  <span className="pf-selo">✓ {pf ? "CPF" : "CNPJ"} válido</span>
                )}
              </div>

              <label className="pf-campo pf-c7">
                <span className="field-label">{pf ? "Nome completo" : "Razão social"}<span className="req">*</span></span>
                <input value={data.nome || ""} onChange={e => set("nome", e.target.value)} />
              </label>

              <label className={`pf-campo pf-c5 ${docCompleto && !docValido ? "pf-invalido" : ""} ${docCompleto && docValido ? "pf-ok" : ""}`}>
                <span className="field-label">{pf ? "CPF" : "CNPJ"}<span className="req">*</span></span>
                <input
                  inputMode="numeric"
                  maxLength={pf ? 14 : 18}
                  placeholder={pf ? "000.000.000-00" : "00.000.000/0000-00"}
                  value={data.documento || ""}
                  onChange={e => set("documento", formatarDocumento(e.target.value, data.tipo))}
                />
                {docCompleto && !docValido && (
                  <p className="pf-erro-campo">Dígito verificador não confere. Confira o número na nota.</p>
                )}
              </label>

              {!pf && (
                <label className="pf-campo pf-c5">
                  <span className="field-label">Nome fantasia</span>
                  <input value={data.fantasia || ""} onChange={e => set("fantasia", e.target.value)} />
                </label>
              )}
            </div>
          </section>

          <section className="pf-secao">
            <h4 className="pf-secao-titulo">Situação fiscal</h4>
            <div className="pf-grade">
              <label className="pf-campo pf-c5">
                <span className="field-label">Contribuinte de ICMS</span>
                <select value={data.contribuinte || "Contribuinte"} onChange={e => trocarContribuinte(e.target.value)}>
                  <option value="Contribuinte">Contribuinte</option>
                  <option value="Contribuinte Isento">Contribuinte isento</option>
                  <option value="Não Contribuinte">Não contribuinte</option>
                </select>
              </label>
              <label className="pf-campo pf-c4">
                <span className="field-label">
                  Inscrição estadual{data.contribuinte === "Contribuinte" && <span className="req">*</span>}
                </span>
                <input value={data.ie || ""} disabled={ieBloqueada} onChange={e => set("ie", e.target.value)} />
                <p className="pf-ajuda">
                  {data.contribuinte === "Contribuinte Isento"
                    ? "Vai como ISENTO nos documentos fiscais."
                    : data.contribuinte === "Não Contribuinte"
                      ? "Não contribuinte não tem inscrição estadual."
                      : "Obrigatória para contribuinte: sem ela o CT-e volta rejeitado."}
                </p>
              </label>
            </div>
          </section>

          <section className="pf-secao">
            <h4 className="pf-secao-titulo">Endereço</h4>
            <div className="pf-grade">
              <label className="pf-campo pf-c3">
                <span className="field-label">CEP</span>
                <input value={endereco.cep || ""} maxLength={9} inputMode="numeric"
                  onChange={e => buscarPorCep(formatCEP(e.target.value))} />
                {buscandoCep && <p className="pf-ajuda pf-buscando">Buscando endereço…</p>}
              </label>
              <label className="pf-campo pf-c9">
                <span className="field-label">Logradouro</span>
                <input value={endereco.logradouro || ""} onChange={e => setEndereco("logradouro", e.target.value)} />
              </label>

              <label className="pf-campo pf-c2">
                <span className="field-label">Número</span>
                <input value={endereco.numero || ""} onChange={e => setEndereco("numero", e.target.value)} />
              </label>
              <label className="pf-campo pf-c4">
                <span className="field-label">Complemento</span>
                <input value={endereco.complemento || ""} onChange={e => setEndereco("complemento", e.target.value)} />
              </label>
              <label className="pf-campo pf-c6">
                <span className="field-label">Bairro</span>
                <input value={endereco.bairro || ""} onChange={e => setEndereco("bairro", e.target.value)} />
              </label>

              <label className="pf-campo pf-c3">
                <span className="field-label">UF</span>
                <select value={endereco.uf || "MT"} onChange={e => setEndereco("uf", e.target.value)}>
                  {UFS.map(uf => <option key={uf} value={uf}>{uf}</option>)}
                </select>
              </label>
              <label className="pf-campo pf-c6">
                <span className="field-label">Município</span>
                <input value={endereco.cidade || ""} onChange={e => setEndereco("cidade", e.target.value)} />
                <p className="pf-ajuda">O código IBGE é resolvido pelo sistema — é ele que o MDF-e exige.</p>
              </label>
            </div>
          </section>

          <section className="pf-secao">
            <h4 className="pf-secao-titulo">Contato</h4>
            <div className="pf-grade">
              <label className="pf-campo pf-c4">
                <span className="field-label">Telefone</span>
                <input inputMode="numeric" maxLength={15} value={data.telefone || ""}
                  onChange={e => set("telefone", formatarTelefone(e.target.value))} />
              </label>
              <label className="pf-campo pf-c8">
                <span className="field-label">E-mail</span>
                <input type="email" value={data.email || ""} onChange={e => set("email", e.target.value)} />
                <p className="pf-ajuda">Usado para enviar o DANFE e o DACTE automaticamente.</p>
              </label>
            </div>
            {erro && <p className="pf-aviso">{erro}</p>}
          </section>
        </div>

        <div className="modal-footer pf-rodape">
          <span className="pf-dica">
            {salvo ? `${rotuloSingular} salvo.` : <>Campos com <span className="req">*</span> são exigidos pela SEFAZ</>}
          </span>
          <div style={{ display: "flex", gap: 8, marginLeft: "auto" }}>
            <button className="btn" onClick={onCancel} disabled={salvando}>Cancelar</button>
            <button className="btn btn-primary" onClick={salvar} disabled={salvando}>
              {salvando ? "Salvando…" : `Salvar ${rotuloSingular.toLowerCase()}`}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function RecordForm({ moduleKey, record, onSave, onCancel }) {
  // Clientes e fornecedores têm formulário próprio (campos que reagem ao
  // tipo de pessoa e à situação fiscal); o resto segue o genérico.
  if (moduleKey === "clientes" || moduleKey === "fornecedores") {
    return <PessoaForm moduleKey={moduleKey} record={record} onSave={onSave} onCancel={onCancel} />;
  }

  const config = MODULES[moduleKey];
  const editando = !!record?.id;
  // Alguns campos só fazem sentido na criação (ex: senha de um usuário
  // novo) — escondemos eles ao editar um registro existente.
  const camposVisiveis = config.fields.filter(f => !(f.hideOnEdit && editando));
  const [data, setData] = useState(() => record || {});
  const [error, setError] = useState("");
  const [salvando, setSalvando] = useState(false);
  const [aba, setAba] = useState("dados");
  // Colaborador tem jornada de trabalho; os outros cadastros, não.
  const temJornada = moduleKey === "colaboradores";

  const setField = (key, value) => setData(d => ({ ...d, [key]: value }));

  const handleSubmit = async () => {
    const missing = camposVisiveis.filter(f => f.required && !data[f.key]);
    if (missing.length) {
      setError(`Preencha: ${missing.map(f => f.label).join(", ")}`);
      return;
    }
    setError("");
    setSalvando(true);
    try {
      await onSave(data);
    } catch (e) {
      // O backend manda a explicação real em "detalhe" — sem isso a tela
      // mostrava só "Erro interno" e não dava pra saber o que corrigir.
      setError([e.message || "Erro ao salvar no servidor", e.detalhe].filter(Boolean).join(" — "));
    } finally {
      setSalvando(false);
    }
  };

  return (
    <div className="modal-backdrop">
      <div className="modal" style={{ width: 920, maxWidth: "96vw" }}>
        <div className="modal-header">
          <h3>{editando ? "Editar" : "Novo"} {config.label.replace(/s$/, "")}</h3>
          <button className="icon-btn" onClick={onCancel} aria-label="Fechar"><X size={18} /></button>
        </div>

        {temJornada && (
          <div className="cte-abas" style={{ padding: "0 22px", borderBottom: "0.5px solid #e5e3da" }}>
            <button type="button" className="cte-aba" aria-selected={aba === "dados"} onClick={() => setAba("dados")}>Dados</button>
            <button type="button" className="cte-aba" aria-selected={aba === "jornada"} onClick={() => setAba("jornada")}>
              Horários de trabalho
            </button>
          </div>
        )}

        <div className="modal-body">
          {temJornada && aba === "jornada" && <JornadaAba colaboradorId={record?.id} />}

          <div className="cadastro-fields-grid" hidden={temJornada && aba !== "dados"}>
            {camposVisiveis.map(f => (
              <div
                key={f.key}
                style={["endereco", "empresas-multiselect", "imagem-upload"].includes(f.type) ? { gridColumn: "1 / -1" } : undefined}
              >
                <Field
                  field={f}
                  value={data[f.key]}
                  onChange={v => setField(f.key, v)}
                  disabled={f.readOnlyOnEdit && editando}
                />
              </div>
            ))}
          </div>
          {error && <p className="error-text">{error}</p>}
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onCancel} disabled={salvando}>
            {temJornada && aba === "jornada" ? "Fechar" : "Cancelar"}
          </button>
          {!(temJornada && aba === "jornada") && (
            <button className="btn btn-primary" onClick={handleSubmit} disabled={salvando}>
              {salvando ? "Salvando…" : "Salvar"}
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

function LoginScreen({ onLogin }) {
  const EMAIL_LEMBRADO_KEY = "erpBiomassaEmailLembrado";
  const EMPRESA_LEMBRADA_KEY = "erpBiomassaEmpresaId";

  const [email, setEmail] = useState(() => {
    try { return localStorage.getItem(EMAIL_LEMBRADO_KEY) || ""; } catch { return ""; }
  });
  const [lembrarEmail, setLembrarEmail] = useState(() => {
    try { return !!localStorage.getItem(EMAIL_LEMBRADO_KEY); } catch { return false; }
  });
  const [senha, setSenha] = useState("");
  const [mostrarSenha, setMostrarSenha] = useState(false);
  const [erro, setErro] = useState("");
  const [carregando, setCarregando] = useState(false);

  // "credenciais" = só e-mail e senha visíveis. Depois do primeiro clique em
  // "Entrar", se o usuário tiver acesso a alguma empresa, o campo de empresa
  // aparece logo abaixo (mesma tela, mesmo formulário) e vira "empresa".
  const [fase, setFase] = useState("credenciais");
  const [empresasParaEscolher, setEmpresasParaEscolher] = useState(null);
  const [resultadoPendente, setResultadoPendente] = useState(null);
  const [empresaId, setEmpresaId] = useState(() => {
    try { return localStorage.getItem(EMPRESA_LEMBRADA_KEY) || ""; } catch { return ""; }
  });

  // Mostra a logo da empresa lembrada (do último login neste navegador)
  // já na tela inicial, antes mesmo de digitar e-mail/senha.
  const [logoEmpresa, setLogoEmpresa] = useState(null);
  useEffect(() => {
    if (!empresaId) return;
    let cancelado = false;
    apiRequest(`/auth/empresas/${empresaId}/logo`)
      .then((dados) => { if (!cancelado && dados.logoUrl) setLogoEmpresa(dados.logoUrl); })
      .catch(() => {});
    return () => { cancelado = true; };
  }, []);

  // Se a pessoa voltar a mexer no e-mail ou na senha depois de já ter
  // visto o seletor de empresa, invalida a verificação anterior — as
  // empresas liberadas dependem de qual usuário está logando.
  function editarCredencial(setter) {
    return (valor) => {
      setter(valor);
      if (fase !== "credenciais") {
        setFase("credenciais");
        setEmpresasParaEscolher(null);
        setResultadoPendente(null);
        setErro("");
      }
    };
  }

  function finalizarLogin(resultado) {
    setToken(resultado.token);
    try {
      if (lembrarEmail) localStorage.setItem(EMAIL_LEMBRADO_KEY, email);
      else localStorage.removeItem(EMAIL_LEMBRADO_KEY);
      if (resultado.empresa?.id) localStorage.setItem(EMPRESA_LEMBRADA_KEY, String(resultado.empresa.id));
    } catch { /* localStorage indisponível — segue sem lembrar */ }
    onLogin({ ...resultado.usuario, empresa: resultado.empresa || null });
  }

  const enviar = async (e) => {
    e.preventDefault();
    setErro("");
    setCarregando(true);
    try {
      if (fase === "credenciais") {
        // Primeiro clique: confere e-mail/senha e descobre quais empresas
        // esse usuário pode acessar.
        const resultado = await apiRequest("/auth/login", {
          method: "POST",
          body: JSON.stringify({ email, senha }),
        });

        if (resultado.requerEmpresa) {
          const lembrada = (() => { try { return localStorage.getItem(EMPRESA_LEMBRADA_KEY); } catch { return null; } })();
          setEmpresasParaEscolher(resultado.empresas);
          setEmpresaId(resultado.empresas.some(emp => String(emp.id) === lembrada) ? lembrada : "");
          setFase("empresa");
        } else if (resultado.empresa) {
          // Só uma empresa disponível — mostra ela já selecionada e guarda
          // o login (já confirmado) pra concluir no próximo clique, sem
          // precisar checar a senha de novo.
          setEmpresasParaEscolher([resultado.empresa]);
          setEmpresaId(String(resultado.empresa.id));
          setResultadoPendente(resultado);
          setFase("empresa");
        } else {
          // Nenhuma empresa cadastrada no sistema ainda — entra direto.
          finalizarLogin(resultado);
        }
      } else {
        // Segundo clique: empresa escolhida.
        if (!empresaId) {
          setErro("Selecione uma empresa para continuar.");
          setCarregando(false);
          return;
        }
        if (resultadoPendente) {
          finalizarLogin(resultadoPendente);
        } else {
          const resultado = await apiRequest("/auth/login", {
            method: "POST",
            body: JSON.stringify({ email, senha, empresaId: Number(empresaId) }),
          });
          finalizarLogin(resultado);
        }
      }
    } catch (e2) {
      setErro(e2.message === "Credenciais inválidas" ? "E-mail ou senha incorretos." : e2.message);
    } finally {
      setCarregando(false);
    }
  };

  return (
    <div className="login-wrap">
      <style>{`
        .login-wrap {
          display: flex; min-height: 600px; width: 100%;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          -webkit-font-smoothing: antialiased;
        }
        .login-brand { flex: 1; background: #1F3B57; color: #fff; display: flex; flex-direction: column; justify-content: center; padding: 3rem 2.5rem; }
        .login-brand-mark { width: 360px; height: 360px; max-width: 85%; border-radius: 24px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; margin: 0 auto; color: #fff; }
        .login-brand-title { font-size: 25px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 18px; text-align: center; }

        .login-form-side { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; background: #fff; border: 1.5px solid #00923F; box-sizing: border-box; }
        .login-card { width: 340px; max-width: 100%; }
        .login-heading { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 6px; color: #1F3B57; }
        .login-subtitle { font-size: 13.5px; color: #6b6b68; margin: 0 0 28px; line-height: 1.5; }

        .login-field { margin-bottom: 18px; }
        .login-label { display: block; font-size: 13px; font-weight: 500; color: #33332f; margin-bottom: 6px; }
        .login-input {
          width: 100%; box-sizing: border-box; padding: 11px 12px; font-size: 14px;
          border-radius: 8px; border: 1px solid #d6d3c8; background: #fff; color: #1a1a1a;
          font-family: inherit; transition: border-color 0.15s, box-shadow 0.15s;
        }
        .login-input:focus { outline: none; border-color: #00923F; box-shadow: 0 0 0 3px rgba(0,146,63,0.12); }
        .login-password-wrap { position: relative; }
        .login-password-wrap .login-input { padding-right: 40px; }
        .login-password-toggle {
          position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
          border: none; background: none; cursor: pointer; color: #8a887f; padding: 8px;
          display: flex; border-radius: 6px;
        }
        .login-password-toggle:hover { color: #1F3B57; background: #f1efe8; }

        .login-remember { display: flex; align-items: center; gap: 8px; margin: -6px 0 20px; user-select: none; cursor: pointer; }
        .login-remember input { width: 15px; height: 15px; accent-color: #00923F; cursor: pointer; }
        .login-remember span { font-size: 13px; color: #55534c; }

        .login-error { color: #a32d2d; font-size: 13px; margin: -8px 0 16px; }
        .login-submit {
          width: 100%; padding: 11px 14px; border-radius: 8px; border: none;
          background: #00923F; color: #fff; font-size: 14px; font-weight: 600;
          cursor: pointer; transition: background 0.15s;
        }
        .login-submit:hover:not(:disabled) { background: #00732F; }
        .login-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        @media (max-width: 640px) { .login-brand { display: none; } }
      `}</style>

      <div className="login-brand">
        <h1 className="login-brand-title">Biomassa ERP</h1>
        <div className="login-brand-mark">
          {logoEmpresa ? <img src={logoEmpresa} alt="Logo da empresa" style={{ width: "100%", height: "100%", objectFit: "contain", borderRadius: 24 }} /> : <Leaf size={96} />}
        </div>
      </div>

      <div className="login-form-side">
        <form className="login-card" onSubmit={enviar}>
          <h2 className="login-heading">Entrar</h2>
          <p className="login-subtitle">Use seu e-mail e senha cadastrados.</p>

          <div className="login-field">
            <label className="login-label">E-mail</label>
            <input
              className="login-input"
              type="email"
              value={email}
              onChange={e => editarCredencial(setEmail)(e.target.value)}
              required
              autoFocus
            />
          </div>

          <div className="login-field">
            <label className="login-label">Senha</label>
            <div className="login-password-wrap">
              <input
                className="login-input"
                type={mostrarSenha ? "text" : "password"}
                value={senha}
                onChange={e => editarCredencial(setSenha)(e.target.value)}
                required
              />
              <button
                type="button"
                className="login-password-toggle"
                onClick={() => setMostrarSenha(v => !v)}
                aria-label={mostrarSenha ? "Ocultar senha" : "Mostrar senha"}
              >
                {mostrarSenha ? <EyeOff size={16} /> : <Eye size={16} />}
              </button>
            </div>
          </div>

          {fase === "empresa" && (
            <div className="login-field">
              <label className="login-label">Empresa</label>
              <select
                className="login-input"
                value={empresaId}
                onChange={e => {
                  setEmpresaId(e.target.value);
                  const escolhida = empresasParaEscolher.find(emp => String(emp.id) === e.target.value);
                  setLogoEmpresa(escolhida?.logoUrl || null);
                }}
                required
                autoFocus
              >
                <option value="">Selecione…</option>
                {empresasParaEscolher.map(emp => <option key={emp.id} value={emp.id}>{emp.razaoSocial}</option>)}
              </select>
            </div>
          )}

          {fase === "credenciais" && (
            <label className="login-remember">
              <input type="checkbox" checked={lembrarEmail} onChange={e => setLembrarEmail(e.target.checked)} />
              <span>Lembrar meu e-mail</span>
            </label>
          )}

          {erro && <p className="login-error">{erro}</p>}

          <button className="login-submit" type="submit" disabled={carregando}>
            {carregando ? "Entrando…" : fase === "empresa" ? "Entrar" : "Continuar"}
          </button>
        </form>
      </div>
    </div>
  );
}

// ---------- Controle de ponto ----------
// O espelho mostra a hora no fuso da operação, não no fuso de quem está
// olhando. Sem isso, o RH em outro estado veria a batida com uma hora de
// diferença — e num espelho de ponto isso vira discussão trabalhista.
// Deve acompanhar o TZ_FISCAL configurado no backend.
const FUSO_OPERACAO = "America/Cuiaba";

const horaPonto = (iso) => new Date(iso).toLocaleTimeString("pt-BR", {
  timeZone: FUSO_OPERACAO, hour: "2-digit", minute: "2-digit",
});
const diaPonto = (iso) => new Date(iso).toLocaleDateString("pt-BR", { timeZone: FUSO_OPERACAO });

// Três frentes, na ordem em que o RH usa: os tablets (que geram as batidas),
// as pessoas (PIN e biometria) e o espelho (o que foi registrado).

function PontoView() {
  const [aba, setAba] = useState("espelho");

  return (
    <div>
      <div className="view-header">
        <div className="view-title">
          <div className="icon-badge" style={{ background: "#eaf1f6", color: "#1F3B57" }}>
            <Clock size={20} />
          </div>
          <div>
            <h2>Controle de ponto</h2>
            <p className="subtle">Registros, pessoas e tablets</p>
          </div>
        </div>
      </div>

      <div className="cte-abas" style={{ marginBottom: 18, borderBottom: "0.5px solid #e5e3da" }}>
        <button type="button" className="cte-aba" aria-selected={aba === "espelho"} onClick={() => setAba("espelho")}>Espelho de ponto</button>
        <button type="button" className="cte-aba" aria-selected={aba === "pessoas"} onClick={() => setAba("pessoas")}>Pessoas</button>
        <button type="button" className="cte-aba" aria-selected={aba === "tablets"} onClick={() => setAba("tablets")}>Tablets</button>
        <button type="button" className="cte-aba" aria-selected={aba === "email"} onClick={() => setAba("email")}>E-mail</button>
      </div>

      {aba === "espelho" && <PontoEspelho />}
      {aba === "pessoas" && <PontoPessoas />}
      {aba === "tablets" && <PontoTablets />}
      {aba === "email" && <PontoEmail />}
    </div>
  );
}

// Diagnóstico do envio de comprovantes. O envio real é silencioso de
// propósito (não pode travar a batida), então sem esta tela o motivo de uma
// falha ficaria só no log do servidor.
function PontoEmail() {
  const [situacao, setSituacao] = useState(null);
  const [destino, setDestino] = useState("");
  const [resultado, setResultado] = useState(null);
  const [testando, setTestando] = useState(false);

  const carregar = useCallback(async () => {
    try { setSituacao(await apiRequest("/ponto/email/situacao")); }
    catch (e) { setSituacao({ erro: e.message }); }
  }, []);
  useEffect(() => { carregar(); }, [carregar]);

  const testar = async () => {
    setTestando(true); setResultado(null);
    try {
      const r = await apiRequest("/ponto/email/teste", { method: "POST", body: JSON.stringify({ para: destino }) });
      setResultado({ ok: true, texto: `Enviado. ${r.aviso}` });
    } catch (e) {
      setResultado({ ok: false, texto: [e.message, e.detalhe].filter(Boolean).join("\n\n") });
    } finally { setTestando(false); carregar(); }
  };

  if (!situacao) return <p className="hint">Verificando…</p>;

  const conexaoOk = situacao.conexao?.ok;

  return (
    <div>
      <div className="nf-section">
        <h4 className="nf-section-title">Situação do servidor de e-mail</h4>
        <table className="data-table">
          <tbody>
            <tr><td>Variáveis configuradas</td><td>{situacao.configurado
              ? <span style={{ color: "#00732F", fontWeight: 600 }}>sim</span>
              : <span style={{ color: "#c62828", fontWeight: 600 }}>não — falta SMTP_HOST, SMTP_USUARIO ou SMTP_SENHA no Render</span>}</td></tr>
            <tr><td>Servidor</td><td>{situacao.host || "—"}:{situacao.porta}</td></tr>
            <tr><td>Usuário</td><td>{situacao.usuario || "—"}</td></tr>
            <tr><td>Remetente</td><td>{situacao.remetente || "—"}</td></tr>
            <tr><td>Comprovante por batida</td><td>{situacao.comprovanteLigado ? "ligado" : "desligado"}</td></tr>
            <tr>
              <td>Conexão com o servidor</td>
              <td>{conexaoOk
                ? <span style={{ color: "#00732F", fontWeight: 600 }}>respondendo</span>
                : <span style={{ color: "#c62828" }}>{situacao.conexao?.erro || "sem resposta"}</span>}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div className="nf-section">
        <h4 className="nf-section-title">Enviar um teste</h4>
        <div className="nf-grid-3">
          <div className="field-group">
            <label className="field-label">Endereço de destino</label>
            <input type="email" value={destino} placeholder="seu@email.com" onChange={e => setDestino(e.target.value)} />
          </div>
          <div className="field-group" style={{ display: "flex", alignItems: "flex-end" }}>
            <button className="btn btn-primary" onClick={testar} disabled={testando || !destino}>
              {testando ? "Enviando…" : "Enviar teste"}
            </button>
          </div>
        </div>
        {resultado && (
          <pre style={{
            whiteSpace: "pre-wrap", fontSize: 13, padding: "12px 14px", borderRadius: 9, marginTop: 10,
            background: resultado.ok ? "#eaf3de" : "#faece7", color: resultado.ok ? "#00732F" : "#791f1f",
          }}>{resultado.texto}</pre>
        )}
        <p className="hint">
          O teste separa os dois tipos de problema: se a conexão falha, é host, porta, usuário ou senha; se
          a conexão passa e o envio é recusado, costuma ser bloqueio do provedor ou remetente não autorizado.
        </p>
      </div>
    </div>
  );
}

function PontoTablets() {
  const [reps, setReps] = useState(null);
  const [erro, setErro] = useState("");
  const [novo, setNovo] = useState({ identificador: "", descricao: "", localizacao: "" });
  const [tokenNovo, setTokenNovo] = useState(null);
  const [integridade, setIntegridade] = useState(null);

  const carregar = useCallback(async () => {
    try { setReps(await apiRequest("/ponto/reps")); }
    catch (e) { setErro(e.message); setReps([]); }
  }, []);
  useEffect(() => { carregar(); }, [carregar]);

  const cadastrar = async () => {
    if (!novo.identificador.trim()) { setErro("Dê um nome ao tablet (ex.: TABLET-PATIO-01)."); return; }
    setErro("");
    try {
      const rep = await apiRequest("/ponto/reps", { method: "POST", body: JSON.stringify(novo) });
      // O token aparece uma vez só: é a credencial do aparelho.
      setTokenNovo(rep);
      setNovo({ identificador: "", descricao: "", localizacao: "" });
      carregar();
    } catch (e) { setErro([e.message, e.detalhe].filter(Boolean).join(" — ")); }
  };

  const alternarAtivo = async (rep) => {
    const acao = rep.ativo ? "desativar" : "reativar";
    if (!window.confirm(`Deseja ${acao} o ${rep.identificador}?${rep.ativo ? "\n\nO aparelho para de registrar imediatamente." : ""}`)) return;
    try {
      await apiRequest(`/ponto/reps/${rep.id}`, { method: "PUT", body: JSON.stringify({ ativo: !rep.ativo }) });
      carregar();
    } catch (e) { alert(`Não foi possível: ${e.message}`); }
  };

  const conferir = async (rep) => {
    setIntegridade({ rep: rep.identificador, carregando: true });
    try {
      setIntegridade({ ...(await apiRequest(`/ponto/integridade/${rep.identificador}`)), carregando: false });
    } catch (e) { setIntegridade({ rep: rep.identificador, erro: e.message }); }
  };

  return (
    <div>
      <div className="nf-section">
        <h4 className="nf-section-title">Cadastrar um tablet</h4>
        <div className="nf-grid-3">
          <div className="field-group">
            <label className="field-label">Identificação<span className="req">*</span></label>
            <input value={novo.identificador} placeholder="TABLET-PATIO-01"
              onChange={e => setNovo(n => ({ ...n, identificador: e.target.value.toUpperCase() }))} />
          </div>
          <div className="field-group">
            <label className="field-label">Descrição</label>
            <input value={novo.descricao} placeholder="Tablet da portaria"
              onChange={e => setNovo(n => ({ ...n, descricao: e.target.value }))} />
          </div>
          <div className="field-group">
            <label className="field-label">Local</label>
            <input value={novo.localizacao} placeholder="Pátio de cavaco"
              onChange={e => setNovo(n => ({ ...n, localizacao: e.target.value }))} />
          </div>
        </div>
        <button className="btn btn-primary" onClick={cadastrar}>Cadastrar tablet</button>
        {erro && <p className="error-text">{erro}</p>}
      </div>

      {tokenNovo && (
        <div className="nf-section" style={{ background: "#eaf3de", borderRadius: 10, padding: 14 }}>
          <h4 className="nf-section-title" style={{ marginTop: 0 }}>Token do {tokenNovo.identificador}</h4>
          <p className="hint" style={{ marginTop: 0 }}>
            Copie agora e guarde: por segurança, ele não é exibido de novo. É o que se digita na
            configuração do app do tablet, junto com o endereço do sistema.
          </p>
          <code style={{ display: "block", wordBreak: "break-all", background: "#fff", padding: "10px 12px",
                         borderRadius: 8, fontSize: 13, margin: "8px 0" }}>{tokenNovo.token}</code>
          <button className="btn" onClick={() => { navigator.clipboard?.writeText(tokenNovo.token); }}>Copiar</button>
          <button className="btn" onClick={() => setTokenNovo(null)} style={{ marginLeft: 8 }}>Já guardei</button>
        </div>
      )}

      {reps === null ? <p className="hint">Carregando…</p> : reps.length === 0 ? (
        <p className="hint">Nenhum tablet cadastrado. Cadastre um acima para liberar o registro de ponto.</p>
      ) : (
        <table className="data-table">
          <thead>
            <tr><th>Identificação</th><th>Local</th><th>Batidas</th><th>Último NSR</th><th>Situação</th><th></th></tr>
          </thead>
          <tbody>
            {reps.map(rep => (
              <tr key={rep.id} style={rep.ativo ? undefined : { opacity: 0.55 }}>
                <td><strong>{rep.identificador}</strong>{rep.descricao && <span className="subtle" style={{ display: "block", fontSize: 11.5 }}>{rep.descricao}</span>}</td>
                <td>{rep.localizacao || "—"}</td>
                <td>{rep._count?.marcacoes ?? 0}</td>
                <td>{rep.ultimoNsr}</td>
                <td>{rep.ativo ? "Ativo" : "Desativado"}</td>
                <td className="actions-col">
                  <button className="btn" style={{ padding: "5px 12px", fontSize: 12.5 }} onClick={() => conferir(rep)}>Conferir integridade</button>
                  <button className="btn" style={{ padding: "5px 12px", fontSize: 12.5, marginLeft: 6 }}
                    onClick={async () => {
                      if (!window.confirm(`Gerar um token novo para ${rep.identificador}?\n\nO token atual para de funcionar na hora, e o tablet precisa ser reconfigurado com o novo.`)) return;
                      try {
                        setTokenNovo(await apiRequest(`/ponto/reps/${rep.id}/novo-token`, { method: "POST" }));
                      } catch (e) { alert(`Não foi possível: ${e.message}`); }
                    }}>
                    Novo token
                  </button>
                  <button className="btn" style={{ padding: "5px 12px", fontSize: 12.5, marginLeft: 6 }} onClick={() => alternarAtivo(rep)}>
                    {rep.ativo ? "Desativar" : "Reativar"}
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      {integridade && (
        <div className="nf-section">
          <h4 className="nf-section-title">Integridade — {integridade.rep}</h4>
          {integridade.carregando && <p className="hint">Conferindo a corrente de registros…</p>}
          {integridade.erro && <p className="error-text">{integridade.erro}</p>}
          {integridade.integro === true && (
            <p style={{ color: "#00732F", fontWeight: 600 }}>
              {integridade.total} marcações conferidas: nenhuma alteração detectada.
            </p>
          )}
          {integridade.integro === false && (
            <>
              <p className="error-text">Foram encontrados problemas na corrente de registros:</p>
              <ul>{integridade.problemas.map((p, i) => <li key={i}>NSR {p.nsr}: {p.problema}</li>)}</ul>
            </>
          )}
        </div>
      )}
    </div>
  );
}

function PontoPessoas() {
  const [pessoas, setPessoas] = useState(null);
  const [erro, setErro] = useState("");

  const carregar = useCallback(async () => {
    try { setPessoas(await apiRequest("/ponto/colaboradores")); }
    catch (e) { setErro(e.message); setPessoas([]); }
  }, []);
  useEffect(() => { carregar(); }, [carregar]);

  const definirPin = async (pessoa) => {
    const pin = window.prompt(`PIN de ponto para ${pessoa.nome} (4 a 6 dígitos):`);
    if (!pin) return;
    if (!/^\d{4,6}$/.test(pin)) { alert("O PIN deve ter de 4 a 6 dígitos."); return; }
    try {
      await apiRequest(`/ponto/pin/${pessoa.id}`, { method: "PUT", body: JSON.stringify({ pin }) });
      alert(`PIN definido. Avise ${pessoa.nome} e oriente a não compartilhar — a batida é pessoal.`);
      carregar();
    } catch (e) { alert(`Não foi possível: ${e.message}`); }
  };

  const revogarBiometria = async (pessoa) => {
    if (!window.confirm(`Remover a biometria facial de ${pessoa.nome}?\n\nEla volta a bater ponto pelo PIN. O colaborador pode pedir isso a qualquer momento.`)) return;
    try {
      await apiRequest(`/ponto/biometria/${pessoa.id}`, { method: "DELETE" });
      carregar();
    } catch (e) { alert(`Não foi possível: ${e.message}`); }
  };

  if (pessoas === null) return <p className="hint">Carregando…</p>;
  if (erro) return <p className="error-text">{erro}</p>;

  const semPin = pessoas.filter(p => !p.temPin);

  return (
    <div>
      {semPin.length > 0 && (
        <p className="hint" style={{ background: "#fbf3e2", color: "#7a5205", padding: "11px 13px", borderRadius: 8 }}>
