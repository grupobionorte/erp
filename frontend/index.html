// Diagnóstico do envio de comprovantes. O envio real é silencioso de
// propósito (não pode travar a batida), então sem esta tela o motivo de uma
// falha ficaria só no log do servidor.
function PontoEmail() {
  const [situacao, setSituacao] = useState(null);
  const [destino, setDestino] = useState("");
  const [resultado, setResultado] = useState(null);
  const [testando, setTestando] = useState(false);

  const carregar = useCallback(async () => {
    try { setSituacao(await apiRequest("/ponto/email/situacao")); }
    catch (e) { setSituacao({ erro: e.message }); }
  }, []);
  useEffect(() => { carregar(); }, [carregar]);

  const testar = async () => {
    setTestando(true); setResultado(null);
    try {
      const r = await apiRequest("/ponto/email/teste", { method: "POST", body: JSON.stringify({ para: destino }) });
      setResultado({ ok: true, texto: `Enviado. ${r.aviso}` });
    } catch (e) {
      setResultado({ ok: false, texto: [e.message, e.detalhe].filter(Boolean).join("\n\n") });
    } finally { setTestando(false); carregar(); }
  };

  if (!situacao) return <p className="hint">Verificando…</p>;

  const conexaoOk = situacao.conexao?.ok;

  return (
    <div>
      <div className="nf-section">
        <h4 className="nf-section-title">Situação do servidor de e-mail</h4>
        <table className="data-table">
          <tbody>
            <tr><td>Variáveis configuradas</td><td>{situacao.configurado
              ? <span style={{ color: "#00732F", fontWeight: 600 }}>sim</span>
              : <span style={{ color: "#c62828", fontWeight: 600 }}>não — falta SMTP_HOST, SMTP_USUARIO ou SMTP_SENHA no Render</span>}</td></tr>
            <tr><td>Servidor</td><td>{situacao.host || "—"}:{situacao.porta}</td></tr>
            <tr><td>Usuário</td><td>{situacao.usuario || "—"}</td></tr>
            <tr><td>Remetente</td><td>{situacao.remetente || "—"}</td></tr>
            <tr><td>Comprovante por batida</td><td>{situacao.comprovanteLigado ? "ligado" : "desligado"}</td></tr>
            <tr>
              <td>Conexão com o servidor</td>
              <td>{conexaoOk
                ? <span style={{ color: "#00732F", fontWeight: 600 }}>respondendo</span>
                : <span style={{ color: "#c62828" }}>{situacao.conexao?.erro || "sem resposta"}</span>}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <div className="nf-section">
        <h4 className="nf-section-title">Enviar um teste</h4>
        <div className="nf-grid-3">
          <div className="field-group">
            <label className="field-label">Endereço de destino</label>
            <input type="email" value={destino} placeholder="seu@email.com" onChange={e => setDestino(e.target.value)} />
          </div>
          <div className="field-group" style={{ display: "flex", alignItems: "flex-end" }}>
            <button className="btn btn-primary" onClick={testar} disabled={testando || !destino}>
              {testando ? "Enviando…" : "Enviar teste"}
            </button>
          </div>
        </div>
        {resultado && (
          <pre style={{
            whiteSpace: "pre-wrap", fontSize: 13, padding: "12px 14px", borderRadius: 9, marginTop: 10,
            background: resultado.ok ? "#eaf3de" : "#faece7", color: resultado.ok ? "#00732F" : "#791f1f",
          }}>{resultado.texto}</pre>
        )}
        <p className="hint">
          O teste separa os dois tipos de problema: se a conexão falha, é host, porta, usuário ou senha; se
          a conexão passa e o envio é recusado, costuma ser bloqueio do provedor ou remetente não autorizado.
        </p>
      </div>
    </div>
  );
}

// Quais empresas o tablet atende. Nenhuma marcada significa todas — a
// configuração mais comum num grupo que usa um aparelho só no pátio.
function EmpresasDoTabletModal({ rep, onFechar, onSalvo }) {
  const { items: empresas } = useApiCollection("empresas");
  const [escolhidas, setEscolhidas] = useState(rep.empresasAtendidas?.map(e => e.id) || []);
  const [salvando, setSalvando] = useState(false);
  const [erro, setErro] = useState("");

  const alternar = (id) => setEscolhidas(a => (a.includes(id) ? a.filter(x => x !== id) : [...a, id]));

  const salvar = async () => {
    setSalvando(true); setErro("");
    try {
      await apiRequest(`/ponto/reps/${rep.id}`, {
        method: "PUT",
        body: JSON.stringify({ empresasAtendidas: escolhidas }),
      });
      onSalvo();
    } catch (e) {
      setErro([e.message, e.detalhe].filter(Boolean).join(" — "));
    } finally { setSalvando(false); }
  };

  return (
    <div className="modal-backdrop">
      <div className="modal" style={{ maxWidth: 520 }}>
        <div className="modal-header">
          <h3>Empresas do {rep.identificador}</h3>
          <button className="icon-btn" onClick={onFechar} aria-label="Fechar"><X size={18} /></button>
        </div>
        <div className="modal-body">
          <p className="hint" style={{ marginTop: 0 }}>
            Os colaboradores dessas empresas aparecem no tablet para bater ponto e cadastrar o rosto.
            Sem nenhuma marcada, o tablet atende todas.
          </p>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {(empresas || []).map(e => {
              const ativo = escolhidas.includes(e.id);
              return (
                <button key={e.id} className="btn"
                  style={{
                    padding: "6px 12px", fontSize: 13,
                    background: ativo ? "#1F3B57" : undefined,
                    color: ativo ? "#fff" : undefined,
                  }}
                  onClick={() => alternar(e.id)}>
                  {e.fantasia || e.nome}
                </button>
              );
            })}
          </div>
          {erro && <p className="error-text">{erro}</p>}
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onFechar} disabled={salvando}>Cancelar</button>
          <button className="btn btn-primary" onClick={salvar} disabled={salvando}>
            {salvando ? "Salvando…" : "Salvar"}
          </button>
        </div>
      </div>
    </div>
  );
}

function PontoTablets() {
  const [reps, setReps] = useState(null);
  const [erro, setErro] = useState("");
  const [novo, setNovo] = useState({ identificador: "", descricao: "", localizacao: "" });
  const [empresasDe, setEmpresasDe] = useState(null);
  const [tokenNovo, setTokenNovo] = useState(null);
  const [integridade, setIntegridade] = useState(null);

  const carregar = useCallback(async () => {
    try { setReps(await apiRequest("/ponto/reps")); }
    catch (e) { setErro(e.message); setReps([]); }
  }, []);
  useEffect(() => { carregar(); }, [carregar]);

  const cadastrar = async () => {
    if (!novo.identificador.trim()) { setErro("Dê um nome ao tablet (ex.: TABLET-PATIO-01)."); return; }
    setErro("");
    try {
      const rep = await apiRequest("/ponto/reps", { method: "POST", body: JSON.stringify(novo) });
      // O token aparece uma vez só: é a credencial do aparelho.
      setTokenNovo(rep);
      setNovo({ identificador: "", descricao: "", localizacao: "" });
      carregar();
    } catch (e) { setErro([e.message, e.detalhe].filter(Boolean).join(" — ")); }
  };

  const alternarAtivo = async (rep) => {
    const acao = rep.ativo ? "desativar" : "reativar";
    if (!window.confirm(`Deseja ${acao} o ${rep.identificador}?${rep.ativo ? "\n\nO aparelho para de registrar imediatamente." : ""}`)) return;
    try {
      await apiRequest(`/ponto/reps/${rep.id}`, { method: "PUT", body: JSON.stringify({ ativo: !rep.ativo }) });
      carregar();
    } catch (e) { alert(`Não foi possível: ${e.message}`); }
  };

  const conferir = async (rep) => {
    setIntegridade({ rep: rep.identificador, carregando: true });
    try {
      setIntegridade({ ...(await apiRequest(`/ponto/integridade/${rep.identificador}`)), carregando: false });
    } catch (e) { setIntegridade({ rep: rep.identificador, erro: e.message }); }
  };

  return (
    <div>
      <div className="nf-section">
        <h4 className="nf-section-title">Cadastrar um tablet</h4>
        <div className="nf-grid-3">
          <div className="field-group">
            <label className="field-label">Identificação<span className="req">*</span></label>
            <input value={novo.identificador} placeholder="TABLET-PATIO-01"
              onChange={e => setNovo(n => ({ ...n, identificador: e.target.value.toUpperCase() }))} />
          </div>
          <div className="field-group">
            <label className="field-label">Descrição</label>
            <input value={novo.descricao} placeholder="Tablet da portaria"
              onChange={e => setNovo(n => ({ ...n, descricao: e.target.value }))} />
          </div>
          <div className="field-group">
            <label className="field-label">Local</label>
            <input value={novo.localizacao} placeholder="Pátio de cavaco"
              onChange={e => setNovo(n => ({ ...n, localizacao: e.target.value }))} />
          </div>
        </div>
        <button className="btn btn-primary" onClick={cadastrar}>Cadastrar tablet</button>
        {erro && <p className="error-text">{erro}</p>}
      </div>

      {tokenNovo && (
        <div className="nf-section" style={{ background: "#eaf3de", borderRadius: 10, padding: 14 }}>
          <h4 className="nf-section-title" style={{ marginTop: 0 }}>Token do {tokenNovo.identificador}</h4>
          <p className="hint" style={{ marginTop: 0 }}>
            Copie agora e guarde: por segurança, ele não é exibido de novo. É o que se digita na
            configuração do app do tablet, junto com o endereço do sistema.
          </p>
          <code style={{ display: "block", wordBreak: "break-all", background: "#fff", padding: "10px 12px",
                         borderRadius: 8, fontSize: 13, margin: "8px 0" }}>{tokenNovo.token}</code>
          <button className="btn" onClick={() => { navigator.clipboard?.writeText(tokenNovo.token); }}>Copiar</button>
          <button className="btn" onClick={() => setTokenNovo(null)} style={{ marginLeft: 8 }}>Já guardei</button>
        </div>
      )}

      {reps === null ? <p className="hint">Carregando…</p> : reps.length === 0 ? (
        <p className="hint">Nenhum tablet cadastrado. Cadastre um acima para liberar o registro de ponto.</p>
      ) : (
        <table className="data-table">
          <thead>
            <tr><th>Identificação</th><th>Local</th><th>Empresas atendidas</th><th>Batidas</th><th>Último NSR</th><th>Situação</th><th></th></tr>
          </thead>
          <tbody>
            {reps.map(rep => (
              <tr key={rep.id} style={rep.ativo ? undefined : { opacity: 0.55 }}>
                <td><strong>{rep.identificador}</strong>{rep.descricao && <span className="subtle" style={{ display: "block", fontSize: 11.5 }}>{rep.descricao}</span>}</td>
                <td>{rep.localizacao || "—"}</td>
                <td>
                  {/* Sem nenhuma marcada, o tablet atende todas — é o caso
                      do aparelho do pátio num grupo de empresas. */}
                  {rep.empresasAtendidas?.length
                    ? rep.empresasAtendidas.map(e => e.nomeFantasia || e.razaoSocial).join(", ")
                    : <span className="subtle">todas</span>}
                  <button className="link-btn" style={{ display: "block", fontSize: 12 }}
                    onClick={() => setEmpresasDe(rep)}>
                    alterar
                  </button>
                </td>
                <td>{rep._count?.marcacoes ?? 0}</td>
                <td>{rep.ultimoNsr}</td>
                <td>{rep.ativo ? "Ativo" : "Desativado"}</td>
                <td className="actions-col">
                  <button className="btn" style={{ padding: "5px 12px", fontSize: 12.5 }} onClick={() => conferir(rep)}>Conferir integridade</button>
                  <button className="btn" style={{ padding: "5px 12px", fontSize: 12.5, marginLeft: 6 }}
                    onClick={async () => {
                      if (!window.confirm(`Gerar um token novo para ${rep.identificador}?\n\nO token atual para de funcionar na hora, e o tablet precisa ser reconfigurado com o novo.`)) return;
                      try {
                        setTokenNovo(await apiRequest(`/ponto/reps/${rep.id}/novo-token`, { method: "POST" }));
                      } catch (e) { alert(`Não foi possível: ${e.message}`); }
                    }}>
                    Novo token
                  </button>
                  <button className="btn" style={{ padding: "5px 12px", fontSize: 12.5, marginLeft: 6 }} onClick={() => alternarAtivo(rep)}>
                    {rep.ativo ? "Desativar" : "Reativar"}
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      {integridade && (
        <div className="nf-section">
          <h4 className="nf-section-title">Integridade — {integridade.rep}</h4>
          {integridade.carregando && <p className="hint">Conferindo a corrente de registros…</p>}
          {integridade.erro && <p className="error-text">{integridade.erro}</p>}
          {integridade.integro === true && (
            <p style={{ color: "#00732F", fontWeight: 600 }}>
              {integridade.total} marcações conferidas: nenhuma alteração detectada.
            </p>
          )}
          {integridade.integro === false && (
            <>
              <p className="error-text">Foram encontrados problemas na corrente de registros:</p>
              <ul>{integridade.problemas.map((p, i) => <li key={i}>NSR {p.nsr}: {p.problema}</li>)}</ul>
            </>
          )}
        </div>
      )}
      {empresasDe && (
        <EmpresasDoTabletModal
          rep={empresasDe}
          onFechar={() => setEmpresasDe(null)}
          onSalvo={() => { setEmpresasDe(null); carregar(); }}
        />
      )}

    </div>
  );
}

function PontoPessoas() {
  const [pessoas, setPessoas] = useState(null);
  const [erro, setErro] = useState("");

  const carregar = useCallback(async () => {
    try { setPessoas(await apiRequest("/ponto/colaboradores")); }
    catch (e) { setErro(e.message); setPessoas([]); }
  }, []);
  useEffect(() => { carregar(); }, [carregar]);

  const definirPin = async (pessoa) => {
    const pin = window.prompt(`PIN de ponto para ${pessoa.nome} (4 a 6 dígitos):`);
    if (!pin) return;
    if (!/^\d{4,6}$/.test(pin)) { alert("O PIN deve ter de 4 a 6 dígitos."); return; }
    try {
      await apiRequest(`/ponto/pin/${pessoa.id}`, { method: "PUT", body: JSON.stringify({ pin }) });
      alert(`PIN definido. Avise ${pessoa.nome} e oriente a não compartilhar — a batida é pessoal.`);
      carregar();
    } catch (e) { alert(`Não foi possível: ${e.message}`); }
  };

  const revogarBiometria = async (pessoa) => {
    if (!window.confirm(`Remover a biometria facial de ${pessoa.nome}?\n\nEla volta a bater ponto pelo PIN. O colaborador pode pedir isso a qualquer momento.`)) return;
    try {
      await apiRequest(`/ponto/biometria/${pessoa.id}`, { method: "DELETE" });
      carregar();
    } catch (e) { alert(`Não foi possível: ${e.message}`); }
  };

  if (pessoas === null) return <p className="hint">Carregando…</p>;
  if (erro) return <p className="error-text">{erro}</p>;

  const semPin = pessoas.filter(p => !p.temPin);

  return (
    <div>
      {semPin.length > 0 && (
        <p className="hint" style={{ background: "#fbf3e2", color: "#7a5205", padding: "11px 13px", borderRadius: 8 }}>
          <strong>{semPin.length} colaborador(es) sem PIN:</strong> {semPin.map(p => p.nome).join(", ")}.
          Sem PIN essas pessoas não conseguem registrar ponto se o tablet estiver em modo somente PIN.
        </p>
      )}
      <p className="hint">
        O PIN é a forma garantida de marcar o ponto: funciona com óculos escuros, com poeira na lente e
        sob sol forte. O rosto, quando usado, se cadastra no próprio tablet.
      </p>
      <table className="data-table">
        <thead>
          <tr><th>Colaborador</th><th>Cargo</th><th>PIN</th><th>Rosto</th><th></th></tr>
        </thead>
        <tbody>
          {pessoas.map(p => (
            <tr key={p.id}>
              <td><strong>{p.nome}</strong><span className="subtle" style={{ display: "block", fontSize: 11.5 }}>{p.cpf}</span></td>
              <td>{p.cargo || "—"}</td>
              <td>{p.temPin
                ? <span style={{ color: "#00732F", fontWeight: 600 }}>definido</span>
                : <span style={{ color: "#b57a12", fontWeight: 600 }}>sem PIN</span>}</td>
              <td>{p.temBiometria
                ? <span title={p.consentimentoEm ? `Consentimento em ${new Date(p.consentimentoEm).toLocaleDateString("pt-BR")}` : ""}>cadastrado</span>
                : "—"}</td>
              <td className="actions-col">
                <button className="btn" style={{ padding: "5px 12px", fontSize: 12.5 }} onClick={() => definirPin(p)}>
                  {p.temPin ? "Trocar PIN" : "Definir PIN"}
                </button>
                {p.temBiometria && (
                  <button className="btn" style={{ padding: "5px 12px", fontSize: 12.5, marginLeft: 6 }} onClick={() => revogarBiometria(p)}>
                    Remover rosto
                  </button>
                )}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// Foto registrada numa batida por PIN. Serve para conferir quem bateu
// quando o rosto não pôde ser verificado na hora.
function FotoDaBatidaModal({ batida, onFechar }) {
  const [dados, setDados] = useState(null);
  const [erro, setErro] = useState("");

  useEffect(() => {
    apiRequest(`/ponto/marcacoes/${batida.id}/foto`)
      .then(setDados)
      .catch(e => setErro(e.message));
  }, [batida.id]);

  const TEXTO = {
    conferida: { texto: "Rosto conferido com o cadastro", cor: "#00732F" },
    "sem-cadastro": { texto: "Colaborador sem rosto cadastrado — foto apenas registrada", cor: "#b57a12" },
    "sem-rosto": { texto: "Nenhum rosto detectado na foto", cor: "#c62828" },
  };
  const situacao = TEXTO[dados?.conferencia] || { texto: "—", cor: "#6b6b68" };

  return (
    <div className="modal-backdrop">
      <div className="modal" style={{ maxWidth: 460 }}>
        <div className="modal-header">
          <h3>Foto da batida</h3>
          <button className="icon-btn" onClick={onFechar} aria-label="Fechar"><X size={18} /></button>
        </div>
        <div className="modal-body" style={{ textAlign: "center" }}>
          {erro && <p className="error-text">{erro}</p>}
          {!dados && !erro && <p className="hint">Carregando…</p>}
          {dados && (
            <>
              <img src={dados.imagem} alt="Foto do momento da batida"
                style={{ maxWidth: "100%", borderRadius: 10, border: "1px solid #e5e3da" }} />
              <p style={{ marginBottom: 2, fontWeight: 500 }}>{dados.colaborador}</p>
              <p className="subtle" style={{ marginTop: 0 }}>
                {new Date(dados.dataHora).toLocaleString("pt-BR")}
              </p>
              <p style={{ color: situacao.cor, fontSize: 13 }}>{situacao.texto}</p>
            </>
          )}
        </div>
        <div className="modal-footer">
          <button className="btn btn-primary" onClick={onFechar}>Fechar</button>
        </div>
      </div>
    </div>
  );
}

function PontoEspelho() {
  const hoje = new Date().toISOString().slice(0, 10);
  const primeiroDia = `${hoje.slice(0, 8)}01`;

  const [fotoDe, setFotoDe] = useState(null);
  const [pessoas, setPessoas] = useState([]);
  const [filtro, setFiltro] = useState({ colaboradorId: "", de: primeiroDia, ate: hoje });
  const [espelho, setEspelho] = useState(null);
  const [erro, setErro] = useState("");
  const [carregando, setCarregando] = useState(false);

  useEffect(() => {
    apiRequest("/ponto/colaboradores").then(setPessoas).catch(() => setPessoas([]));
  }, []);

  const buscar = useCallback(async () => {
    if (!filtro.colaboradorId) { setErro("Escolha um colaborador para apurar o período."); return; }
    setErro(""); setCarregando(true);
    try {
      const params = new URLSearchParams(filtro);
      setEspelho(await apiRequest(`/ponto/espelho?${params}`));
    } catch (e) {
      setErro([e.message, e.detalhe].filter(Boolean).join(" — "));
      setEspelho(null);
    } finally { setCarregando(false); }
  }, [filtro]);

  const registrarTratamento = async (dia) => {
    const tipo = window.prompt("Tipo de tratamento: inclusao, desconsideracao ou pre_assinalado", "inclusao");
    if (!tipo) return;
    const hora = window.prompt(`Hora do registro no dia ${dia} (formato 08:15):`, "08:00");
    if (!hora) return;
    const motivo = window.prompt("Motivo (fica registrado com seu nome):");
    if (!motivo || motivo.trim().length < 5) { alert("Informe o motivo."); return; }
    try {
      await apiRequest("/ponto/tratamentos", {
        method: "POST",
        body: JSON.stringify({ tipo, colaboradorId: Number(filtro.colaboradorId), dataHora: `${dia}T${hora}:00`, motivo }),
      });
      buscar();
    } catch (e) { alert(`Não foi possível: ${e.message}`); }
  };

  const corDaSituacao = (situacoes) => {
    if (situacoes.includes("falta") || situacoes.includes("batida faltando")) return "#c62828";
    if (situacoes.includes("atraso") || situacoes.includes("intervalo abaixo de 1h")) return "#b57a12";
    if (situacoes.includes("hora extra") || situacoes.includes("trabalho em folga")) return "#1F3B57";
    return "#6b6b68";
  };

  const T = espelho?.totais;

  return (
    <div>
      <div className="nf-grid-4" style={{ marginBottom: 16 }}>
        <div className="field-group">
          <label className="field-label">Colaborador</label>
          <select value={filtro.colaboradorId} onChange={e => setFiltro(f => ({ ...f, colaboradorId: e.target.value }))}>
            <option value="">Selecione…</option>
            {pessoas.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
          </select>
        </div>
        <div className="field-group">
          <label className="field-label">De</label>
          <input type="date" value={filtro.de} onChange={e => setFiltro(f => ({ ...f, de: e.target.value }))} />
        </div>
        <div className="field-group">
          <label className="field-label">Até</label>
          <input type="date" value={filtro.ate} onChange={e => setFiltro(f => ({ ...f, ate: e.target.value }))} />
        </div>
        <div className="field-group" style={{ display: "flex", alignItems: "flex-end" }}>
          <button className="btn btn-primary" onClick={buscar} disabled={carregando}>
            {carregando ? "Apurando…" : "Apurar período"}
          </button>
        </div>
      </div>

      {erro && <p className="error-text">{erro}</p>}

      {espelho && !espelho.temJornada && (
        <p className="hint" style={{ background: "#fbf3e2", color: "#7a5205", padding: "10px 12px", borderRadius: 8 }}>
          {espelho.colaborador.nome} não tem jornada cadastrada no período, então não há horário previsto para
          comparar — as batidas aparecem, sem apuração de atraso, falta ou extra. A jornada se cadastra na aba
          "Horários de trabalho" do colaborador.
        </p>
      )}

      {T && (
        <div className="cte-resumo" style={{ marginBottom: 14 }}>
          <div><span className="cte-resumo-rotulo">Trabalhado</span><span className="cte-resumo-valor">{T.trabalhadoTexto}</span></div>
          <div><span className="cte-resumo-rotulo">Previsto</span><span className="cte-resumo-valor">{T.previstoTexto}</span></div>
          <div>
            <span className="cte-resumo-rotulo">Saldo</span>
            <span className="cte-resumo-valor" style={{ color: T.saldoMinutos < 0 ? "#c62828" : "#00732F" }}>{T.saldoTexto}</span>
          </div>
          <div><span className="cte-resumo-rotulo">Dias trabalhados</span><span className="cte-resumo-valor">{T.diasTrabalhados}</span></div>
          <div><span className="cte-resumo-rotulo">Faltas</span><span className="cte-resumo-valor">{T.faltas}</span></div>
          <div><span className="cte-resumo-rotulo">Atrasos</span><span className="cte-resumo-valor">{T.atrasos}</span></div>
          {T.inconsistencias > 0 && (
            <div>
              <span className="cte-resumo-rotulo">A resolver</span>
              <span className="cte-resumo-valor" style={{ color: "#c62828" }}>{T.inconsistencias}</span>
            </div>
          )}
        </div>
      )}

      {espelho && (
        <table className="data-table">
          <thead>
            <tr><th>Dia</th><th>Previsto</th><th>Batidas</th><th>Trabalhado</th><th>Saldo</th><th>Situação</th><th></th></tr>
          </thead>
          <tbody>
            {espelho.dias.map(d => (
              <tr key={d.dia} style={d.folga && !d.batidas.length ? { opacity: 0.5 } : undefined}>
                <td>
                  {new Date(`${d.dia}T12:00:00Z`).toLocaleDateString("pt-BR")}
                  <span className="subtle" style={{ display: "block", fontSize: 11.5 }}>
                    {DIAS_SEMANA[d.diaSemana]}{d.posicaoCiclo ? ` · ciclo ${d.posicaoCiclo}` : ""}
                  </span>
                </td>
                <td>{d.folga ? "Folga" : (d.previstoTexto || "—")}</td>
                <td style={{ fontVariantNumeric: "tabular-nums" }}>
                  {d.batidas.length
                    ? d.batidas.map(b => (
                        <span key={b.id}
                          title={`NSR ${b.nsr} · ${b.metodo}${b.offline ? " · offline" : ""}${
                            b.temFoto ? ` · foto (${b.conferenciaFacial})` : ""}`}
                          style={{ marginRight: 9 }}>
                          {b.hora}{b.temTratamento && <span style={{ color: "#b57a12" }}>*</span>}
                          {/* Batida por PIN com foto: clicar abre a imagem.
                              A cor diz se o rosto foi conferido. */}
                          {b.temFoto && (
                            <button className="link-btn" title="Ver foto da batida"
                              style={{
                                marginLeft: 3, fontSize: 11,
                                color: b.conferenciaFacial === "conferida" ? "#00732F" : "#b57a12",
                              }}
                              onClick={() => setFotoDe(b)}>
                              ◉
                            </button>
                          )}
                        </span>
                      ))
                    : "—"}
                </td>
                <td style={{ fontVariantNumeric: "tabular-nums" }}>{d.trabalhadoTexto}</td>
                <td style={{ fontVariantNumeric: "tabular-nums", color: d.diferencaMinutos < 0 ? "#c62828" : d.diferencaMinutos > 0 ? "#00732F" : "inherit" }}>
                  {d.diferencaMinutos ? d.diferencaTexto : "—"}
                </td>
                <td style={{ color: corDaSituacao(d.situacoes), fontSize: 12.5 }}>{d.situacoes.join(", ") || "—"}</td>
                <td className="actions-col">
                  <button className="btn" style={{ padding: "4px 10px", fontSize: 12 }} onClick={() => registrarTratamento(d.dia)}>Tratar</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      <p className="hint" style={{ marginTop: 14 }}>
        As batidas não podem ser alteradas nem apagadas — é exigência da Portaria 671/2021. Correções entram
        como tratamento, ao lado do registro original, com autor e motivo. O asterisco marca a batida que tem
        tratamento. A tolerância vem da jornada: diferenças menores que ela não viram crédito nem débito.
      </p>
      {fotoDe && <FotoDaBatidaModal batida={fotoDe} onFechar={() => setFotoDe(null)} />}

    </div>
  );
}


function ModuleView({ moduleKey }) {
  const config = MODULES[moduleKey];
  const Icon = config.icon;
  const colors = COLOR_MAP[config.color];
  const { items, erro, recarregar, criar, editar, remover, reativar, mostrarInativas, setMostrarInativas } = useApiCollection(moduleKey);
  const [query, setQuery] = useState("");
  const [editing, setEditing] = useState(null);
  const [showForm, setShowForm] = useState(false);
  const [pagina, setPagina] = useState(1);

  if (items === null) {
    return <div className="loading">Carregando {config.label.toLowerCase()}… (o servidor pode levar alguns segundos pra acordar)</div>;
  }

  const filtered = items.filter(it => {
    if (!query) return true;
    const hay = JSON.stringify(it).toLowerCase();
    return hay.includes(query.toLowerCase());
  });

  // 50 por página: lista longa demais cansa de rolar e deixa a tela pesada.
  const POR_PAGINA = 50;
  const totalPaginas = Math.max(1, Math.ceil(filtered.length / POR_PAGINA));
  const paginaAtual = Math.min(pagina, totalPaginas);
  const visiveis = filtered.slice((paginaAtual - 1) * POR_PAGINA, paginaAtual * POR_PAGINA);

  const handleSave = async (data) => {
    if (data.id) {
      await editar(data.id, data);
    } else {
      await criar(data);
    }
    setShowForm(false);
    setEditing(null);
  };

  const handleDelete = async (id) => {
    try {
      await remover(id);
    } catch (e) {
      // O servidor explica o motivo em "detalhe" (ex.: a empresa tem
      // lançamentos vinculados e por isso não pode ser excluída).
      alert([`Não foi possível excluir: ${e.message}`, e.detalhe].filter(Boolean).join("\n\n"));
    }
  };

  return (
    <div>
      <div className="view-header">
        <div className="view-title">
          <div className="icon-badge" style={{ background: colors.bg, color: colors.text }}>
            <Icon size={20} />
          </div>
          <div>
            <h2>{config.label}</h2>
            <p className="subtle">
              {items.length} cadastro{items.length !== 1 ? "s" : ""}
              {config.permiteReativar && (
                <>
                  {" · "}
                  <button
                    type="button"
                    onClick={() => setMostrarInativas(!mostrarInativas)}
                    style={{ border: "none", background: "none", padding: 0, cursor: "pointer",
                             color: "#00732F", font: "inherit", textDecoration: "underline" }}
                  >
                    {mostrarInativas ? "ocultar excluídas" : "mostrar excluídas"}
                  </button>
                </>
              )}
            </p>
          </div>
        </div>
        <button className="btn btn-primary" onClick={() => { setEditing(null); setShowForm(true); }}>
          <Plus size={16} /> Novo
        </button>
      </div>

      {erro && (
        <div className="error-banner">
          <AlertCircle size={16} />
          <span>Não consegui falar com o servidor: {erro}. <button className="link-btn" onClick={recarregar}>Tentar de novo</button></span>
        </div>
      )}

      <div className="search-bar">
        <Search size={16} className="search-icon" />
        <input placeholder={`Buscar em ${config.label.toLowerCase()}…`} value={query}
          onChange={e => { setQuery(e.target.value); setPagina(1); }} />
      </div>

      {filtered.length === 0 ? (
        <div className="empty-state">
          <Icon size={32} strokeWidth={1.5} />
          <p>{items.length === 0 ? `Nenhum cadastro ainda.` : `Nada encontrado para "${query}".`}</p>
          {items.length === 0 && (
            <button className="btn btn-primary" onClick={() => setShowForm(true)}>
              <Plus size={16} /> Criar o primeiro
            </button>
          )}
        </div>
      ) : (
        <table className="data-table tabela-densa">
          <thead>
            <tr>
              {config.columns.map(col => (
                <th key={col}>{config.fields.find(f => f.key === col.split(".")[0])?.label || COLUMN_LABELS[col] || col}</th>
              ))}
              <th className="actions-col"></th>
            </tr>
          </thead>
          <tbody>
            {visiveis.map(item => (
              <tr key={item.id} style={item.ativo === false ? { opacity: 0.5 } : undefined}>
                {config.columns.map(col => (
                  <td key={col}>{COLUNAS_MOEDA.has(col)
                    ? (getPath(item, col) != null && getPath(item, col) !== "" ? `R$ ${formatarMoeda(getPath(item, col))}` : "—")
                    : getPath(item, col) || "—"}</td>
                ))}
                <td className="actions-col">
                  {config.permiteReativar && item.ativo === false && (
                    <button
                      className="icon-btn"
                      title="Trazer de volta"
                      onClick={async () => {
                        if (!window.confirm(`Reativar ${item.nome}?`)) return;
                        try { await reativar(item.id); }
                        catch (e) { alert(`Não foi possível reativar: ${e.message}`); }
                      }}
                    >
                      ↺
                    </button>
                  )}
                  <button className="icon-btn" onClick={() => { setEditing(item); setShowForm(true); }} aria-label="Editar">
                    <Pencil size={15} />
                  </button>
                  <button className="icon-btn icon-btn-danger" onClick={() => handleDelete(item.id)} aria-label="Excluir">
                    <Trash2 size={15} />
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      {totalPaginas > 1 && (
        <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 12, fontSize: 13 }}>
          <button className="btn" style={{ padding: "5px 12px" }}
            disabled={paginaAtual === 1} onClick={() => setPagina(paginaAtual - 1)}>
            Anterior
          </button>
          <span className="subtle">
            Página {paginaAtual} de {totalPaginas} · {filtered.length} registro{filtered.length !== 1 ? "s" : ""}
          </span>
          <button className="btn" style={{ padding: "5px 12px" }}
            disabled={paginaAtual === totalPaginas} onClick={() => setPagina(paginaAtual + 1)}>
            Próxima
          </button>
        </div>
      )}

      {showForm && (
        <RecordForm
          moduleKey={moduleKey}
          record={editing}
          onSave={handleSave}
          onCancel={() => { setShowForm(false); setEditing(null); }}
        />
      )}

      {/* A limpeza da base vive aqui porque o plano do servidor não dá
          acesso ao terminal — sem isso não haveria como zerar os dados de
          teste antes de entrar em produção. */}
      {moduleKey === "empresas" && <AmbienteFiscal />}
      {moduleKey === "empresas" && <ZerarBase />}
    </div>
  );
}

// Em que ambiente cada documento está emitindo. Fica à vista porque a
// diferença entre teste e documento fiscal de verdade não pode depender de
// memória.
function AmbienteFiscal() {
  const [ambiente, setAmbiente] = useState(null);

  useEffect(() => {
    apiRequest("/manutencao/ambiente").then(setAmbiente).catch(() => setAmbiente(null));
  }, []);

  if (!ambiente) return null;

  const rotulo = { NFe: "NF-e", CTe: "CT-e", MDFe: "MDF-e" };

  return (
    <div className="nf-section" style={{ marginTop: 24 }}>
      <h4 className="nf-section-title">Ambiente de emissão</h4>
      <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
        {["NFe", "CTe", "MDFe"].map(tipo => {
          const producao = ambiente[tipo] === "producao";
          return (
            <span key={tipo} style={{
              display: "inline-flex", alignItems: "center", gap: 7, fontSize: 13,
              padding: "7px 13px", borderRadius: 999,
              background: producao ? "#eaf3de" : "#fbf3e2",
              color: producao ? "#00732F" : "#7a5205",
              border: `1px solid ${producao ? "#cde0b8" : "#ecdcb4"}`,
            }}>
              <strong>{rotulo[tipo]}</strong>
              {producao ? "produção" : "homologação"}
            </span>
          );
        })}
      </div>
      <p className="hint">
        Em homologação o documento não tem valor fiscal e sai com tarja de teste. Em produção vale de
        verdade e o cancelamento tem prazo. O ambiente é definido nas variáveis do servidor.
      </p>
    </div>
  );
}

function ZerarBase() {
  const [contagem, setContagem] = useState(null);
  const [aberto, setAberto] = useState(false);
  const [senha, setSenha] = useState("");
  const [confirmacao, setConfirmacao] = useState("");
  const [processando, setProcessando] = useState(false);
  const [resultado, setResultado] = useState(null);

  const carregar = useCallback(async () => {
    try { setContagem(await apiRequest("/manutencao/base")); }
    catch (e) { setContagem({ erro: e.message }); }
  }, []);
  useEffect(() => { if (aberto) carregar(); }, [aberto, carregar]);

  const zerar = async () => {
    setProcessando(true); setResultado(null);
    try {
      const r = await apiRequest("/manutencao/base/zerar", {
        method: "POST",
        body: JSON.stringify({ senha, confirmacao }),
      });
      setResultado({ ok: true, texto: `Base zerada. ${r.registrosRemovidos} registro(s) removido(s).` });
      setSenha(""); setConfirmacao("");
      carregar();
    } catch (e) {
      setResultado({ ok: false, texto: [e.message, e.detalhe].filter(Boolean).join(" — ") });
    } finally { setProcessando(false); }
  };

  return (
    <div className="nf-section" style={{ marginTop: 28, borderTop: "1px solid #e5e3da", paddingTop: 20 }}>
      <button className="link-btn" onClick={() => setAberto(a => !a)}>
        {aberto ? "Ocultar" : "Zerar dados de teste"}
      </button>

      {aberto && (
        <div style={{ marginTop: 14, background: "#faece7", border: "1px solid #e8cfc4", borderRadius: 10, padding: "16px 18px" }}>
          <h4 style={{ margin: "0 0 6px", color: "#791f1f", fontSize: 15 }}>Zerar a base</h4>
          <p className="hint" style={{ marginTop: 0 }}>
            Apaga documentos fiscais, cadastros e todo o controle de ponto, e devolve a numeração para 1.
            Usuários, empresas e as tabelas de CFOP, NCM e municípios continuam. Não tem como desfazer.
          </p>

          {contagem?.producao && (
            <p className="error-text">
              A emissão está apontando para produção. Nesse caso a base não pode ser zerada: documento
              autorizado tem valor fiscal e precisa ser guardado por cinco anos.
            </p>
          )}

          {contagem?.tabelas && (
            <table className="data-table" style={{ margin: "12px 0" }}>
              <tbody>
                {contagem.tabelas.filter(t => t.total > 0).map(t => (
                  <tr key={t.tabela}><td>{t.rotulo}</td><td style={{ textAlign: "right" }}>{t.total}</td></tr>
                ))}
                <tr><td><strong>Total</strong></td><td style={{ textAlign: "right" }}><strong>{contagem.total}</strong></td></tr>
              </tbody>
            </table>
          )}

          {!contagem?.producao && (
            <div className="nf-grid-3">
              <div className="field-group">
                <label className="field-label">Sua senha</label>
                <input type="password" value={senha} onChange={e => setSenha(e.target.value)} />
              </div>
              <div className="field-group">
                <label className="field-label">Digite ZERAR para confirmar</label>
                <input value={confirmacao} onChange={e => setConfirmacao(e.target.value)} placeholder="ZERAR" />
              </div>
              <div className="field-group" style={{ display: "flex", alignItems: "flex-end" }}>
                <button className="btn btn-danger" disabled={processando || confirmacao !== "ZERAR" || !senha}
                  onClick={zerar}>
                  {processando ? "Apagando…" : "Zerar agora"}
                </button>
              </div>
            </div>
          )}

          {resultado && (
            <p className={resultado.ok ? "hint" : "error-text"} style={resultado.ok ? { color: "#00732F" } : undefined}>
              {resultado.texto}
            </p>
          )}
        </div>
      )}
    </div>
  );
}

// Acompanhamento de clientes no painel: até três, com o que já foi faturado
// no mês. A escolha fica no navegador de quem usa — é preferência de quem
// olha a tela, não configuração da empresa.
function ClientesDoMes() {
  const { items: clientes } = useApiCollection("clientes");
  const [selecionados, setSelecionados] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem("erp.painel.clientes") || "[]").slice(0, 6);
    } catch { return []; }
  });
  const [dados, setDados] = useState(null);
  const [escolhendo, setEscolhendo] = useState(false);

  useEffect(() => {
    try { localStorage.setItem("erp.painel.clientes", JSON.stringify(selecionados)); } catch { /* sem espaço */ }
  }, [selecionados]);

  useEffect(() => {
    if (!selecionados.length) { setDados(null); return; }
    apiRequest(`/relatorios/nfe/por-cliente?clientes=${selecionados.join(",")}`)
      .then(setDados)
      .catch(() => setDados(null));
  }, [selecionados]);

  const alternar = (id) => {
    setSelecionados(atual => {
      if (atual.includes(id)) return atual.filter(x => x !== id);
      if (atual.length >= 6) return atual;
      return [...atual, id];
    });
  };

  const mesNome = new Date().toLocaleDateString("pt-BR", { month: "long", year: "numeric" });

  return (
    <div className="nf-section" style={{ marginBottom: 18 }}>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 12 }}>
        <h4 className="nf-section-title" style={{ margin: 0 }}>
          Faturamento por cliente <span className="subtle" style={{ fontWeight: 400 }}>· {mesNome}</span>
        </h4>
        <button className="link-btn" onClick={() => setEscolhendo(v => !v)}>
          {escolhendo ? "Pronto" : selecionados.length ? "Trocar clientes" : "Escolher clientes"}
        </button>
      </div>

      {escolhendo && (
        <div style={{ margin: "10px 0 4px" }}>
          <p className="hint" style={{ marginTop: 0 }}>Até seis clientes. {selecionados.length}/6 escolhidos.</p>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6, maxHeight: 180, overflowY: "auto" }}>
            {(clientes || []).map(c => {
              const ativo = selecionados.includes(c.id);
              return (
                <button
                  key={c.id}
                  className="btn"
                  style={{
                    padding: "4px 10px", fontSize: 12.5,
                    background: ativo ? "#1F3B57" : undefined,
                    color: ativo ? "#fff" : undefined,
                  }}
                  disabled={!ativo && selecionados.length >= 6}
                  onClick={() => alternar(c.id)}
                >
                  {c.fantasia || c.nome}
                </button>
              );
            })}
          </div>
        </div>
      )}

      {!selecionados.length && !escolhendo && (
        <p className="hint">Escolha até seis clientes para acompanhar o faturamento do mês.</p>
      )}

      {dados?.clientes?.length > 0 && (
        <div className="clientes-mes">
          {dados.clientes.map(c => (
            <div key={c.id} className="cliente-card" title={c.razaoSocial || c.nome}>
              <div className="cliente-card-nome">{c.nome}</div>
              <div className="cliente-card-valor">R$ {formatarMoeda(c.valor)}</div>
              <div className="cliente-card-qtd">
                {/* Quantidade de mercadoria, por unidade. A contagem de
                    notas fica em segundo plano — o que a operação acompanha
                    é o volume vendido. */}
                {c.quantidades?.length
                  ? c.quantidades.map(q => `${formatarQuantidade(q.quantidade)} ${q.unidade}`).join(" · ")
                  : "sem itens"}
                <span className="subtle"> · {c.notas} nota{c.notas !== 1 ? "s" : ""}</span>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// Agenda no painel: o que está atrasado e o que vence logo, com a tarefa
// podendo ser concluída sem sair daqui. Lista curta de propósito — o painel
// mostra o que exige ação, não a agenda inteira.
function AgendaDoPainel({ onNavigate }) {
  const [eventos, setEventos] = useState(null);
  const hoje = new Date().toISOString().slice(0, 10);

  const carregar = useCallback(async () => {
    const ate = new Date(`${hoje}T12:00:00Z`);
    ate.setUTCDate(ate.getUTCDate() + 7);
    try {
      const dados = await apiRequest(
        `/agenda?de=2020-01-01&ate=${ate.toISOString().slice(0, 10)}&status=pendente`
      );
      setEventos(dados.eventos);
    } catch {
      setEventos([]);
    }
  }, [hoje]);

  useEffect(() => { carregar(); }, [carregar]);

  const concluir = async (evento) => {
    try {
      await apiRequest(`/agenda/${evento.id}/concluir`, { method: "POST" });
      carregar();
    } catch (e) { alert(`Não foi possível concluir: ${e.message}`); }
  };

  if (!eventos?.length) return null;

  const PESO = { alta: 0, normal: 1, baixa: 2 };
  const ordenados = [...eventos].sort((a, b) => {
    const prioridade = (PESO[a.prioridade] ?? 1) - (PESO[b.prioridade] ?? 1);
    if (prioridade) return prioridade;
    return String(b.data).slice(0, 10).localeCompare(String(a.data).slice(0, 10));
  });

  const atrasados = eventos.filter(e => String(e.data).slice(0, 10) < hoje).length;
  const corPrioridade = { alta: "#c62828", normal: "#6b6b68", baixa: "#b9b7ae" };

  const rotuloDia = (dia) => {
    const d = new Date(`${dia}T12:00:00Z`);
    const dias = Math.round((d - new Date(`${hoje}T12:00:00Z`)) / 86400000);
    if (dias === 0) return "Hoje";
    if (dias === 1) return "Amanhã";
    if (dias === -1) return "Ontem";
    const formatado = d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" }).replace(".", "");
    return dias < 0 ? `${formatado} · atrasado` : formatado;
  };

  return (
    <div className="nf-section" style={{ marginBottom: 18 }}>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", gap: 12 }}>
        <h4 className="nf-section-title" style={{ margin: 0 }}>
          Agenda
          <span className="subtle" style={{ fontWeight: 400 }}>
            {" · "}{eventos.length} pendente{eventos.length !== 1 ? "s" : ""}
            {atrasados > 0 && <span style={{ color: "#c62828" }}>{` · ${atrasados} atrasado${atrasados !== 1 ? "s" : ""}`}</span>}
          </span>
        </h4>
        <button className="link-btn" onClick={() => onNavigate("agenda")}>Ver tudo</button>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 5, marginTop: 10 }}>
        {ordenados.slice(0, 6).map(evento => {
          const dia = String(evento.data).slice(0, 10);
          return (
            <div key={evento.id} style={{
              display: "flex", alignItems: "flex-start", gap: 10,
              borderLeft: `3px solid ${corPrioridade[evento.prioridade] || "#6b6b68"}`,
              background: "var(--surface-2, #fff)", border: "1px solid var(--border, #e5e3da)",
              borderLeftWidth: 3, borderRadius: 8, padding: "6px 11px",
            }}>
              <input type="checkbox" style={{ width: "auto", marginTop: 2 }}
                checked={false} onChange={() => concluir(evento)} />
              <div style={{ flex: 1, minWidth: 0, cursor: "pointer" }} onClick={() => onNavigate("agenda")}>
                <div style={{ fontSize: 13.5, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                  {evento.titulo}
                </div>
                <div className="subtle" style={{ fontSize: 12 }}>
                  <span style={dia < hoje ? { color: "#c62828", fontWeight: 600 } : undefined}>{rotuloDia(dia)}</span>
                  {" · "}
                  {evento.responsaveis?.length
                    ? evento.responsaveis.map(r => r.colaborador.nome.split(" ")[0]).join(", ")
                    : "sem responsável"}
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {ordenados.length > 6 && (
        <p className="hint">e mais {ordenados.length - 6} compromisso{ordenados.length - 6 !== 1 ? "s" : ""}.</p>
      )}
    </div>
  );
}
