function EventoForm({ evento, colaboradores, onFechar, onSalvo }) {
  const hoje = new Date().toISOString().slice(0, 10);
  const [dados, setDados] = useState(() => ({
    titulo: evento?.titulo || "",
    descricao: evento?.descricao || "",
    data: evento?.data ? String(evento.data).slice(0, 10) : hoje,
    diaTodo: evento?.diaTodo ?? true,
    horaInicio: evento?.horaInicio || "",
    horaFim: evento?.horaFim || "",
    prioridade: evento?.prioridade || "normal",
    responsaveis: evento?.responsaveis?.map(r => r.colaboradorId) || [],
    itens: evento?.itens?.map(i => ({ texto: i.texto, concluido: i.concluido })) || [],
  }));
  const [novoItem, setNovoItem] = useState("");
  const [salvando, setSalvando] = useState(false);
  const [erro, setErro] = useState("");

  const set = (campo, valor) => setDados(d => ({ ...d, [campo]: valor }));

  const alternarResponsavel = (id) => {
    setDados(d => ({
      ...d,
      responsaveis: d.responsaveis.includes(id)
        ? d.responsaveis.filter(x => x !== id)
        : [...d.responsaveis, id],
    }));
  };

  const salvar = async () => {
    if (!dados.titulo || !dados.data) {
      setErro("Informe o título e a data.");
      return;
    }
    setSalvando(true); setErro("");
    try {
      const corpo = {
        ...dados,
        // Sem hora quando é evento de dia inteiro: guardar hora aqui faria
        // a agenda mostrar um horário que ninguém combinou.
        horaInicio: dados.diaTodo ? null : (dados.horaInicio || null),
        horaFim: dados.diaTodo ? null : (dados.horaFim || null),
      };
      if (evento?.id) {
        await apiRequest(`/agenda/${evento.id}`, { method: "PUT", body: JSON.stringify(corpo) });
      } else {
        await apiRequest("/agenda", { method: "POST", body: JSON.stringify(corpo) });
      }
      onSalvo();
    } catch (e) {
      setErro([e.message, e.detalhe].filter(Boolean).join(" — "));
    } finally { setSalvando(false); }
  };

  return (
    <div className="modal-backdrop">
      <div className="modal modal-cadastro">
        <div className="modal-header">
          <h3>{evento?.id ? "Editar compromisso" : "Novo compromisso"}</h3>
          <button className="icon-btn" onClick={onFechar} aria-label="Fechar"><X size={18} /></button>
        </div>
        <div className="modal-body">
          <section className="pf-secao" style={{ paddingTop: 0 }}>
            <h4 className="pf-secao-titulo">O compromisso</h4>
            <div className="nf-grid-4">
              <div className="field-group" style={{ gridColumn: "span 3" }}>
                <label className="field-label">Título<span className="req">*</span></label>
                <input value={dados.titulo} onChange={e => set("titulo", e.target.value)}
                  placeholder="Ex.: Revisão do cavalo ABC1D23" />
              </div>
              <div className="field-group">
                <label className="field-label">Prioridade</label>
                <select value={dados.prioridade} onChange={e => set("prioridade", e.target.value)}>
                  <option value="baixa">Baixa</option>
                  <option value="normal">Normal</option>
                  <option value="alta">Alta</option>
                </select>
              </div>
            </div>
          </section>

          <section className="pf-secao">
            <h4 className="pf-secao-titulo">Quando</h4>
            <div className="nf-grid-4">
              <div className="field-group">
                <label className="field-label">Data<span className="req">*</span></label>
                <input type="date" value={dados.data} onChange={e => set("data", e.target.value)} />
              </div>
              <div className="field-group" style={{ display: "flex", alignItems: "flex-end" }}>
                <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, paddingBottom: 8 }}>
                  <input type="checkbox" style={{ width: "auto" }} checked={dados.diaTodo}
                    onChange={e => set("diaTodo", e.target.checked)} />
                  Dia inteiro
                </label>
              </div>
              {!dados.diaTodo && (
                <>
                  <div className="field-group">
                    <label className="field-label">Início</label>
                    <input type="time" value={dados.horaInicio} onChange={e => set("horaInicio", e.target.value)} />
                  </div>
                  <div className="field-group">
                    <label className="field-label">Fim</label>
                    <input type="time" value={dados.horaFim} onChange={e => set("horaFim", e.target.value)} />
                  </div>
                </>
              )}
            </div>
          </section>

          <section className="pf-secao">
            <h4 className="pf-secao-titulo">
              Responsáveis
              <span className="subtle" style={{ fontWeight: 400, marginLeft: 8, fontSize: 12.5 }}>
                {dados.responsaveis.length} escolhido{dados.responsaveis.length !== 1 ? "s" : ""}
              </span>
            </h4>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, maxHeight: 150, overflowY: "auto" }}>
              {(colaboradores || []).map(c => {
                const ativo = dados.responsaveis.includes(c.id);
                return (
                  <button key={c.id} type="button" className="btn"
                    style={{
                      padding: "4px 11px", fontSize: 12.5,
                      background: ativo ? "#1F3B57" : undefined,
                      color: ativo ? "#fff" : undefined,
                    }}
                    onClick={() => alternarResponsavel(c.id)}>
                    {c.nome}
                  </button>
                );
              })}
              {!colaboradores?.length && <p className="hint">Nenhum colaborador cadastrado ainda.</p>}
            </div>
          </section>

          <section className="pf-secao">
            <h4 className="pf-secao-titulo">
              Lista de verificação
              {dados.itens.length > 0 && (
                <span className="subtle" style={{ fontWeight: 400, marginLeft: 8, fontSize: 12.5 }}>
                  {dados.itens.filter(i => i.concluido).length} de {dados.itens.length} concluídos
                </span>
              )}
            </h4>

            {dados.itens.map((item, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "4px 0" }}>
                <input type="checkbox" style={{ width: "auto" }} checked={item.concluido}
                  onChange={e => setDados(d => ({
                    ...d,
                    itens: d.itens.map((x, j) => (j === i ? { ...x, concluido: e.target.checked } : x)),
                  }))} />
                <input
                  value={item.texto}
                  style={{ flex: 1, textDecoration: item.concluido ? "line-through" : undefined }}
                  onChange={e => setDados(d => ({
                    ...d,
                    itens: d.itens.map((x, j) => (j === i ? { ...x, texto: e.target.value } : x)),
                  }))}
                />
                <button type="button" className="icon-btn icon-btn-danger" title="Remover item"
                  onClick={() => setDados(d => ({ ...d, itens: d.itens.filter((_, j) => j !== i) }))}>
                  <Trash2 size={14} />
                </button>
              </div>
            ))}

            {/* Enter adiciona e mantém o foco: lista se digita em sequência. */}
            <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
              <input
                value={novoItem}
                placeholder="Adicionar item…"
                style={{ flex: 1 }}
                onChange={e => setNovoItem(e.target.value)}
                onKeyDown={e => {
                  if (e.key !== "Enter" || !novoItem.trim()) return;
                  e.preventDefault();
                  setDados(d => ({ ...d, itens: [...d.itens, { texto: novoItem.trim(), concluido: false }] }));
                  setNovoItem("");
                }}
              />
              <button type="button" className="btn" disabled={!novoItem.trim()}
                onClick={() => {
                  setDados(d => ({ ...d, itens: [...d.itens, { texto: novoItem.trim(), concluido: false }] }));
                  setNovoItem("");
                }}>
                Adicionar
              </button>
            </div>
          </section>

          <section className="pf-secao" style={{ paddingBottom: 0 }}>
            <h4 className="pf-secao-titulo">Detalhes</h4>
            <textarea rows={3} value={dados.descricao} onChange={e => set("descricao", e.target.value)}
              style={{ width: "100%", resize: "vertical", fontFamily: "inherit", fontSize: 14 }} />
          </section>

          {erro && <p className="error-text">{erro}</p>}
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onFechar} disabled={salvando}>Cancelar</button>
          <button className="btn btn-primary" onClick={salvar} disabled={salvando}>
            {salvando ? "Salvando…" : "Salvar"}
          </button>
        </div>
      </div>
    </div>
  );
}

function AgendaView() {
  const hoje = new Date().toISOString().slice(0, 10);
  const daquiUmMes = (() => {
    const d = new Date(`${hoje}T12:00:00Z`);
    d.setUTCMonth(d.getUTCMonth() + 1);
    return d.toISOString().slice(0, 10);
  })();

  const { items: colaboradores } = useApiCollection("colaboradores");
  // Sem filtro de data: a agenda inteira aparece, do que ficou para trás ao
  // que está marcado lá na frente. O intervalo existe só para a lista não
  // crescer sem limite com o passar dos anos.
  const periodo = (() => {
    const mover = (dias) => {
      const d = new Date(`${hoje}T12:00:00Z`);
      d.setUTCDate(d.getUTCDate() + dias);
      return d.toISOString().slice(0, 10);
    };
    return { de: mover(-365), ate: mover(365) };
  })();

  const [filtro, setFiltro] = useState({ status: "pendente", responsavelId: "" });
  const [dados, setDados] = useState(null);
  const [erro, setErro] = useState("");
  const [editando, setEditando] = useState(null);

  const carregar = useCallback(async () => {
    setErro("");
    try {
      const params = new URLSearchParams(
        Object.entries({ ...periodo, ...filtro }).filter(([, v]) => v !== "")
      );
      setDados(await apiRequest(`/agenda?${params}`));
    } catch (e) {
      setErro([e.message, e.detalhe].filter(Boolean).join(" — "));
    }
  }, [filtro, periodo.de, periodo.ate]);

  useEffect(() => { carregar(); }, [carregar]);

  const concluir = async (evento) => {
    try {
      await apiRequest(`/agenda/${evento.id}/${evento.status === "concluido" ? "reabrir" : "concluir"}`, { method: "POST" });
      carregar();
    } catch (e) { alert(`Não foi possível atualizar: ${e.message}`); }
  };

  const excluir = async (evento) => {
    if (!window.confirm(`Excluir "${evento.titulo}"?`)) return;
    try {
      await apiRequest(`/agenda/${evento.id}`, { method: "DELETE" });
      carregar();
    } catch (e) { alert(`Não foi possível excluir: ${e.message}`); }
  };

  // Alta primeiro, depois normal, depois baixa; dentro de cada uma, a data
  // mais recente no topo. Concluídos vão para o fim, qualquer que seja a
  // prioridade: já não disputam atenção com o que falta fazer.
  const PESO_PRIORIDADE = { alta: 0, normal: 1, baixa: 2 };
  const ordenados = [...(dados?.eventos || [])].sort((a, b) => {
    const feito = (e) => (e.status === "concluido" ? 1 : 0);
    if (feito(a) !== feito(b)) return feito(a) - feito(b);

    const prioridade = (PESO_PRIORIDADE[a.prioridade] ?? 1) - (PESO_PRIORIDADE[b.prioridade] ?? 1);
    if (prioridade) return prioridade;

    return String(b.data).slice(0, 10).localeCompare(String(a.data).slice(0, 10));
  });

  const rotuloDia = (dia) => {
    const d = new Date(`${dia}T12:00:00Z`);
    const hojeData = new Date(`${hoje}T12:00:00Z`);
    const dias = Math.round((d - hojeData) / 86400000);
    if (dias === 0) return "Hoje";
    if (dias === 1) return "Amanhã";
    if (dias === -1) return "Ontem";
    const formatado = d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" }).replace(".", "");
    return dias < 0 ? `${formatado} · atrasado` : formatado;
  };

  const corPrioridade = { alta: "#c62828", normal: "#6b6b68", baixa: "#8a887f" };
  const T = dados?.totais;

  return (
    <div>
      <div className="view-header">
        <div className="view-title">
          <div className="icon-badge" style={{ background: "#eeedfe", color: "#3c3489" }}>
            <Clock size={20} />
          </div>
          <div>
            <h2>Agenda</h2>
            <p className="subtle">
              {T ? `${T.pendentes} pendente${T.pendentes !== 1 ? "s" : ""}${T.atrasados ? ` · ${T.atrasados} atrasado${T.atrasados !== 1 ? "s" : ""}` : ""}` : "—"}
            </p>
          </div>
        </div>
        <button className="btn btn-primary" onClick={() => setEditando({})}>
          <Plus size={16} /> Novo compromisso
        </button>
      </div>

      <div className="nf-section">
        <div className="nf-grid-3">
          <div className="field-group">
            <label className="field-label">Situação</label>
            <select value={filtro.status} onChange={e => setFiltro(f => ({ ...f, status: e.target.value }))}>
              <option value="pendente">Pendentes</option>
              <option value="concluido">Concluídos</option>
              <option value="todos">Todos</option>
            </select>
          </div>
          <div className="field-group">
            <label className="field-label">Responsável</label>
            <select value={filtro.responsavelId} onChange={e => setFiltro(f => ({ ...f, responsavelId: e.target.value }))}>
              <option value="">Todos</option>
              {colaboradorDoUsuario() && <option value={colaboradorDoUsuario()}>Só os meus</option>}
              {(colaboradores || []).map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
            </select>
          </div>
        </div>
      </div>

      {erro && <p className="error-text">{erro}</p>}

      {dados && !ordenados.length && (
        <div className="empty-state"><p>Nenhum compromisso nesse período.</p></div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
        {ordenados.map(evento => {
          const dia = String(evento.data).slice(0, 10);
          const atrasado = dia < hoje && evento.status !== "concluido";
          return (
            <div key={evento.id} style={{
              display: "flex", alignItems: "flex-start", gap: 12,
              background: "var(--surface-2, #fff)", border: "1px solid var(--border, #e5e3da)",
              borderLeft: `3px solid ${corPrioridade[evento.prioridade] || "#6b6b68"}`,
              borderRadius: 8, padding: "5px 11px",
              opacity: evento.status === "concluido" ? 0.55 : 1,
            }}>
              <input type="checkbox" style={{ width: "auto", marginTop: 2 }}
                checked={evento.status === "concluido"} onChange={() => concluir(evento)} />
              {/* Clicar na linha abre para editar, como no app do celular. */}
              <div style={{ flex: 1, minWidth: 0, cursor: "pointer" }} onClick={() => setEditando(evento)}>
                <div style={{
                  fontWeight: 500, fontSize: 13.5, lineHeight: 1.3,
                  textDecoration: evento.status === "concluido" ? "line-through" : undefined,
                }}>
                  {evento.diaTodo ? "" : `${evento.horaInicio || ""}${evento.horaFim ? `–${evento.horaFim}` : ""} · `}
                  {evento.titulo}
                </div>
                {evento.descricao && (
                  <div className="subtle" style={{
                    fontSize: 12, lineHeight: 1.25,
                    whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
                  }}>{evento.descricao}</div>
                )}
                <div className="subtle" style={{ fontSize: 12, lineHeight: 1.25 }}>
                  <span style={atrasado ? { color: "#c62828", fontWeight: 600 } : undefined}>
                    {rotuloDia(dia)}
                  </span>
                  {" · "}
                  {evento.responsaveis?.length
                    ? evento.responsaveis.map(r => r.colaborador.nome.split(" ")[0]).join(", ")
                    : "sem responsável"}
                  {evento.itens?.length > 0 && (
                    <> · {evento.itens.filter(i => i.concluido).length}/{evento.itens.length} itens</>
                  )}
                </div>
              </div>
              <div style={{ whiteSpace: "nowrap" }}>
                <button className="icon-btn" title="Editar" onClick={() => setEditando(evento)}><Pencil size={14} /></button>
                <button className="icon-btn icon-btn-danger" title="Excluir" onClick={() => excluir(evento)}><Trash2 size={14} /></button>
              </div>
            </div>
          );
        })}
      </div>

      {editando && (
        <EventoForm
          evento={editando.id ? editando : null}
          colaboradores={colaboradores}
          onFechar={() => setEditando(null)}
          onSalvo={() => { setEditando(null); carregar(); }}
        />
      )}
    </div>
  );
}

const TIPOS_EQUIPAMENTO = [
  { valor: "picador", rotulo: "Picador florestal" },
  { valor: "escavadeira", rotulo: "Escavadeira" },
  { valor: "pa-carregadeira", rotulo: "Pá carregadeira" },
  { valor: "caminhao", rotulo: "Caminhão" },
  { valor: "carro", rotulo: "Carro" },
  { valor: "outro", rotulo: "Outro" },
];

const CONTROLES = [
  { valor: "horimetro", rotulo: "Horímetro (horas)" },
  { valor: "hodometro", rotulo: "Hodômetro (km)" },
  { valor: "prazo", rotulo: "Prazo (meses)" },
];

const rotuloTipo = (t) => TIPOS_EQUIPAMENTO.find(x => x.valor === t)?.rotulo || "Outro";
const unidadeDoControle = (c) => (c === "hodometro" ? "km" : c === "prazo" ? "meses" : "h");

function EquipamentoForm({ equipamento, veiculos, onFechar, onSalvo }) {
  const [dados, setDados] = useState(() => ({
    nome: equipamento?.nome || "",
    tipo: equipamento?.tipo || "picador",
    marca: equipamento?.marca || "",
    modelo: equipamento?.modelo || "",
    ano: equipamento?.ano || "",
    identificacao: equipamento?.identificacao || "",
    controle: equipamento?.controle || "horimetro",
    leituraAtual: equipamento?.leituraAtual ?? "",
    veiculoId: equipamento?.veiculoId ? String(equipamento.veiculoId) : "",
    observacao: equipamento?.observacao || "",
    planos: equipamento?.planos?.map(p => ({
      descricao: p.descricao,
      intervalo: p.intervalo,
      antecedencia: p.antecedencia ?? "",
      ultimaLeitura: p.ultimaLeitura ?? "",
      ultimaData: p.ultimaData ? String(p.ultimaData).slice(0, 10) : "",
    })) || [],
  }));
  const [salvando, setSalvando] = useState(false);
  const [erro, setErro] = useState("");

  const set = (campo, valor) => setDados(d => ({ ...d, [campo]: valor }));
  const porPrazo = dados.controle === "prazo";
  const unidade = unidadeDoControle(dados.controle);

  const salvar = async () => {
    if (!dados.nome) { setErro("Informe o nome do equipamento."); return; }
    setSalvando(true); setErro("");
    try {
      const caminho = equipamento?.id
        ? `/manutencao/equipamentos/${equipamento.id}`
        : "/manutencao/equipamentos";
      await apiRequest(caminho, {
        method: equipamento?.id ? "PUT" : "POST",
        body: JSON.stringify(dados),
      });
      onSalvo();
    } catch (e) {
      setErro([e.message, e.detalhe].filter(Boolean).join(" — "));
    } finally { setSalvando(false); }
  };

  return (
    <div className="modal-backdrop">
      <div className="modal modal-cadastro">
        <div className="modal-header">
          <h3>{equipamento?.id ? "Editar equipamento" : "Novo equipamento"}</h3>
          <button className="icon-btn" onClick={onFechar} aria-label="Fechar"><X size={18} /></button>
        </div>
        <div className="modal-body">
          <section className="pf-secao" style={{ paddingTop: 0 }}>
            <h4 className="pf-secao-titulo">Identificação</h4>
            <div className="nf-grid-4">
              <div className="field-group" style={{ gridColumn: "span 2" }}>
                <label className="field-label">Nome<span className="req">*</span></label>
                <input value={dados.nome} onChange={e => set("nome", e.target.value)}
                  placeholder="Ex.: Picador Lippel PTO 300" />
              </div>
              <div className="field-group">
                <label className="field-label">Tipo</label>
                <select value={dados.tipo} onChange={e => set("tipo", e.target.value)}>
                  {TIPOS_EQUIPAMENTO.map(t => <option key={t.valor} value={t.valor}>{t.rotulo}</option>)}
                </select>
              </div>
              <div className="field-group">
                <label className="field-label">Ano</label>
                <input type="number" value={dados.ano} onChange={e => set("ano", e.target.value)} />
              </div>
            </div>
            <div className="nf-grid-4">
              <div className="field-group">
                <label className="field-label">Marca</label>
                <input value={dados.marca} onChange={e => set("marca", e.target.value)} />
              </div>
              <div className="field-group">
                <label className="field-label">Modelo</label>
                <input value={dados.modelo} onChange={e => set("modelo", e.target.value)} />
              </div>
              <div className="field-group">
                <label className="field-label">Chassi / série</label>
                <input value={dados.identificacao} onChange={e => set("identificacao", e.target.value)} />
              </div>
              <div className="field-group">
                <label className="field-label">Veículo vinculado</label>
                <select value={dados.veiculoId} onChange={e => set("veiculoId", e.target.value)}>
                  <option value="">Nenhum</option>
                  {(veiculos || []).map(v => <option key={v.id} value={v.id}>{v.placa}</option>)}
                </select>
                <p className="hint">Para caminhão e carro já cadastrados.</p>
              </div>
            </div>
          </section>

          <section className="pf-secao">
            <h4 className="pf-secao-titulo">Controle</h4>
            <div className="nf-grid-4">
              <div className="field-group">
                <label className="field-label">Medido por</label>
                <select value={dados.controle} onChange={e => set("controle", e.target.value)}>
                  {CONTROLES.map(c => <option key={c.valor} value={c.valor}>{c.rotulo}</option>)}
                </select>
              </div>
              {!porPrazo && (
                <div className="field-group">
                  <label className="field-label">Leitura atual ({unidade})</label>
                  <input type="number" step="0.1" value={dados.leituraAtual}
                    onChange={e => set("leituraAtual", e.target.value)} />
                </div>
              )}
              <div className="field-group" style={{ gridColumn: "span 2" }}>
                <label className="field-label">Observação</label>
                <input value={dados.observacao} onChange={e => set("observacao", e.target.value)} />
              </div>
            </div>
          </section>

          <section className="pf-secao" style={{ paddingBottom: 0 }}>
            <h4 className="pf-secao-titulo">
              Plano de manutenção
              <span className="subtle" style={{ fontWeight: 400, marginLeft: 8, fontSize: 12.5 }}>
                o que se repete a cada tantas {porPrazo ? "mensalidades" : unidade === "km" ? "quilometragens" : "horas"}
              </span>
            </h4>

            {dados.planos.map((plano, i) => (
              <div key={i} className="nf-grid-4" style={{ alignItems: "end" }}>
                <div className="field-group" style={{ gridColumn: "span 2" }}>
                  <label className="field-label">Serviço</label>
                  <input value={plano.descricao} placeholder="Troca de óleo do motor"
                    onChange={e => setDados(d => ({
                      ...d, planos: d.planos.map((p, j) => (j === i ? { ...p, descricao: e.target.value } : p)),
                    }))} />
                </div>
                <div className="field-group">
                  <label className="field-label">A cada ({unidade})</label>
                  <input type="number" value={plano.intervalo}
                    onChange={e => setDados(d => ({
                      ...d, planos: d.planos.map((p, j) => (j === i ? { ...p, intervalo: e.target.value } : p)),
                    }))} />
                </div>
                <div className="field-group" style={{ display: "flex", gap: 6, alignItems: "flex-end" }}>
                  <div style={{ flex: 1 }}>
                    <label className="field-label">{porPrazo ? "Última vez" : `Última (${unidade})`}</label>
                    {porPrazo ? (
                      <input type="date" value={plano.ultimaData}
                        onChange={e => setDados(d => ({
                          ...d, planos: d.planos.map((p, j) => (j === i ? { ...p, ultimaData: e.target.value } : p)),
                        }))} />
                    ) : (
                      <input type="number" step="0.1" value={plano.ultimaLeitura}
                        onChange={e => setDados(d => ({
                          ...d, planos: d.planos.map((p, j) => (j === i ? { ...p, ultimaLeitura: e.target.value } : p)),
                        }))} />
                    )}
                  </div>
                  <button type="button" className="icon-btn icon-btn-danger" title="Remover"
                    onClick={() => setDados(d => ({ ...d, planos: d.planos.filter((_, j) => j !== i) }))}>
                    <Trash2 size={14} />
                  </button>
                </div>
              </div>
            ))}

            <button type="button" className="btn" style={{ marginTop: 6 }}
              onClick={() => setDados(d => ({
                ...d, planos: [...d.planos, { descricao: "", intervalo: "", antecedencia: "", ultimaLeitura: "", ultimaData: "" }],
              }))}>
              <Plus size={14} /> Adicionar serviço
            </button>
          </section>

          {erro && <p className="error-text">{erro}</p>}
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onFechar} disabled={salvando}>Cancelar</button>
          <button className="btn btn-primary" onClick={salvar} disabled={salvando}>
            {salvando ? "Salvando…" : "Salvar"}
          </button>
        </div>
      </div>
    </div>
  );
}

// Registro do serviço feito. Ao vincular um plano, a data e a leitura
// reposicionam o próximo vencimento — é o que mantém o aviso honesto.
function OrdemManutencaoForm({ ordem, equipamentos, colaboradores, onFechar, onSalvo }) {
  const hoje = new Date().toISOString().slice(0, 10);
  const [dados, setDados] = useState(() => ({
    equipamentoId: ordem?.equipamentoId ? String(ordem.equipamentoId) : "",
    data: ordem?.data ? String(ordem.data).slice(0, 10) : hoje,
    tipo: ordem?.tipo || "preventiva",
    descricao: ordem?.descricao || "",
    planoId: ordem?.planoId ? String(ordem.planoId) : "",
    leitura: ordem?.leitura ?? "",
    oficina: ordem?.oficina || "",
    custoPecas: ordem?.custoPecas ?? "",
    custoServico: ordem?.custoServico ?? "",
    pecas: ordem?.pecas || "",
    responsavelId: ordem?.responsavelId ? String(ordem.responsavelId) : "",
    observacao: ordem?.observacao || "",
  }));
  const [salvando, setSalvando] = useState(false);
  const [erro, setErro] = useState("");

  const set = (campo, valor) => setDados(d => ({ ...d, [campo]: valor }));
  const equipamento = equipamentos.find(e => String(e.id) === String(dados.equipamentoId));
  const porPrazo = equipamento?.controle === "prazo";
  const unidade = unidadeDoControle(equipamento?.controle);

  const salvar = async () => {
    if (!dados.equipamentoId || !dados.descricao) {
      setErro("Informe o equipamento e a descrição do serviço.");
      return;
    }
    setSalvando(true); setErro("");
    try {
      await apiRequest(ordem?.id ? `/manutencao/ordens/${ordem.id}` : "/manutencao/ordens", {
        method: ordem?.id ? "PUT" : "POST",
        body: JSON.stringify(dados),
      });
      onSalvo();
    } catch (e) {
      setErro([e.message, e.detalhe].filter(Boolean).join(" — "));
    } finally { setSalvando(false); }
  };

  const total = (Number(dados.custoPecas) || 0) + (Number(dados.custoServico) || 0);

  return (
    <div className="modal-backdrop">
      <div className="modal modal-cadastro">
        <div className="modal-header">
          <h3>{ordem?.id ? "Editar manutenção" : "Registrar manutenção"}</h3>
          <button className="icon-btn" onClick={onFechar} aria-label="Fechar"><X size={18} /></button>
        </div>
        <div className="modal-body">
          <section className="pf-secao" style={{ paddingTop: 0 }}>
            <h4 className="pf-secao-titulo">O serviço</h4>
            <div className="nf-grid-4">
              <div className="field-group" style={{ gridColumn: "span 2" }}>
                <label className="field-label">Equipamento<span className="req">*</span></label>
                <select value={dados.equipamentoId} onChange={e => { set("equipamentoId", e.target.value); set("planoId", ""); }}>
                  <option value="">Selecione…</option>
                  {equipamentos.map(e => <option key={e.id} value={e.id}>{e.nome}</option>)}
                </select>
              </div>
              <div className="field-group">
                <label className="field-label">Data</label>
                <input type="date" value={dados.data} onChange={e => set("data", e.target.value)} />
              </div>
              <div className="field-group">
                <label className="field-label">Tipo</label>
                <select value={dados.tipo} onChange={e => set("tipo", e.target.value)}>
                  <option value="preventiva">Preventiva</option>
                  <option value="corretiva">Corretiva (quebrou)</option>
                </select>
              </div>
            </div>
            <div className="nf-grid-4">
              <div className="field-group" style={{ gridColumn: "span 2" }}>
                <label className="field-label">O que foi feito<span className="req">*</span></label>
                <input value={dados.descricao} onChange={e => set("descricao", e.target.value)}
                  placeholder="Troca de óleo e filtros" />
              </div>
              <div className="field-group">
                <label className="field-label">Serviço do plano</label>
                <select value={dados.planoId} onChange={e => set("planoId", e.target.value)}
                  disabled={!equipamento?.planos?.length}>
                  <option value="">Fora do plano</option>
                  {(equipamento?.planos || []).map(p => <option key={p.id} value={p.id}>{p.descricao}</option>)}
                </select>
                <p className="hint">Vinculando, a próxima é recalculada.</p>
              </div>
              {!porPrazo && (
                <div className="field-group">
                  <label className="field-label">Leitura ({unidade})</label>
                  <input type="number" step="0.1" value={dados.leitura}
                    onChange={e => set("leitura", e.target.value)}
                    placeholder={equipamento?.leituraAtual != null ? String(equipamento.leituraAtual) : ""} />
                </div>
              )}
            </div>
          </section>

          <section className="pf-secao">
            <h4 className="pf-secao-titulo">
              Custo
              {total > 0 && (
                <span className="subtle" style={{ fontWeight: 400, marginLeft: 8, fontSize: 12.5 }}>
                  total R$ {formatarMoeda(total)}
                </span>
              )}
            </h4>
            <div className="nf-grid-4">
              <div className="field-group">
                <label className="field-label">Peças</label>
                <InputMoeda value={dados.custoPecas} onChange={v => set("custoPecas", v)} />
              </div>
              <div className="field-group">
                <label className="field-label">Mão de obra</label>
                <InputMoeda value={dados.custoServico} onChange={v => set("custoServico", v)} />
              </div>
              <div className="field-group">
                <label className="field-label">Oficina</label>
                <input value={dados.oficina} onChange={e => set("oficina", e.target.value)} />
              </div>
              <div className="field-group">
                <label className="field-label">Responsável</label>
                <select value={dados.responsavelId} onChange={e => set("responsavelId", e.target.value)}>
                  <option value="">Nenhum</option>
                  {(colaboradores || []).map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
                </select>
              </div>
            </div>
          </section>

          <section className="pf-secao" style={{ paddingBottom: 0 }}>
            <h4 className="pf-secao-titulo">Peças e observação</h4>
            <div className="field-group">
              <label className="field-label">Peças e óleo usados</label>
              <textarea rows={2} value={dados.pecas} onChange={e => set("pecas", e.target.value)}
                placeholder="4 filtros de óleo, 20L óleo 15W40, 2 correias"
                style={{ width: "100%", resize: "vertical", fontFamily: "inherit", fontSize: 14 }} />
            </div>
            <div className="field-group">
              <label className="field-label">Observação</label>
              <input value={dados.observacao} onChange={e => set("observacao", e.target.value)} />
            </div>
          </section>

          {erro && <p className="error-text">{erro}</p>}
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onFechar} disabled={salvando}>Cancelar</button>
          <button className="btn btn-primary" onClick={salvar} disabled={salvando}>
            {salvando ? "Salvando…" : "Salvar"}
          </button>
        </div>
      </div>
    </div>
  );
}

function ManutencaoView() {
  const { items: veiculos } = useApiCollection("veiculos");
  const { items: colaboradores } = useApiCollection("colaboradores");

  const [aba, setAba] = useState("equipamentos");
  const [dados, setDados] = useState(null);
  const [historico, setHistorico] = useState(null);
  const [erro, setErro] = useState("");

  const [equipamentoEmEdicao, setEquipamentoEmEdicao] = useState(null);
  const [ordemEmEdicao, setOrdemEmEdicao] = useState(null);
  const [leituraDe, setLeituraDe] = useState(null);

  const carregar = useCallback(async () => {
    setErro("");
    try {
      const [equipamentos, ordens] = await Promise.all([
        apiRequest("/manutencao/equipamentos"),
        apiRequest("/manutencao/ordens"),
      ]);
      setDados(equipamentos);
      setHistorico(ordens);
    } catch (e) {
      setErro([e.message, e.detalhe].filter(Boolean).join(" — "));
    }
  }, []);

  useEffect(() => { carregar(); }, [carregar]);

  const excluirEquipamento = async (equipamento) => {
    if (!window.confirm(`Desativar "${equipamento.nome}"? O histórico continua guardado.`)) return;
    try {
      await apiRequest(`/manutencao/equipamentos/${equipamento.id}`, { method: "DELETE" });
      carregar();
    } catch (e) { alert(e.message); }
  };

  const excluirOrdem = async (ordem) => {
    if (!window.confirm("Excluir esse registro de manutenção?")) return;
    try {
      await apiRequest(`/manutencao/ordens/${ordem.id}`, { method: "DELETE" });
      carregar();
    } catch (e) { alert(e.message); }
  };

  const T = dados?.totais;
  const dataBr = (iso) => new Date(String(iso).slice(0, 10) + "T12:00:00Z").toLocaleDateString("pt-BR");

  // Frase curta do que falta, para caber na linha da tabela.
  const textoSituacao = (plano) => {
    const s = plano.situacao;
    if (s.semLeitura) return "sem leitura";
    if (s.vencida) {
      return s.tipo === "prazo"
        ? `vencida há ${Math.abs(s.falta)}d`
        : `vencida há ${formatarQuantidade(Math.abs(s.falta))} ${s.unidade}`;
    }
    return s.tipo === "prazo"
      ? `em ${s.falta}d`
      : `faltam ${formatarQuantidade(s.falta)} ${s.unidade}`;
  };

  const corSituacao = (plano) =>
    plano.situacao.semLeitura ? "#8a887f"
      : plano.situacao.vencida ? "#c62828"
      : plano.situacao.proximo ? "#b57a12" : "#6b6b68";

  return (
    <div>
      <div className="view-header">
        <div className="view-title">
          <div className="icon-badge" style={{ background: "#eef3fb", color: "#1F3B57" }}>
            <Car size={20} />
          </div>
          <div>
            <h2>Manutenção</h2>
            <p className="subtle">
              {T ? `${T.equipamentos} equipamento${T.equipamentos !== 1 ? "s" : ""}` : "—"}
              {T?.vencidas > 0 && <span style={{ color: "#c62828" }}>{` · ${T.vencidas} com manutenção vencida`}</span>}
            </p>
          </div>
        </div>
        <div style={{ display: "flex", gap: 8 }}>
          <button className="btn" style={{ padding: "6px 12px", fontSize: 13 }}
            onClick={() => setEquipamentoEmEdicao({})}>
            <Plus size={14} /> Equipamento
          </button>
          <button className="btn btn-primary" onClick={() => setOrdemEmEdicao({})}>
            <Plus size={16} /> Registrar manutenção
          </button>
        </div>
      </div>

      {T && (T.vencidas > 0 || T.proximas > 0) && (
        <div className="cte-resumo" style={{ marginBottom: 14 }}>
          <div>
            <span className="cte-resumo-rotulo">Vencidas</span>
            <span className="cte-resumo-valor" style={{ color: T.vencidas ? "#c62828" : undefined }}>{T.vencidas}</span>
          </div>
          <div>
            <span className="cte-resumo-rotulo">Chegando</span>
            <span className="cte-resumo-valor" style={{ color: T.proximas ? "#b57a12" : undefined }}>{T.proximas}</span>
          </div>
          {historico?.totais && (
            <div>
              <span className="cte-resumo-rotulo">Custo registrado</span>
              <span className="cte-resumo-valor">R$ {formatarMoeda(historico.totais.custoTotal)}</span>
            </div>
          )}
        </div>
      )}

      <div className="cte-abas" style={{ marginBottom: 12 }}>
        <button className="cte-aba" aria-selected={aba === "equipamentos"} onClick={() => setAba("equipamentos")}>
          Equipamentos
        </button>
        <button className="cte-aba" aria-selected={aba === "historico"} onClick={() => setAba("historico")}>
          Histórico
        </button>
      </div>

      {erro && <p className="error-text">{erro}</p>}

      {aba === "equipamentos" && dados && (
        <table className="data-table tabela-densa">
          <thead>
            <tr>
              <th>Equipamento</th>
              <th style={{ width: 130 }}>Tipo</th>
              <th style={{ width: 120 }}>Leitura</th>
              <th>Próximas manutenções</th>
              <th className="actions-col"></th>
            </tr>
          </thead>
          <tbody>
            {dados.equipamentos.map(eq => (
              <tr key={eq.id}>
                <td>
                  {eq.nome}
                  {eq.veiculo?.placa && <span className="subtle"> · {eq.veiculo.placa}</span>}
                </td>
                <td className="subtle">{rotuloTipo(eq.tipo)}</td>
                <td>
                  {eq.controle === "prazo" ? (
                    <span className="subtle">por prazo</span>
                  ) : (
                    <button className="link-btn" onClick={() => setLeituraDe(eq)}>
                      {eq.leituraAtual != null
                        ? `${formatarQuantidade(eq.leituraAtual)} ${unidadeDoControle(eq.controle)}`
                        : "informar"}
                    </button>
                  )}
                </td>
                <td>
                  {eq.planos.length === 0 && <span className="subtle">sem plano</span>}
                  {eq.planos.map(p => (
                    <div key={p.id} style={{ fontSize: 12.5, whiteSpace: "nowrap" }}>
                      {p.descricao}
                      {" · "}
                      <span style={{ color: corSituacao(p), fontWeight: p.situacao.vencida ? 600 : 400 }}>
                        {textoSituacao(p)}
                      </span>
                    </div>
                  ))}
                </td>
                <td className="actions-col" style={{ whiteSpace: "nowrap" }}>
                  <button className="icon-btn" title="Registrar manutenção"
                    onClick={() => setOrdemEmEdicao({ equipamentoId: eq.id })}>
                    <Plus size={14} />
                  </button>
                  <button className="icon-btn" title="Editar" onClick={() => setEquipamentoEmEdicao(eq)}>
                    <Pencil size={14} />
                  </button>
                  <button className="icon-btn icon-btn-danger" title="Desativar" onClick={() => excluirEquipamento(eq)}>
                    <Trash2 size={14} />
                  </button>
                </td>
              </tr>
            ))}
            {!dados.equipamentos.length && (
              <tr><td colSpan={5}>Nenhum equipamento cadastrado ainda.</td></tr>
            )}
          </tbody>
        </table>
      )}

      {aba === "historico" && historico && (
        <table className="data-table tabela-densa">
          <thead>
            <tr>
              <th style={{ width: 90 }}>Data</th>
              <th>Equipamento</th>
              <th>Serviço</th>
              <th style={{ width: 95 }}>Tipo</th>
              <th style={{ width: 100 }}>Leitura</th>
              <th style={{ width: 110, textAlign: "right" }}>Custo</th>
              <th className="actions-col"></th>
            </tr>
          </thead>
          <tbody>
            {historico.ordens.map(o => (
              <tr key={o.id}>
                <td>{dataBr(o.data)}</td>
                <td>{o.equipamento?.nome}</td>
                <td>
                  {o.descricao}
                  {o.oficina && <span className="subtle"> · {o.oficina}</span>}
                </td>
                <td style={{ color: o.tipo === "corretiva" ? "#c62828" : undefined }}>
                  {o.tipo === "corretiva" ? "corretiva" : "preventiva"}
                </td>
                <td className="subtle">
                  {o.leitura != null ? `${formatarQuantidade(o.leitura)} ${unidadeDoControle(o.equipamento?.controle)}` : "—"}
                </td>
                <td style={{ textAlign: "right" }}>
                  R$ {formatarMoeda((Number(o.custoPecas) || 0) + (Number(o.custoServico) || 0))}
                </td>
                <td className="actions-col" style={{ whiteSpace: "nowrap" }}>
                  <button className="icon-btn" title="Editar" onClick={() => setOrdemEmEdicao(o)}><Pencil size={14} /></button>
                  <button className="icon-btn icon-btn-danger" title="Excluir" onClick={() => excluirOrdem(o)}><Trash2 size={14} /></button>
                </td>
              </tr>
            ))}
            {!historico.ordens.length && (
              <tr><td colSpan={7}>Nenhuma manutenção registrada ainda.</td></tr>
            )}
          </tbody>
        </table>
      )}

      {equipamentoEmEdicao && (
        <EquipamentoForm
          equipamento={equipamentoEmEdicao.id ? equipamentoEmEdicao : null}
          veiculos={veiculos}
          onFechar={() => setEquipamentoEmEdicao(null)}
          onSalvo={() => { setEquipamentoEmEdicao(null); carregar(); }}
        />
      )}

      {ordemEmEdicao && (
        <OrdemManutencaoForm
          ordem={ordemEmEdicao.id ? ordemEmEdicao : (ordemEmEdicao.equipamentoId ? ordemEmEdicao : null)}
          equipamentos={dados?.equipamentos || []}
          colaboradores={colaboradores}
          onFechar={() => setOrdemEmEdicao(null)}
          onSalvo={() => { setOrdemEmEdicao(null); carregar(); }}
        />
      )}

      {leituraDe && (
        <LeituraModal
          equipamento={leituraDe}
          onFechar={() => setLeituraDe(null)}
          onSalvo={() => { setLeituraDe(null); carregar(); }}
        />
      )}
    </div>
  );
}

// Atualizar a leitura é rápido e acontece todo dia — merece uma janela
// pequena em vez de abrir o cadastro inteiro.
function LeituraModal({ equipamento, onFechar, onSalvo }) {
  const [leitura, setLeitura] = useState(equipamento.leituraAtual ?? "");
  const [salvando, setSalvando] = useState(false);
  const [erro, setErro] = useState("");
  const unidade = unidadeDoControle(equipamento.controle);

  const salvar = async () => {
    setSalvando(true); setErro("");
    try {
      await apiRequest(`/manutencao/equipamentos/${equipamento.id}/leitura`, {
        method: "POST",
        body: JSON.stringify({ leitura }),
      });
      onSalvo();
    } catch (e) {
      setErro([e.message, e.detalhe].filter(Boolean).join(" — "));
    } finally { setSalvando(false); }
  };

  return (
    <div className="modal-backdrop">
      <div className="modal" style={{ maxWidth: 420 }}>
        <div className="modal-header">
          <h3>{equipamento.nome}</h3>
          <button className="icon-btn" onClick={onFechar} aria-label="Fechar"><X size={18} /></button>
        </div>
        <div className="modal-body">
          <div className="field-group">
            <label className="field-label">Leitura atual ({unidade})</label>
            <input type="number" step="0.1" value={leitura} autoFocus
              onChange={e => setLeitura(e.target.value)}
              onKeyDown={e => e.key === "Enter" && salvar()} />
            {equipamento.leituraAtualizada && (
              <p className="hint">
                Última atualização em {new Date(equipamento.leituraAtualizada).toLocaleDateString("pt-BR")}.
              </p>
            )}
          </div>
          {erro && <p className="error-text">{erro}</p>}
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onFechar} disabled={salvando}>Cancelar</button>
          <button className="btn btn-primary" onClick={salvar} disabled={salvando}>
            {salvando ? "Salvando…" : "Salvar"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ---------- Contas a pagar ----------

// Lançamento. O parcelamento e a repetição mensal são resolvidos aqui: o
// servidor cria um registro por parcela ou por mês.
function ContaPagarForm({ conta, fornecedores, categorias, centros, onFechar, onSalvo }) {
  const hoje = new Date().toISOString().slice(0, 10);
  const [dados, setDados] = useState(() => ({
    descricao: conta?.descricao || "",
    valor: conta?.valor ?? "",
    vencimento: conta?.vencimento ? String(conta.vencimento).slice(0, 10) : hoje,
    fornecedorId: conta?.fornecedorId ? String(conta.fornecedorId) : "",
    categoriaId: conta?.categoriaId ? String(conta.categoriaId) : "",
    centroCustoId: conta?.centroCustoId ? String(conta.centroCustoId) : "",
    documento: conta?.documento || "",
    observacao: conta?.observacao || "",
    repeticao: "unica",
    quantidade: 2,
    dataPagamento: conta?.dataPagamento ? String(conta.dataPagamento).slice(0, 10) : "",
    valorPago: conta?.valorPago ?? "",
    jurosMulta: conta?.jurosMulta ?? "",
    desconto: conta?.desconto ?? "",
  }));
  const [salvando, setSalvando] = useState(false);
  const [erro, setErro] = useState("");

  const set = (campo, valor) => setDados(d => ({ ...d, [campo]: valor }));
  const editando = Boolean(conta?.id);

  const salvar = async () => {
    if (!dados.descricao || !dados.valor || !dados.vencimento) {
      setErro("Preencha descrição, valor e vencimento.");
      return;
    }
    setSalvando(true); setErro("");
    try {
      if (editando) {
        await apiRequest(`/contas-pagar/${conta.id}`, { method: "PUT", body: JSON.stringify(dados) });
      } else {
        await apiRequest("/contas-pagar", { method: "POST", body: JSON.stringify(dados) });
      }
      onSalvo();
    } catch (e) {
      setErro([e.message, e.detalhe].filter(Boolean).join(" — "));
    } finally { setSalvando(false); }
  };

  const vezes = Number(dados.quantidade) || 1;
  const valorNumero = Number(dados.valor) || 0;

  return (
    <div className="modal-backdrop">
      {/* Mesmo tamanho dos demais cadastros: 940px e 60% da altura. */}
      <div className="modal modal-cadastro">
        <div className="modal-header">
          <h3>{editando ? "Editar conta" : "Nova conta a pagar"}</h3>
          <button className="icon-btn" onClick={onFechar} aria-label="Fechar"><X size={18} /></button>
        </div>
        <div className="modal-body">
          <section className="pf-secao" style={{ paddingTop: 0 }}>
            <h4 className="pf-secao-titulo">O que é a despesa</h4>
            <div className="nf-grid-4">
              {/* Fornecedor na frente: é por ele que se procura a conta, e
                  costuma ser o primeiro dado que se tem em mãos. */}
              <div className="field-group" style={{ gridColumn: "span 3" }}>
                <label className="field-label">Fornecedor</label>
                <select value={dados.fornecedorId} onChange={e => set("fornecedorId", e.target.value)}>
                  <option value="">Nenhum</option>
                  {(fornecedores || []).map(f => <option key={f.id} value={f.id}>{rotuloPessoa(f)}</option>)}
                </select>
              </div>
              <div className="field-group">
                <label className="field-label">Documento</label>
                <input value={dados.documento} onChange={e => set("documento", e.target.value)}
                  placeholder="Boleto, nota, recibo" />
              </div>
            </div>
            <div className="nf-grid-4">
              <div className="field-group" style={{ gridColumn: "span 2" }}>
                <label className="field-label">Descrição<span className="req">*</span></label>
                <input value={dados.descricao} onChange={e => set("descricao", e.target.value)}
                  placeholder="Ex.: Diesel S10 — abastecimento da frota" />
              </div>
              <div className="field-group">
                <label className="field-label">Categoria</label>
                <select value={dados.categoriaId} onChange={e => set("categoriaId", e.target.value)}>
                  <option value="">Sem categoria</option>
                  {categorias.map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
                </select>
              </div>
              <div className="field-group">
                <label className="field-label">Centro de custo</label>
                <select value={dados.centroCustoId} onChange={e => set("centroCustoId", e.target.value)}>
                  <option value="">Sem centro de custo</option>
                  {centros.map(c => (
                    <option key={c.id} value={c.id}>{c.nome}{c.veiculo?.placa ? ` (${c.veiculo.placa})` : ""}</option>
                  ))}
                </select>
              </div>
            </div>
          </section>

          <section className="pf-secao">
            <h4 className="pf-secao-titulo">Valor e vencimento</h4>
            <div className="nf-grid-4">
              <div className="field-group">
                <label className="field-label">Valor<span className="req">*</span></label>
                <InputMoeda value={dados.valor} onChange={v => set("valor", v)} />
              </div>
              <div className="field-group">
                <label className="field-label">Vencimento<span className="req">*</span></label>
                <input type="date" value={dados.vencimento} onChange={e => set("vencimento", e.target.value)} />
              </div>
              {!editando && (
                <>
                  <div className="field-group">
                    <label className="field-label">Repetição</label>
                    <select value={dados.repeticao} onChange={e => set("repeticao", e.target.value)}>
                      <option value="unica">Conta única</option>
                      <option value="parcelado">Parcelado</option>
                      <option value="mensal">Mensal</option>
                    </select>
                  </div>
                  <div className="field-group">
                    <label className="field-label">
                      {dados.repeticao === "parcelado" ? "Parcelas" : dados.repeticao === "mensal" ? "Meses" : "\u00a0"}
                    </label>
                    <input type="number" min="2" max="60" value={dados.quantidade}
                      disabled={dados.repeticao === "unica"}
                      onChange={e => set("quantidade", e.target.value)} />
                  </div>
                </>
              )}
            </div>

            {/* Prévia do que será lançado: com parcelamento, uma conta vira
                várias, e é melhor ver isso antes de salvar. */}
            {!editando && dados.repeticao !== "unica" && vezes > 1 && valorNumero > 0 && (
              <div style={{
                background: "#f4f7f2", border: "1px solid #dde6d6", borderRadius: 9,
                padding: "10px 14px", fontSize: 13, marginTop: 4,
              }}>
                <strong>{vezes} contas serão criadas.</strong>{" "}
                {dados.repeticao === "parcelado"
                  ? `Parcelas de R$ ${formatarMoeda(valorNumero / vezes)}, somando R$ ${formatarMoeda(valorNumero)}. A diferença de centavos vai na primeira.`
                  : `Uma por mês, de R$ ${formatarMoeda(valorNumero)} cada, totalizando R$ ${formatarMoeda(valorNumero * vezes)}.`}
                <br />
                <span className="subtle">
                  Primeiro vencimento em {dados.vencimento ? new Date(`${dados.vencimento}T12:00:00Z`).toLocaleDateString("pt-BR") : "—"},
                  último em {dados.vencimento ? (() => {
                    const d = new Date(`${dados.vencimento}T12:00:00Z`);
                    const dia = d.getUTCDate();
                    d.setUTCDate(1);
                    d.setUTCMonth(d.getUTCMonth() + (vezes - 1));
                    const ultimoDia = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0)).getUTCDate();
                    d.setUTCDate(Math.min(dia, ultimoDia));
                    return d.toLocaleDateString("pt-BR");
                  })() : "—"}.
                </span>
              </div>
            )}
          </section>

          <section className="pf-secao">
            <h4 className="pf-secao-titulo">
              Pagamento
              <span className="subtle" style={{ fontWeight: 400, marginLeft: 8, fontSize: 12.5 }}>
                preencha só se a conta já foi paga
              </span>
            </h4>
            <div className="nf-grid-4">
              <div className="field-group">
                <label className="field-label">Data do pagamento</label>
                <input type="date" value={dados.dataPagamento}
                  onChange={e => set("dataPagamento", e.target.value)} />
              </div>
              <div className="field-group">
                <label className="field-label">Valor pago</label>
                <InputMoeda value={dados.valorPago} onChange={v => set("valorPago", v)} />
              </div>
              <div className="field-group">
                <label className="field-label">Juros / multa</label>
                <InputMoeda value={dados.jurosMulta} onChange={v => set("jurosMulta", v)} />
              </div>
              <div className="field-group">
                <label className="field-label">Desconto</label>
                <InputMoeda value={dados.desconto} onChange={v => set("desconto", v)} />
              </div>
            </div>
            {dados.dataPagamento && (
              <p className="hint">
                A conta será gravada como paga
                {vezes > 1 && dados.repeticao !== "unica" ? " — só a primeira parcela; as demais ficam em aberto." : "."}
              </p>
            )}
          </section>

          <section className="pf-secao" style={{ paddingBottom: 0 }}>
            <h4 className="pf-secao-titulo">Observação</h4>
            <textarea
              rows={2}
              value={dados.observacao}
              onChange={e => set("observacao", e.target.value)}
              placeholder="Detalhe que ajude a reconhecer a conta depois"
              style={{ width: "100%", resize: "vertical", fontFamily: "inherit", fontSize: 14 }}
            />
          </section>

          {erro && <p className="error-text">{erro}</p>}
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onFechar} disabled={salvando}>Cancelar</button>
          <button className="btn btn-primary" onClick={salvar} disabled={salvando}>
            {salvando ? "Salvando…" : "Salvar"}
          </button>
        </div>
      </div>
    </div>
  );
}

// Baixa do pagamento. Valor pago separado do valor da conta porque juros e
// desconto são a regra, não a exceção.
function BaixaContaModal({ conta, onFechar, onSalvo }) {
  const hoje = new Date().toISOString().slice(0, 10);
  const [dados, setDados] = useState({
    dataPagamento: hoje,
    valorPago: conta.valor,
    jurosMulta: "",
    desconto: "",
    formaPagamento: "",
  });
  const [salvando, setSalvando] = useState(false);
  const [erro, setErro] = useState("");

  const set = (campo, valor) => setDados(d => ({ ...d, [campo]: valor }));

  const salvar = async () => {
    setSalvando(true); setErro("");
    try {
      await apiRequest(`/contas-pagar/${conta.id}/pagar`, { method: "POST", body: JSON.stringify(dados) });
      onSalvo();
    } catch (e) {
      setErro([e.message, e.detalhe].filter(Boolean).join(" — "));
    } finally { setSalvando(false); }
  };

  return (
    <div className="modal-backdrop">
      <div className="modal" style={{ maxWidth: 560 }}>
        <div className="modal-header">
          <h3>Dar baixa</h3>
          <button className="icon-btn" onClick={onFechar} aria-label="Fechar"><X size={18} /></button>
        </div>
        <div className="modal-body">
          <p className="hint" style={{ marginTop: 0 }}>
            {conta.descricao} · vencimento {new Date(String(conta.vencimento).slice(0, 10) + "T12:00:00Z").toLocaleDateString("pt-BR")}
            {" "}· R$ {formatarMoeda(conta.valor)}
          </p>
          <div className="nf-grid-3">
            <div className="field-group">
              <label className="field-label">Data do pagamento</label>
              <input type="date" value={dados.dataPagamento} onChange={e => set("dataPagamento", e.target.value)} />
            </div>
            <div className="field-group">
              <label className="field-label">Valor pago</label>
              <InputMoeda value={dados.valorPago} onChange={v => set("valorPago", v)} />
            </div>
            <div className="field-group">
              <label className="field-label">Forma</label>
              <select value={dados.formaPagamento} onChange={e => set("formaPagamento", e.target.value)}>
                <option value="">Não informar</option>
                <option value="PIX">PIX</option>
                <option value="Boleto">Boleto</option>
                <option value="Transferência">Transferência</option>
                <option value="Dinheiro">Dinheiro</option>
                <option value="Cartão">Cartão</option>
              </select>
            </div>
          </div>
          <div className="nf-grid-3">
            <div className="field-group">
              <label className="field-label">Juros / multa</label>
              <InputMoeda value={dados.jurosMulta} onChange={v => set("jurosMulta", v)} />
            </div>
            <div className="field-group">
              <label className="field-label">Desconto</label>
              <InputMoeda value={dados.desconto} onChange={v => set("desconto", v)} />
            </div>
          </div>
          {erro && <p className="error-text">{erro}</p>}
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onFechar} disabled={salvando}>Cancelar</button>
          <button className="btn btn-primary" onClick={salvar} disabled={salvando}>
            {salvando ? "Salvando…" : "Confirmar pagamento"}
          </button>
        </div>
      </div>
    </div>
  );
}

// Categorias e centros de custo ficam aqui, e não no menu de cadastros:
// são listas curtas que só existem para classificar despesa.
function CategoriasECentrosModal({ categorias, centros, onFechar, onMudou }) {
  const { items: veiculos } = useApiCollection("veiculos");
  const [novaCategoria, setNovaCategoria] = useState("");
  const [novoCentro, setNovoCentro] = useState({ nome: "", veiculoId: "" });
  const [erro, setErro] = useState("");

  const criarCategoria = async () => {
    if (!novaCategoria.trim()) return;
    try {
      await apiRequest("/contas-pagar/categorias", { method: "POST", body: JSON.stringify({ nome: novaCategoria.trim() }) });
      setNovaCategoria(""); onMudou();
    } catch (e) { setErro(e.message); }
  };

  const criarCentro = async () => {
    if (!novoCentro.nome.trim()) return;
    try {
      await apiRequest("/contas-pagar/centros-custo", { method: "POST", body: JSON.stringify(novoCentro) });
      setNovoCentro({ nome: "", veiculoId: "" }); onMudou();
    } catch (e) { setErro(e.message); }
  };

  const remover = async (caminho, id) => {
    if (!window.confirm("Desativar esse registro? Ele some das listas, mas as contas já classificadas continuam como estão.")) return;
    try {
      await apiRequest(`/contas-pagar/${caminho}/${id}`, { method: "DELETE" });
      onMudou();
    } catch (e) { setErro(e.message); }
  };

  return (
    <div className="modal-backdrop">
      <div className="modal" style={{ maxWidth: 720 }}>
        <div className="modal-header">
          <h3>Categorias e centros de custo</h3>
          <button className="icon-btn" onClick={onFechar} aria-label="Fechar"><X size={18} /></button>

        <div className="modal-body">

            <h4 className="pf-secao-titulo">Categorias de despesa</h4>
            <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
              <input value={novaCategoria} placeholder="Combustível, manutenção, folha…"
                onChange={e => setNovaCategoria(e.target.value)}
                onKeyDown={e => e.key === "Enter" && criarCategoria()} style={{ flex: 1 }} />
              <button className="btn" onClick={criarCategoria}>Adicionar</button>
            </div>
            <table className="data-table tabela-densa">
              <tbody>
                {categorias.map(c => (
                  <tr key={c.id}>
                    <td>{c.nome}</td>
                    <td className="actions-col">
                      <button className="icon-btn icon-btn-danger" onClick={() => remover("categorias", c.id)}>
                        <Trash2 size={14} />
                      </button>
                    </td>
                  </tr>
                ))}
                {!categorias.length && <tr><td>Nenhuma categoria ainda.</td></tr>}
              </tbody>
            </table>
          </section>

          <section className="pf-secao">
            <h4 className="pf-secao-titulo">Centros de custo</h4>
            <div style={{ display: "flex", gap: 8, marginBottom: 10 }}>
              <input value={novoCentro.nome} placeholder="Operação Usimat, Frota, Administrativo…"
                onChange={e => setNovoCentro(c => ({ ...c, nome: e.target.value }))} style={{ flex: 1 }} />
              <select value={novoCentro.veiculoId} onChange={e => setNovoCentro(c => ({ ...c, veiculoId: e.target.value }))}>
                <option value="">Sem veículo</option>
                {(veiculos || []).map(v => <option key={v.id} value={v.id}>{v.placa}</option>)}
              </select>
              <button className="btn" onClick={criarCentro}>Adicionar</button>
            </div>
            <table className="data-table tabela-densa">
              <tbody>
                {centros.map(c => (
                  <tr key={c.id}>
                    <td>{c.nome}</td>
                    <td>{c.veiculo?.placa || "—"}</td>
                    <td className="actions-col">
                      <button className="icon-btn icon-btn-danger" onClick={() => remover("centros-custo", c.id)}>
                        <Trash2 size={14} />
                      </button>
                    </td>
                  </tr>
                ))}
                {!centros.length && <tr><td>Nenhum centro de custo ainda.</td></tr>}
              </tbody>
            </table>
          </section>

          {erro && <p className="error-text">{erro}</p>}
