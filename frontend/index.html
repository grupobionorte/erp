// ---------- MDFe ----------
// O manifesto é quase todo derivável do CT-e: trajeto, veículo, motorista e
// carga já estão lá. Por isso o caminho principal aqui é "gerar a partir de
// CT-e autorizado" em vez de digitar tudo de novo.

const TIPOS_CARGA_MDFE = [
  { codigo: "01", label: "01 — Granel sólido" },
  { codigo: "02", label: "02 — Granel líquido" },
  { codigo: "03", label: "03 — Frigorificada" },
  { codigo: "04", label: "04 — Conteinerizada" },
  { codigo: "05", label: "05 — Carga geral" },
  { codigo: "06", label: "06 — Neogranel" },
  { codigo: "07", label: "07 — Perigosa (granel sólido)" },
  { codigo: "08", label: "08 — Perigosa (granel líquido)" },
  { codigo: "09", label: "09 — Perigosa (frigorificada)" },
  { codigo: "10", label: "10 — Perigosa (conteinerizada)" },
  { codigo: "11", label: "11 — Perigosa (carga geral)" },
  { codigo: "12", label: "12 — Granel pressurizada" },
];

function GerarMdfeModal({ ctePreSelecionado, onGerar, onCancel }) {
  const [ctes, setCtes] = useState(ctePreSelecionado ? [ctePreSelecionado] : null);
  const [selecionados, setSelecionados] = useState(ctePreSelecionado ? [ctePreSelecionado.id] : []);
  const [tipoCarga, setTipoCarga] = useState("01");
  const [seguro, setSeguro] = useState({ responsavel: "1", nomeSeguradora: "", cnpjSeguradora: "", numeroApolice: "", numeroAverbacao: "" });
  const [erro, setErro] = useState("");
  const [gerando, setGerando] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        // Seguro muda pouco entre viagens: reaproveita o do último
        // manifesto pra não obrigar a redigitar apólice toda vez.
        const manifestos = await apiRequest("/documentos-fiscais?tipo=MDFe");
        const ultimo = manifestos.find(m => m.seguroNomeSeguradora);
        if (ultimo) {
          setSeguro({
            responsavel: ultimo.seguroResponsavel || "1",
            nomeSeguradora: ultimo.seguroNomeSeguradora || "",
            cnpjSeguradora: ultimo.seguroCnpjSeguradora || "",
            numeroApolice: ultimo.seguroNumeroApolice || "",
            numeroAverbacao: ultimo.seguroNumeroAverbacao || "",
          });
        }
      } catch { /* sem manifesto anterior, começa em branco */ }

      // Quando o usuário veio da tela de CTe, o documento já está escolhido.
      if (ctePreSelecionado) return;
      try {
        const dados = await apiRequest("/documentos-fiscais?tipo=CTe");
        // Só CT-e autorizado pode ser manifestado, e só o que ainda não
        // está em outro MDF-e.
        setCtes(dados.filter(c => c.status === "autorizado" && c.chaveAcesso && !c.mdfeId));
      } catch (e) {
        setErro(e.message);
        setCtes([]);
      }
    })();
  }, [ctePreSelecionado]);

  const alternar = (id) => setSelecionados(s => s.includes(id) ? s.filter(x => x !== id) : [...s, id]);

  const confirmar = async () => {
    if (!selecionados.length) { setErro("Selecione ao menos um CT-e."); return; }
    if (!seguro.nomeSeguradora || !seguro.numeroApolice) {
      setErro("Seguradora e número da apólice são obrigatórios no modal rodoviário.");
      return;
    }
    setErro("");
    setGerando(true);
    try {
      await onGerar({ cteIds: selecionados, tipoCarga, seguro });
    } catch (e) {
      setErro([e.message, e.detalhe].filter(Boolean).join(" — "));
    } finally {
      setGerando(false);
    }
  };

  return (
    <div className="modal-backdrop">
      <div className="modal" style={{ maxWidth: 720 }}>
        <div className="modal-header">
          <h3>{ctePreSelecionado ? `MDF-e do CT-e ${ctePreSelecionado.numero || ""}` : "Novo MDFe a partir de CT-e"}</h3>
          <button className="icon-btn" onClick={onCancel}><X size={18} /></button>
        </div>
        <div className="modal-body">
          {ctes === null && <p className="subtle">Carregando CT-es autorizados…</p>}
          {ctes?.length === 0 && (
            <p className="hint">
              Nenhum CT-e autorizado disponível. Emita e autorize um CT-e primeiro — o manifesto é montado a partir dele.
            </p>
          )}
          {ctes?.length > 0 && (
            <>
              <label className="field-label">
                {ctePreSelecionado ? "CT-e que será manifestado" : "CT-es transportados nessa viagem"}
              </label>
              <div style={{ border: "0.5px solid #e5e3da", borderRadius: 8, maxHeight: 220, overflowY: "auto", marginBottom: 16 }}>
                {ctes.map(cte => (
                  <label key={cte.id} style={{ display: "flex", gap: 10, alignItems: "center", padding: "10px 12px", borderBottom: "0.5px solid #f0efe9", cursor: ctePreSelecionado ? "default" : "pointer" }}>
                    <input type="checkbox" checked={selecionados.includes(cte.id)} disabled={!!ctePreSelecionado} onChange={() => alternar(cte.id)} />
                    <span style={{ flex: 1 }}>
                      <strong>{cte.numero || "—"}/{cte.serie || "—"}</strong>{" "}
                      {cte.origemPercurso}/{cte.ufInicio} → {cte.destinoPercurso}/{cte.ufFim}
                      <span className="subtle" style={{ display: "block", fontSize: 11.5 }}>{cte.chaveAcesso}</span>
                    </span>
                  </label>
                ))}
              </div>

              <div className="field-group">
                <label className="field-label">Tipo da carga</label>
                <select value={tipoCarga} onChange={e => setTipoCarga(e.target.value)}>
                  {TIPOS_CARGA_MDFE.map(t => <option key={t.codigo} value={t.codigo}>{t.label}</option>)}
                </select>
                <p className="hint">Cavaco e serragem costumam ser granel sólido; lenha e briquete em fardos, carga geral.</p>
              </div>

              <p className="field-label" style={{ marginTop: 12 }}>Seguro da carga — obrigatório no rodoviário</p>
              <div className="form-grid">
                <div className="field-group">
                  <label className="field-label">Responsável</label>
                  <select value={seguro.responsavel} onChange={e => setSeguro(s => ({ ...s, responsavel: e.target.value }))}>
                    <option value="1">Emitente do MDF-e</option>
                    <option value="2">Contratante do transporte</option>
                  </select>
                </div>
                <div className="field-group">
                  <label className="field-label">Seguradora</label>
                  <input value={seguro.nomeSeguradora} onChange={e => setSeguro(s => ({ ...s, nomeSeguradora: e.target.value }))} />
                </div>
                <div className="field-group">
                  <label className="field-label">CNPJ da seguradora</label>
                  <input value={seguro.cnpjSeguradora} onChange={e => setSeguro(s => ({ ...s, cnpjSeguradora: e.target.value }))} />
                </div>
                <div className="field-group">
                  <label className="field-label">Número da apólice</label>
                  <input value={seguro.numeroApolice} onChange={e => setSeguro(s => ({ ...s, numeroApolice: e.target.value }))} />
                </div>
                <div className="field-group">
                  <label className="field-label">Número da averbação</label>
                  <input value={seguro.numeroAverbacao} onChange={e => setSeguro(s => ({ ...s, numeroAverbacao: e.target.value }))} />
                </div>
              </div>
            </>
          )}
          {erro && <p className="form-error">{erro}</p>}
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onCancel}>Cancelar</button>
          <button className="btn btn-primary" disabled={gerando || !ctes?.length} onClick={confirmar}>
            {gerando ? "Gerando…" : "Gerar rascunho"}
          </button>
        </div>
      </div>
    </div>
  );
}

function MdfeView() {
  const [mdfes, setMdfes] = useState(null);
  const [erro, setErro] = useState(null);
  const [processando, setProcessando] = useState(null);
  const [menuAberto, setMenuAberto] = useState(null);
  const [mostrarGerar, setMostrarGerar] = useState(false);

  useEffect(() => {
    const fechar = () => setMenuAberto(null);
    document.addEventListener("click", fechar);
    return () => document.removeEventListener("click", fechar);
  }, []);

  const carregar = useCallback(async () => {
    try {
      setErro(null);
      setMdfes(await apiRequest("/documentos-fiscais?tipo=MDFe"));
    } catch (e) {
      setErro(e.message);
      setMdfes([]);
    }
  }, []);

  useEffect(() => { carregar(); }, [carregar]);

  const gerar = async (dados) => {
    const criado = await apiRequest("/documentos-fiscais/mdfe/gerar-do-cte", {
      method: "POST",
      body: JSON.stringify(dados),
    });
    setMostrarGerar(false);
    await carregar();
    if (criado.avisos?.length) alert(criado.avisos.join("\n\n"));
  };

  const consultarAteResolver = async (id, tentativa = 0, aba = null) => {
    if (tentativa > 8) { setProcessando(null); fecharAba(aba); carregar(); return; }
    await new Promise(r => setTimeout(r, 3000));
    try {
      const resultado = await apiRequest(`/documentos-fiscais/${id}/status`);
      if (resultado.statusProvedor) return consultarAteResolver(id, tentativa + 1, aba);
      // Autorizou: o DAMDFE abre na aba que já está esperando.
      if (resultado.status === "autorizado" && resultado.pdfUrl) abrirNaAba(aba, resultado.pdfUrl);
      else fecharAba(aba);
      carregar();
    } catch { fecharAba(aba); carregar(); }
    setProcessando(null);
  };

  const emitir = async (id) => {
    const aba = abrirAbaDeEspera("MDF-e", "DAMDFE");
    setProcessando(id);
    try {
      const resultado = await apiRequest(`/documentos-fiscais/${id}/emitir`, { method: "POST" });
      await carregar();
      if (resultado.status === "enviado") return consultarAteResolver(id, 0, aba);
      fecharAba(aba);
    } catch (e) {
      fecharAba(aba);
      alert(`Não foi possível emitir: ${e.message}${e.detalhe ? `\n\nDetalhe: ${e.detalhe}` : ""}`);
      carregar();
    }
    setProcessando(null);
  };

  const consultarStatus = async (id) => {
    setProcessando(id);
    try {
      const resultado = await apiRequest(`/documentos-fiscais/${id}/status`);
      carregar();
      if (resultado.statusProvedor) {
        alert(`A SEFAZ ainda está processando (status: "${resultado.statusProvedor}"). Consulte de novo em alguns minutos.`);
      }
    } catch (e) {
      alert(`Não foi possível consultar: ${e.message}${e.detalhe ? `\n\nDetalhe: ${e.detalhe}` : ""}`);
    } finally {
      setProcessando(null);
    }
  };

  // Encerrar não é opcional: enquanto o manifesto ficar aberto, a SEFAZ
  // recusa o próximo MDF-e da mesma placa.
  const encerrar = async (mdfe) => {
    const destino = mdfe.municipioDescarregamento ? `${mdfe.municipioDescarregamento}/${mdfe.ufFim}` : "o município de descarregamento";
    if (!window.confirm(`Encerrar esse MDF-e em ${destino}, com a data de hoje?\n\nFaça isso quando a carga já tiver sido entregue.`)) return;
    setProcessando(mdfe.id);
    try {
      await apiRequest(`/documentos-fiscais/${mdfe.id}/encerrar`, { method: "POST", body: JSON.stringify({}) });
      carregar();
    } catch (e) {
      alert(`Não foi possível encerrar: ${e.message}${e.detalhe ? `\n\nDetalhe: ${e.detalhe}` : ""}`);
    } finally {
      setProcessando(null);
    }
  };

  const cancelarAutorizado = async (id) => {
    const justificativa = window.prompt("Motivo do cancelamento (mínimo 15 caracteres):");
    if (!justificativa) return;
    if (justificativa.trim().length < 15) { alert("A justificativa precisa ter pelo menos 15 caracteres."); return; }
    setProcessando(id);
    try {
      await apiRequest(`/documentos-fiscais/${id}`, { method: "DELETE", body: JSON.stringify({ justificativa }) });
      carregar();
    } catch (e) {
      alert(`Não foi possível cancelar: ${e.message}${e.detalhe ? `\n\nDetalhe: ${e.detalhe}` : ""}`);
    } finally {
      setProcessando(null);
    }
  };

  const excluirRascunho = async (id) => {
    if (!window.confirm("Excluir esse rascunho de MDFe?")) return;
    try {
      await apiRequest(`/documentos-fiscais/${id}`, { method: "DELETE" });
      carregar();
    } catch (e) {
      alert(`Não foi possível excluir: ${e.message}`);
    }
  };

  return (
    <div>
      <div className="view-header">
        <div className="view-title">
          <div className="icon-badge" style={{ background: "#faece7", color: "#712b13" }}>
            <Truck size={20} />
          </div>
          <div>
            <h2>MDFe</h2>
            <p className="subtle">
              {mdfes ? `${mdfes.length} ${mdfes.length === 1 ? "manifesto" : "manifestos"}` : "Carregando…"}
            </p>
          </div>
        </div>
        <button className="btn btn-primary" onClick={() => setMostrarGerar(true)}>
          <Plus size={16} /> Novo MDFe
        </button>
      </div>

      {erro && <p className="form-error">{erro}</p>}

      {mdfes?.length === 0 && (
        <p className="hint">
          Nenhum manifesto ainda. O MDF-e é montado a partir de um CT-e autorizado e é exigido no transporte
          intermunicipal e interestadual.
        </p>
      )}

      {mdfes?.length > 0 && (
        <table className="data-table">
          <thead>
            <tr>
              <th>Número/Série</th>
              <th>Trajeto</th>
              <th>Veículo</th>
              <th>Documentos</th>
              <th>Status</th>
              <th>Chave / Motivo</th>
              <th>Encerrado</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            {mdfes.map(mdfe => (
              <tr key={mdfe.id}>
                <td>{mdfe.numero || "—"}/{mdfe.serie || "—"}</td>
                <td>
                  {mdfe.municipioCarregamento}/{mdfe.ufInicio} → {mdfe.municipioDescarregamento}/{mdfe.ufFim}
                </td>
                <td style={{ whiteSpace: "nowrap" }}>
                  {/* Placa do cavalo; os reboques ficam no tooltip, para
                      não alargar a linha. */}
                  {mdfe.veiculo?.placa || "—"}
                  {(mdfe.veiculoReboque || mdfe.veiculoReboque2 || mdfe.veiculoReboque3) && (
                    <span className="subtle" style={{ display: "block", fontSize: 11.5 }}
                      title={[mdfe.veiculoReboque, mdfe.veiculoReboque2, mdfe.veiculoReboque3]
                        .filter(Boolean).map(r => r.placa).join(" · ")}>
                      +{[mdfe.veiculoReboque, mdfe.veiculoReboque2, mdfe.veiculoReboque3].filter(Boolean).length} reboque(s)
                    </span>
                  )}
                </td>
                <td>{mdfe._count?.documentosVinculados ?? mdfe.documentosVinculados?.length ?? 0} CT-e</td>
                <td>
                  <StatusDocumento status={mdfe.status} />
                  {processando === mdfe.id && (
                    <span style={{ color: "#8a887f", fontSize: 11.5, marginLeft: 6 }}>· aguardando…</span>
                  )}
                </td>
                <td style={{ maxWidth: 200, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}
                    title={mdfe.chaveAcesso || mdfe.motivoRejeicao || ""}>
                  {mdfe.chaveAcesso || (mdfe.status === "rejeitado" ? mdfe.motivoRejeicao : null) || "—"}
                </td>
                <td>
                  {mdfe.dataEncerramento
                    ? new Date(mdfe.dataEncerramento).toLocaleDateString("pt-BR")
                    : mdfe.status === "autorizado"
                      ? <span style={{ color: "#b57a12", fontWeight: 600 }}>Em aberto</span>
                      : "—"}
                </td>
                <td className="actions-col" style={{ position: "relative" }}>
                  <button
                    className="icon-btn nf-menu-trigger"
                    aria-label="Ações"
                    onClick={(e) => { e.stopPropagation(); setMenuAberto(menuAberto === mdfe.id ? null : mdfe.id); }}
                  >
                    <MoreVertical size={16} />
                  </button>
                  {menuAberto === mdfe.id && (
                    <div className="nf-dropdown" onClick={(e) => e.stopPropagation()}>
                      {(mdfe.status === "rascunho" || mdfe.status === "rejeitado") && (
                        <>
                          <button className="nf-dropdown-item" disabled={processando === mdfe.id}
                            onClick={() => { setMenuAberto(null); emitir(mdfe.id); }}>
                            <FileText size={14} /> {mdfe.status === "rejeitado" ? "Tentar emitir de novo" : "Emitir MDFe"}
                          </button>
                          <button className="nf-dropdown-item nf-dropdown-item-danger"
                            onClick={() => { setMenuAberto(null); excluirRascunho(mdfe.id); }}>
                            <Trash2 size={14} /> Excluir rascunho
                          </button>
                        </>
                      )}
                      {mdfe.status === "enviado" && (
                        <button className="nf-dropdown-item" disabled={processando === mdfe.id}
                          onClick={() => { setMenuAberto(null); consultarStatus(mdfe.id); }}>
                          <Search size={14} /> Consultar status
                        </button>
                      )}
                      {mdfe.status === "autorizado" && (
                        <>
                          {mdfe.pdfUrl?.startsWith("http") ? (
                            <a className="nf-dropdown-item" href={mdfe.pdfUrl} target="_blank" rel="noreferrer" onClick={() => setMenuAberto(null)}>
                              <FileText size={14} /> Baixar DAMDFE
                            </a>
                          ) : (
                            <button className="nf-dropdown-item" disabled={processando === mdfe.id}
                              onClick={() => { setMenuAberto(null); consultarStatus(mdfe.id); }}>
                              <FileText size={14} /> Buscar DAMDFE
                            </button>
                          )}
                          {mdfe.xmlUrl?.startsWith("http") ? (
                            <a className="nf-dropdown-item" href={mdfe.xmlUrl} target="_blank" rel="noreferrer" onClick={() => setMenuAberto(null)}>
                              <FileText size={14} /> Baixar XML
                            </a>
                          ) : (
                            <button className="nf-dropdown-item" disabled={processando === mdfe.id}
                              onClick={() => { setMenuAberto(null); consultarStatus(mdfe.id); }}>
                              <FileText size={14} /> Buscar XML
                            </button>
                          )}
                          {!mdfe.dataEncerramento && (
                            <button className="nf-dropdown-item" disabled={processando === mdfe.id}
                              onClick={() => { setMenuAberto(null); encerrar(mdfe); }}>
                              <Search size={14} /> Encerrar MDFe
                            </button>
                          )}
                          <button className="nf-dropdown-item nf-dropdown-item-danger" disabled={processando === mdfe.id}
                            onClick={() => { setMenuAberto(null); cancelarAutorizado(mdfe.id); }}>
                            <Trash2 size={14} /> Cancelar MDFe (SEFAZ)
                          </button>
                        </>
                      )}
                    </div>
                  )}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      {mostrarGerar && <GerarMdfeModal onGerar={gerar} onCancel={() => setMostrarGerar(false)} />}
    </div>
  );
}

// ---------- Notas Fiscais (NFe) ----------
// Diferente dos outros cadastros: os itens são uma lista dinâmica, então
// tem um formulário próprio em vez de usar o Field/RecordForm genérico.

const MODALIDADES_FRETE = ["Sem frete", "Por conta do emitente", "Por conta do destinatário", "Por conta de terceiros"];
const FINALIDADES_OPERACAO = ["Normal", "Complementar", "Ajuste", "Devolução"];
const INDICADORES_PRESENCA = ["Não se aplica", "Presencial", "Internet", "Teleatendimento", "Entrega a domicílio", "Presencial fora do estabelecimento"];
const FORMAS_PAGAMENTO = ["Dinheiro", "Cartão de Crédito", "Cartão de Débito", "PIX", "Boleto", "Transferência Bancária", "Sem pagamento (a prazo)"];

function NotaFiscalForm({ nota, clientes, produtosDisponiveis, transportadoras, colaboradores, veiculos, criarCliente, criarTransportadora, criarVeiculo, criarColaborador, onSave, onCancel }) {
  const hoje = new Date().toISOString().slice(0, 10);
  const [dataEmissao, setDataEmissao] = useState(nota?.dataEmissao ? nota.dataEmissao.slice(0, 10) : hoje);
  // Documento novo já nasce com o colaborador de quem está emitindo — o
  // vínculo vem do cadastro do usuário.
  const [colaboradorResponsavelId, setColaboradorResponsavelId] = useState(
    nota?.colaboradorResponsavelId ? String(nota.colaboradorResponsavelId) : colaboradorDoUsuario()
  );
  const [veiculoId, setVeiculoId] = useState(nota?.veiculoId ? String(nota.veiculoId) : "");
  const [veiculoReboqueId, setVeiculoReboqueId] = useState(nota?.veiculoReboqueId ? String(nota.veiculoReboqueId) : "");
  const [veiculoReboque2Id, setVeiculoReboque2Id] = useState(nota?.veiculoReboque2Id ? String(nota.veiculoReboque2Id) : "");
  const [destinatarioId, setDestinatarioId] = useState(nota?.destinatarioId ? String(nota.destinatarioId) : "");
  const [transportadoraId, setTransportadoraId] = useState(nota?.transportadoraId ? String(nota.transportadoraId) : "");
  const [quickAdd, setQuickAdd] = useState(null); // { tipo: 'clientes'|'transportadoras'|'veiculos'|'colaboradores', setter }
  const CRIAR_POR_TIPO = { clientes: criarCliente, transportadoras: criarTransportadora, veiculos: criarVeiculo, colaboradores: criarColaborador };
  const salvarQuickAdd = async (dados) => {
    const criado = await CRIAR_POR_TIPO[quickAdd.tipo](dados);
    quickAdd.setter(String(criado.id));
    setQuickAdd(null);
  };
  const [naturezaOperacao, setNaturezaOperacao] = useState(nota?.naturezaOperacao || "Venda de mercadoria");
  const [modalidadeFrete, setModalidadeFrete] = useState(nota?.modalidadeFrete || "Sem frete");
  const [dataSaida, setDataSaida] = useState(nota?.dataSaida ? nota.dataSaida.slice(0, 10) : "");
  // A hora vem junto da data no banco; aqui os dois campos são separados
  // porque é assim que se preenche. Em nota nova, começa na hora de agora:
  // a emissão costuma acontecer no momento em que o caminhão sai, e em
  // branco o DANFE saía com 00:00.
  const [horaSaida, setHoraSaida] = useState(() => {
    if (!nota?.dataSaida) {
      return new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
    }
    return new Date(nota.dataSaida).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
  });
  const [informacoesComplementares, setInformacoesComplementares] = useState(nota?.informacoesComplementares || "");

  // Escolher o cliente traz a observação padrão dele. Só preenche quando o
  // campo está vazio ou ainda tem a observação de outro cliente — texto
  // digitado à mão para esta nota não é sobrescrito.
  const escolherDestinatario = (id) => {
    const anterior = (clientes || []).find(c => String(c.id) === String(destinatarioId));
    setDestinatarioId(id);

    const novo = (clientes || []).find(c => String(c.id) === String(id));
    const podeTrocar = !informacoesComplementares
      || informacoesComplementares === (anterior?.observacaoPadrao || "");
    if (podeTrocar) setInformacoesComplementares(novo?.observacaoPadrao || "");
  };
  const [finalidadeOperacao, setFinalidadeOperacao] = useState(nota?.finalidadeOperacao || "Normal");
  const [chaveNfeReferenciada, setChaveNfeReferenciada] = useState(nota?.chaveNfeReferenciada || "");
  const [consumidorFinal, setConsumidorFinal] = useState(nota?.consumidorFinal ?? false);
  const [indicadorPresenca, setIndicadorPresenca] = useState(nota?.indicadorPresenca || "Não se aplica");
  const [formaPagamento, setFormaPagamento] = useState(nota?.formaPagamento || "Dinheiro");
  const [valorFrete, setValorFrete] = useState(nota?.valorFrete ?? "");
  const [valorSeguro, setValorSeguro] = useState(nota?.valorSeguro ?? "");
  const [valorDesconto, setValorDesconto] = useState(nota?.valorDesconto ?? "");
  const [quantidadeVolumes, setQuantidadeVolumes] = useState(nota?.quantidadeVolumes ?? "");
  const [especieVolumes, setEspecieVolumes] = useState(nota?.especieVolumes || "");
  const [pesoBrutoTotal, setPesoBrutoTotal] = useState(nota?.pesoBrutoTotal ?? "");
  const [pesoLiquidoTotal, setPesoLiquidoTotal] = useState(nota?.pesoLiquidoTotal ?? "");
  const [baseCalculoIcms, setBaseCalculoIcms] = useState(nota?.baseCalculoIcms ?? "");
  const [valorIcms, setValorIcms] = useState(nota?.valorIcms ?? "");
  const [baseCalculoIcmsSt, setBaseCalculoIcmsSt] = useState(nota?.baseCalculoIcmsSt ?? "");
  const [valorIcmsSt, setValorIcmsSt] = useState(nota?.valorIcmsSt ?? "");
  const [outrasDespesas, setOutrasDespesas] = useState(nota?.outrasDespesas ?? "");
  const [valorIpi, setValorIpi] = useState(nota?.valorIpi ?? "");
  const [itens, setItens] = useState(() =>
    nota?.itens?.length
      ? nota.itens.map(i => ({ produtoId: String(i.produtoId), quantidade: i.quantidade, valorUnitario: i.valorUnitario, cfopUtilizado: i.cfopUtilizado || "", ncmUtilizado: i.ncmUtilizado || "", cstUtilizado: i.cstUtilizado || "" }))
      : [{ produtoId: "", quantidade: 1, valorUnitario: "", cfopUtilizado: "", ncmUtilizado: "", cstUtilizado: "" }]
  );
  const [erro, setErro] = useState("");
  const [salvando, setSalvando] = useState(false);

  const atualizarItem = (index, campo, valor) => {
    setItens(prev => prev.map((it, i) => {
      if (i !== index) return it;
      const atualizado = { ...it, [campo]: valor };
      if (campo === "produtoId") {
        const produto = (produtosDisponiveis || []).find(p => String(p.id) === valor);
        if (produto) {
          atualizado.valorUnitario = produto.valorUnitario ?? "";
          atualizado.cfopUtilizado = produto.cfop || "";
          atualizado.ncmUtilizado = produto.ncm || "";
          atualizado.cstUtilizado = produto.cst || "";
        }
      }
      return atualizado;
    }));
  };

  const adicionarItem = () => setItens(prev => [...prev, { produtoId: "", quantidade: 1, valorUnitario: "", cfopUtilizado: "", ncmUtilizado: "", cstUtilizado: "" }]);
  const removerItem = (index) => setItens(prev => prev.length > 1 ? prev.filter((_, i) => i !== index) : prev);

  const totalItens = itens.reduce((soma, it) => soma + (Number(it.quantidade) || 0) * (Number(it.valorUnitario) || 0), 0);
  const valorTotalGeral = totalItens
    + (Number(valorFrete) || 0) + (Number(valorSeguro) || 0) - (Number(valorDesconto) || 0)
    + (Number(valorIpi) || 0) + (Number(outrasDespesas) || 0);

  const clienteSelecionado = (clientes || []).find(c => String(c.id) === destinatarioId);

  const salvar = async () => {
    if (!destinatarioId) { setErro("Selecione o cliente."); return; }
    const itensValidos = itens.filter(it => it.produtoId && Number(it.quantidade) > 0);
    if (itensValidos.length === 0) { setErro("Adicione pelo menos um item com produto e quantidade."); return; }
    setErro("");
    setSalvando(true);
    try {
      await onSave({
        destinatarioId: Number(destinatarioId),
        transportadoraId: transportadoraId ? Number(transportadoraId) : undefined,
        veiculoId: veiculoId ? Number(veiculoId) : null,
        veiculoReboqueId: veiculoReboqueId ? Number(veiculoReboqueId) : null,
        veiculoReboque2Id: veiculoReboque2Id ? Number(veiculoReboque2Id) : null,
        colaboradorResponsavelId: colaboradorResponsavelId ? Number(colaboradorResponsavelId) : undefined,
        dataEmissao: dataEmissao || undefined,
        naturezaOperacao,
        modalidadeFrete,
        dataSaida: dataSaida || undefined,
        horaSaida: horaSaida || undefined,
        informacoesComplementares,
        finalidadeOperacao,
        chaveNfeReferenciada: chaveNfeReferenciada || null,
        consumidorFinal,
        indicadorPresenca,
        formaPagamento,
        valorFrete: valorFrete !== "" ? Number(valorFrete) : undefined,
        valorSeguro: valorSeguro !== "" ? Number(valorSeguro) : undefined,
        valorDesconto: valorDesconto !== "" ? Number(valorDesconto) : undefined,
        quantidadeVolumes: quantidadeVolumes !== "" ? Number(quantidadeVolumes) : undefined,
        especieVolumes: especieVolumes || undefined,
        pesoBrutoTotal: pesoBrutoTotal !== "" ? Number(pesoBrutoTotal) : undefined,
        pesoLiquidoTotal: pesoLiquidoTotal !== "" ? Number(pesoLiquidoTotal) : undefined,
        baseCalculoIcms: baseCalculoIcms !== "" ? Number(baseCalculoIcms) : undefined,
        valorIcms: valorIcms !== "" ? Number(valorIcms) : undefined,
        baseCalculoIcmsSt: baseCalculoIcmsSt !== "" ? Number(baseCalculoIcmsSt) : undefined,
        valorIcmsSt: valorIcmsSt !== "" ? Number(valorIcmsSt) : undefined,
        outrasDespesas: outrasDespesas !== "" ? Number(outrasDespesas) : undefined,
        valorIpi: valorIpi !== "" ? Number(valorIpi) : undefined,
        itens: itensValidos.map(it => ({
          produtoId: Number(it.produtoId),
          quantidade: Number(it.quantidade),
          valorUnitario: it.valorUnitario !== "" ? Number(it.valorUnitario) : undefined,
          cfopUtilizado: it.cfopUtilizado || undefined,
          ncmUtilizado: it.ncmUtilizado || undefined,
          cstUtilizado: it.cstUtilizado || undefined,
        })),
      });
    } catch (e) {
      setErro(e.message || "Erro ao salvar a nota fiscal");
    } finally {
      setSalvando(false);
    }
  };

  return (
    <div className="modal-backdrop">
      <div className="modal modal-cadastro">
        <div className="modal-header">
          <h3>{nota?.id ? "Editar" : "Nova"} Nota Fiscal</h3>
          <button className="icon-btn" onClick={onCancel} aria-label="Fechar"><X size={18} /></button>
        </div>
        <div className="modal-body">
          <div className="nf-section">
            <h4 className="nf-section-title">Dados gerais</h4>
            <div className="nf-grid-3">
              <div className="field-group">
                <label className="field-label">Natureza da operação</label>
                <input value={naturezaOperacao} onChange={e => setNaturezaOperacao(e.target.value)} />
              </div>
              <div className="field-group">
                <label className="field-label">Colaborador responsável</label>
                <div style={{ display: "flex", gap: 6 }}>
                  <select value={colaboradorResponsavelId} onChange={e => setColaboradorResponsavelId(e.target.value)} style={{ flex: 1 }}>
                    <option value="">Nenhum</option>
                    {(colaboradores || []).map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
                  </select>
                  <button type="button" tabIndex={-1} className="icon-btn nf-menu-trigger" title="Cadastrar colaborador novo" onClick={() => setQuickAdd({ tipo: "colaboradores", setter: setColaboradorResponsavelId })}><Plus size={14} /></button>
                </div>
              </div>
              <div className="field-group">
                <label className="field-label">Finalidade da operação</label>
                <select value={finalidadeOperacao} onChange={e => setFinalidadeOperacao(e.target.value)}>
                  {FINALIDADES_OPERACAO.map(o => <option key={o} value={o}>{o}</option>)}
                </select>
              </div>
            </div>

            {/* Complementar, ajuste e devolução precisam apontar a nota de
                origem: a SEFAZ recusa sem essa referência. */}
            {finalidadeOperacao !== "Normal" && (
              <div className="field-group">
                <label className="field-label">
                  Chave da NF-e de origem<span className="req">*</span>
                </label>
                <input
                  value={chaveNfeReferenciada}
                  inputMode="numeric"
                  placeholder="44 dígitos — pode colar com espaços"
                  onChange={e => setChaveNfeReferenciada(e.target.value.replace(/\D/g, "").slice(0, 44))}
                />
                <p className="hint">
                  {chaveNfeReferenciada.length === 44
                    ? "Chave completa."
                    : `${chaveNfeReferenciada.length} de 44 dígitos — é a nota que está sendo ${finalidadeOperacao.toLowerCase() === "devolução" ? "devolvida" : "complementada ou ajustada"}.`}
                </p>
              </div>
            )}
            {/* Três colunas: com a grade de duas, a hora caía sozinha na
                linha de baixo. */}
            <div className="nf-grid-3">
              <div className="field-group">
                <label className="field-label">Data de emissão</label>
                <input type="date" value={dataEmissao} onChange={e => setDataEmissao(e.target.value)} />
              </div>
              <div className="field-group">
                <label className="field-label">Data de saída</label>
                <input type="date" value={dataSaida} onChange={e => setDataSaida(e.target.value)} />
              </div>
              <div className="field-group">
                <label className="field-label">Hora de saída</label>
                {/* O DANFE tem campo próprio para a hora; em branco ele sai
                    zerado, o que estranha numa conferência de estrada. */}
                <input type="time" value={horaSaida} onChange={e => setHoraSaida(e.target.value)} />
              </div>
            </div>
          </div>

          <div className="nf-section">
            <h4 className="nf-section-title">Destinatário</h4>
            <div className="endereco-grid">
              <div className="field-group">
                <label className="field-label">Cliente<span className="req">*</span></label>
                <div style={{ display: "flex", gap: 6 }}>
                  <select value={destinatarioId} onChange={e => escolherDestinatario(e.target.value)} style={{ flex: 1 }}>
                    <option value="">Selecione…</option>
                    {(clientes || []).map(c => <option key={c.id} value={c.id}>{rotuloPessoa(c)}</option>)}
                  </select>
                  <button type="button" tabIndex={-1} className="icon-btn nf-menu-trigger" title="Cadastrar cliente novo" onClick={() => setQuickAdd({ tipo: "clientes", setter: setDestinatarioId })}><Plus size={14} /></button>
                </div>
                {clientes?.length === 0 && <p className="hint">Nenhum cliente cadastrado ainda.</p>}
              </div>
              <div className="field-group">
                <label className="field-label">CNPJ / CPF</label>
                <input value={clienteSelecionado?.documento || ""} disabled placeholder="Selecione o cliente" />
              </div>
            </div>
            <div className="endereco-grid">
              <div className="field-group">
                <label className="field-label">Presença do comprador</label>
                <select value={indicadorPresenca} onChange={e => setIndicadorPresenca(e.target.value)}>
                  {INDICADORES_PRESENCA.map(o => <option key={o} value={o}>{o}</option>)}
                </select>
              </div>
              <div className="field-group">
                <label className="field-label">Contribuinte</label>
                <input value={clienteSelecionado?.contribuinte || ""} disabled placeholder="Selecione o cliente" />
              </div>
            </div>
          </div>

          <div className="nf-section">
            <h4 className="nf-section-title">Fatura</h4>
            <div className="endereco-grid">
              <div className="field-group">
                <label className="field-label">Forma de pagamento</label>
                <select value={formaPagamento} onChange={e => setFormaPagamento(e.target.value)}>
                  {FORMAS_PAGAMENTO.map(o => <option key={o} value={o}>{o}</option>)}
                </select>
              </div>
              <div className="field-group" style={{ display: "flex", alignItems: "flex-end" }}>
                <label className={`nf-toggle ${consumidorFinal ? "nf-toggle-ativo" : ""}`}>
                  <input type="checkbox" checked={consumidorFinal} onChange={e => setConsumidorFinal(e.target.checked)} />
                  <span>Venda para consumidor final</span>
                </label>
              </div>
            </div>
          </div>

          <div className="nf-section">
            <h4 className="nf-section-title">Transporte</h4>
            <div className="field-group">
              <label className="field-label">Modalidade do frete</label>
              <select value={modalidadeFrete} onChange={e => setModalidadeFrete(e.target.value)}>
                {MODALIDADES_FRETE.map(o => <option key={o} value={o}>{o}</option>)}
              </select>
            </div>
            <div className="endereco-grid">
              <div className="field-group">
                <label className="field-label">Transportadora</label>
                <div style={{ display: "flex", gap: 6 }}>
                  <select value={transportadoraId} onChange={e => setTransportadoraId(e.target.value)} style={{ flex: 1 }}>
                    <option value="">Nenhuma</option>
                    {(transportadoras || []).map(t => <option key={t.id} value={t.id}>{t.nome}</option>)}
                  </select>
                  <button type="button" tabIndex={-1} className="icon-btn nf-menu-trigger" title="Cadastrar transportadora nova" onClick={() => setQuickAdd({ tipo: "transportadoras", setter: setTransportadoraId })}><Plus size={14} /></button>
                </div>
              </div>
              <div className="field-group">
                <label className="field-label">Cavalo (placa)</label>
                <div style={{ display: "flex", gap: 6 }}>
                  <select value={veiculoId} onChange={e => setVeiculoId(e.target.value)} style={{ flex: 1 }}>
                    <option value="">Nenhum</option>
                    {(veiculos || []).map(v => <option key={v.id} value={v.id}>{v.placa}</option>)}
                  </select>
                  <button type="button" tabIndex={-1} className="icon-btn nf-menu-trigger" title="Cadastrar veículo novo" onClick={() => setQuickAdd({ tipo: "veiculos", setter: setVeiculoId })}><Plus size={14} /></button>
                </div>
              </div>
              {/* Reboques: entram nas observações do DANFE, como a placa do
                  cavalo, quando a operação não admite o grupo do veículo. */}
              <div className="field-group">
                <label className="field-label">1º reboque</label>
                <select value={veiculoReboqueId} onChange={e => setVeiculoReboqueId(e.target.value)}>
                  <option value="">Nenhum</option>
                  {(veiculos || []).map(v => <option key={v.id} value={v.id}>{v.placa}</option>)}
                </select>
              </div>
              <div className="field-group">
                <label className="field-label">2º reboque</label>
                <select value={veiculoReboque2Id} onChange={e => setVeiculoReboque2Id(e.target.value)}>
                  <option value="">Nenhum</option>
                  {(veiculos || []).map(v => <option key={v.id} value={v.id}>{v.placa}</option>)}
                </select>
              </div>
            </div>
            <div className="nf-grid-4">
              <div className="field-group">
                <label className="field-label">Volumes (qtd.)</label>
                <input type="number" value={quantidadeVolumes} onChange={e => setQuantidadeVolumes(e.target.value)} />
              </div>
              <div className="field-group">
                <label className="field-label">Espécie dos volumes</label>
                <input placeholder="Ex: Caixas, Sacos" value={especieVolumes} onChange={e => setEspecieVolumes(e.target.value)} />
              </div>
              <div className="field-group">
                <label className="field-label">Peso bruto total (kg)</label>
                <InputDecimal value={pesoBrutoTotal} onChange={setPesoBrutoTotal} />
              </div>
              <div className="field-group">
                <label className="field-label">Peso líquido total (kg)</label>
                <InputDecimal value={pesoLiquidoTotal} onChange={setPesoLiquidoTotal} />
              </div>
            </div>
          </div>

          <div className="nf-section">
            <h4 className="nf-section-title">Itens<span className="req">*</span></h4>
            <div className="nf-itens-table">
              <div className="nf-itens-header">
                <span>Produto</span>
                <span>Qtd.</span>
                <span>Vlr. unit.</span>
                <span>CFOP</span>
                <span>NCM</span>
                <span>CST</span>
                <span style={{ textAlign: "right" }}>Total</span>
                <span></span>
              </div>
              {itens.map((item, index) => {
                const totalItem = (Number(item.quantidade) || 0) * (Number(item.valorUnitario) || 0);
                return (
                  <div key={index} className="nf-item-row">
                    <select value={item.produtoId} onChange={e => atualizarItem(index, "produtoId", e.target.value)}>
                      <option value="">Selecione…</option>
                      {/* A unidade junto do nome evita lançar 40.000 quando o
                          produto é vendido por tonelada, e vice-versa. */}
                      {(produtosDisponiveis || []).map(p => (
                        <option key={p.id} value={p.id}>
                          {p.descricao}{p.unidade ? ` - ${p.unidade}` : ""}
                        </option>
                      ))}
                    </select>
                    <input type="number" value={item.quantidade} onChange={e => atualizarItem(index, "quantidade", e.target.value)} />
                    <InputMoeda value={item.valorUnitario} onChange={v => atualizarItem(index, "valorUnitario", v)} />
                    <CfopField value={item.cfopUtilizado} onChange={v => atualizarItem(index, "cfopUtilizado", v)} />
                    <NcmField value={item.ncmUtilizado} onChange={v => atualizarItem(index, "ncmUtilizado", v)} />
                    <input value={item.cstUtilizado} onChange={e => atualizarItem(index, "cstUtilizado", e.target.value)} />
                    <span className="nf-item-total">R$ {formatarMoeda(totalItem)}</span>
                    <button type="button" className="icon-btn icon-btn-danger" onClick={() => removerItem(index)} aria-label="Remover item">
                      <Trash2 size={14} />
                    </button>
                  </div>
                );
              })}
            </div>
            <button type="button" className="btn" onClick={adicionarItem}><Plus size={14} /> Adicionar item</button>
          </div>

          <div className="nf-section">
            <h4 className="nf-section-title">Frete, seguro e desconto</h4>
            <div className="nf-grid-3">
              <div className="field-group">
                <label className="field-label">Valor do frete (R$)</label>
                <InputMoeda value={valorFrete} onChange={setValorFrete} />
              </div>
              <div className="field-group">
                <label className="field-label">Valor do seguro (R$)</label>
                <InputMoeda value={valorSeguro} onChange={setValorSeguro} />
              </div>
              <div className="field-group">
                <label className="field-label">Desconto (R$)</label>
                <InputMoeda value={valorDesconto} onChange={setValorDesconto} />
              </div>
            </div>
            <div className="field-group" style={{ marginBottom: 0 }}>
              <label className="field-label">Informações complementares</label>
              {/* Texto longo por natureza: regime especial, número de
                  contrato, instrução de entrega. Uma linha só obrigava a
                  rolar o campo para reler. */}
              <textarea
                rows={4}
                value={informacoesComplementares}
                onChange={e => setInformacoesComplementares(e.target.value)}
                style={{ width: "100%", resize: "vertical", fontFamily: "inherit", fontSize: 14 }}
              />
              <p className="hint">
                A mensagem fixa cadastrada em Configurações é acrescentada automaticamente ao emitir.
              </p>
            </div>
          </div>

          <div className="nf-section">
            <h4 className="nf-section-title">Impostos</h4>
            <div className="nf-grid-3">
              <div className="field-group">
                <label className="field-label">Base de cálculo do ICMS (R$)</label>
                <InputMoeda value={baseCalculoIcms} onChange={setBaseCalculoIcms} />
              </div>
              <div className="field-group">
                <label className="field-label">Valor do ICMS (R$)</label>
                <InputMoeda value={valorIcms} onChange={setValorIcms} />
              </div>
              <div className="field-group">
                <label className="field-label">Valor do IPI (R$)</label>
                <InputMoeda value={valorIpi} onChange={setValorIpi} />
              </div>
            </div>
            <div className="nf-grid-3">
              <div className="field-group">
                <label className="field-label">Base de cálculo do ICMS ST (R$)</label>
                <InputMoeda value={baseCalculoIcmsSt} onChange={setBaseCalculoIcmsSt} />
              </div>
              <div className="field-group">
                <label className="field-label">Valor do ICMS ST (R$)</label>
                <InputMoeda value={valorIcmsSt} onChange={setValorIcmsSt} />
              </div>
              <div className="field-group">
                <label className="field-label">Outras despesas (R$)</label>
                <InputMoeda value={outrasDespesas} onChange={setOutrasDespesas} />
              </div>
            </div>
            <p className="hint" style={{ marginTop: -4 }}>ICMS e ICMS ST são informativos (já embutidos no valor dos itens). IPI e outras despesas entram no total da nota.</p>
          </div>

          <div className="nf-total-card">
            <div className="nf-total-row"><span>Subtotal dos itens</span><span>R$ {formatarMoeda(totalItens)}</span></div>
            <div className="nf-total-row"><span>+ Frete</span><span>R$ {formatarMoeda((Number(valorFrete) || 0))}</span></div>
            <div className="nf-total-row"><span>+ Seguro</span><span>R$ {formatarMoeda((Number(valorSeguro) || 0))}</span></div>
            <div className="nf-total-row"><span>− Desconto</span><span>R$ {formatarMoeda((Number(valorDesconto) || 0))}</span></div>
            <div className="nf-total-row"><span>+ IPI</span><span>R$ {formatarMoeda((Number(valorIpi) || 0))}</span></div>
            <div className="nf-total-row"><span>+ Outras despesas</span><span>R$ {formatarMoeda((Number(outrasDespesas) || 0))}</span></div>
            <div className="nf-total-final"><span>Total da nota</span><span>R$ {formatarMoeda(valorTotalGeral)}</span></div>
          </div>

          {erro && <p className="error-text" style={{ marginTop: 14 }}>{erro}</p>}
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onCancel} disabled={salvando}>Cancelar</button>
          <button className="btn btn-primary" onClick={salvar} disabled={salvando}>{salvando ? "Salvando…" : "Salvar"}</button>
        </div>
      </div>
      {quickAdd && (
        <RecordForm
          moduleKey={quickAdd.tipo}
          record={null}
          onSave={salvarQuickAdd}
          onCancel={() => setQuickAdd(null)}
        />
      )}
    </div>
  );
}

const STATUS_DOCUMENTO_LABEL = {
  rascunho: "Rascunho",
  enviado: "Enviado",
  autorizado: "Autorizado",
  rejeitado: "Rejeitado",
  cancelado: "Cancelado",
};

// Cor por status — "Rejeitado" precisa saltar aos olhos: quem olha a lista
// no pátio não pode confundir um documento recusado com um válido.
const STATUS_DOCUMENTO_COR = {
  rascunho: "#8a887f",
  enviado: "#b57a12",
  autorizado: "#1a7f37",
  rejeitado: "#c62828",
  // Vermelho como o rejeitado: documento cancelado precisa saltar aos
  // olhos na lista, não passar por cinza de desativado.
  cancelado: "#c62828",
};

function StatusDocumento({ status }) {
  return (
    <span style={{ color: STATUS_DOCUMENTO_COR[status] || "inherit", fontWeight: 600 }}>
      {STATUS_DOCUMENTO_LABEL[status] || status}
    </span>
  );
}

function CartaCorrecaoModal({ nota, onClose }) {
  const [historico, setHistorico] = useState(null);
  const [texto, setTexto] = useState("");
  const [enviando, setEnviando] = useState(false);
  const [erro, setErro] = useState("");
  const [atualizandoCartaId, setAtualizandoCartaId] = useState(null);

  const carregarHistorico = useCallback(async () => {
    try {
      const dados = await apiRequest(`/documentos-fiscais/${nota.id}/carta-correcao`);
      setHistorico(dados);
    } catch {
      setHistorico([]);
    }
  }, [nota.id]);

  useEffect(() => { carregarHistorico(); }, [carregarHistorico]);

  const atualizarStatusCarta = async (cartaId) => {
    setAtualizandoCartaId(cartaId);
    try {
      await apiRequest(`/documentos-fiscais/${nota.id}/carta-correcao/${cartaId}/status`);
      carregarHistorico();
    } catch (e) {
      alert(`Não foi possível consultar: ${e.message}${e.detalhe ? `\n\nDetalhe: ${e.detalhe}` : ""}`);
    } finally {
      setAtualizandoCartaId(null);
    }
  };

  const enviar = async () => {
    const limpo = texto.trim();
    if (limpo.length < 15 || limpo.length > 1000) {
      setErro("O texto precisa ter entre 15 e 1000 caracteres.");
      return;
    }
    setErro("");
    setEnviando(true);
    try {
      await apiRequest(`/documentos-fiscais/${nota.id}/carta-correcao`, {
        method: "POST",
        body: JSON.stringify({ texto: limpo }),
      });
      setTexto("");
      carregarHistorico();
    } catch (e) {
      setErro(`${e.message}${e.detalhe ? ` — ${e.detalhe}` : ""}`);
    } finally {
      setEnviando(false);
    }
  };

  return (
    <div className="modal-backdrop">
      <div className="modal" style={{ width: 560 }}>
        <div className="modal-header">
          <h3>Carta de correção — {nota.tipo} {nota.numero}/{nota.serie ?? "—"}</h3>
          <button className="icon-btn" onClick={onClose} aria-label="Fechar"><X size={18} /></button>
        </div>
        <div className="modal-body">
          <p className="hint" style={{ marginTop: 0 }}>
            Não serve pra corrigir valores, impostos, dados do cliente/emitente ou datas — só detalhes como descrição,
            endereço de entrega, etc. Nesses outros casos, a nota precisa ser cancelada.
          </p>

          <div className="field-group">
            <label className="field-label">Texto da correção<span className="req">*</span></label>
            <textarea
              value={texto}
              onChange={e => setTexto(e.target.value)}
              rows={4}
              maxLength={1000}
              style={{ width: "100%", boxSizing: "border-box", fontFamily: "inherit", fontSize: 13, padding: 8 }}
            />
            <p className="hint">{texto.trim().length}/1000 caracteres (mínimo 15)</p>
          </div>

          {erro && <p className="error-text">{erro}</p>}

          <button className="btn btn-primary" onClick={enviar} disabled={enviando}>
            {enviando ? "Enviando…" : "Enviar correção"}
          </button>

          <div className="nf-section" style={{ marginTop: 20 }}>
            <h4 className="nf-section-title">Histórico</h4>
            {historico === null && <p className="hint">Carregando…</p>}
            {historico?.length === 0 && <p className="hint">Nenhuma correção enviada ainda.</p>}
            {historico?.map(c => (
              <div key={c.id} style={{ borderBottom: "1px solid #eeece4", padding: "8px 0", fontSize: 13 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", color: "#8a887f", fontSize: 11.5 }}>
                  <span>Nº {c.numeroSequencial} · {new Date(c.criadoEm).toLocaleString("pt-BR")}</span>
                  <span style={{ fontWeight: 600, color: c.status === "erro" ? "#a32d2d" : "#27500a" }}>
                    {c.status === "erro" ? "Erro" : c.status === "registrada" ? "Registrada" : "Pendente"}
                  </span>
                </div>
                <p style={{ margin: "4px 0 0" }}>{c.texto}</p>
                {c.motivoErro && <p style={{ margin: "4px 0 0", color: "#a32d2d", fontSize: 12 }}>{c.motivoErro}</p>}
                {c.status !== "erro" && (
                  c.pdfUrl?.startsWith("http") ? (
                    <a href={c.pdfUrl} target="_blank" rel="noreferrer" style={{ display: "inline-block", marginTop: 6, fontSize: 12, fontWeight: 500, color: "#00732F" }}>
                      Baixar PDF da carta
                    </a>
                  ) : (
                    <button
                      className="btn"
                      style={{ marginTop: 6, padding: "4px 10px", fontSize: 12 }}
                      disabled={atualizandoCartaId === c.id}
                      onClick={() => atualizarStatusCarta(c.id)}
                    >
                      {atualizandoCartaId === c.id ? "Consultando…" : "Emitir / atualizar status"}
                    </button>
                  )
                )}
              </div>
            ))}
          </div>
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onClose}>Fechar</button>
        </div>
      </div>
    </div>
  );
}

// ---------- Relatórios ----------
// O PDF sai pela impressão do próprio navegador: abre uma janela formatada
// para A4 e o usuário escolhe imprimir ou salvar como PDF. Evita uma
// biblioteca de PDF no servidor para um documento que é, no fundo, uma
// tabela.
// ---------- Guia Florestal ----------
// A guia é emitida no SISFLORA; aqui só se registra o número e os prazos.
// Guia não recebida no prazo restringe comprar e vender no sistema do
// órgão, e é esse esquecimento que este controle evita.
function GuiaFlorestalModal({ nota, onFechar, onSalvo }) {
  const paraInput = (v) => (v ? String(v).slice(0, 10) : "");
  const [dados, setDados] = useState({
    gfNumero: nota.gfNumero || "",
    gfDataEmissao: paraInput(nota.gfDataEmissao),
    gfValidade: paraInput(nota.gfValidade),
    gfDataRecebimento: paraInput(nota.gfDataRecebimento),
    gfObservacao: nota.gfObservacao || "",
  });
  const [salvando, setSalvando] = useState(false);
  const [erro, setErro] = useState("");

  const set = (campo, valor) => setDados(d => ({ ...d, [campo]: valor }));

  // Guia interna em MT vale 15 dias; preenche sozinho ao informar a
  // emissão, e continua editável.
  const definirEmissao = (valor) => {
    setDados(d => {
      if (!valor) return { ...d, gfDataEmissao: "" };
      const validade = new Date(`${valor}T12:00:00Z`);
      validade.setUTCDate(validade.getUTCDate() + 15);
      return {
        ...d,
        gfDataEmissao: valor,
        gfValidade: d.gfValidade || validade.toISOString().slice(0, 10),
      };
    });
  };

  const salvar = async () => {
    setSalvando(true); setErro("");
    try {
      await apiRequest(`/documentos-fiscais/${nota.id}/guia-florestal`, {
        method: "PUT",
        body: JSON.stringify(dados),
      });
      onSalvo();
    } catch (e) {
      setErro([e.message, e.detalhe].filter(Boolean).join(" — "));
    } finally { setSalvando(false); }
  };

  return (
    <div className="modal-backdrop">
      <div className="modal" style={{ maxWidth: 560 }}>
        <div className="modal-header">
          <h3>Guia Florestal — NF-e {nota.numero || ""}</h3>
          <button className="icon-btn" onClick={onFechar} aria-label="Fechar"><X size={18} /></button>
        </div>
        <div className="modal-body">
          <p className="hint" style={{ marginTop: 0 }}>
            A GF é emitida no SISFLORA. Registre aqui o número e os prazos para o sistema avisar
            quando a guia estiver perto de vencer sem ter sido recebida.
          </p>
          <div className="nf-grid-3">
            <div className="field-group">
              <label className="field-label">Número da GF</label>
              <input value={dados.gfNumero} onChange={e => set("gfNumero", e.target.value)} />
            </div>
            <div className="field-group">
              <label className="field-label">Emissão</label>
              <input type="date" value={dados.gfDataEmissao} onChange={e => definirEmissao(e.target.value)} />
            </div>
            <div className="field-group">
              <label className="field-label">Validade</label>
              <input type="date" value={dados.gfValidade} onChange={e => set("gfValidade", e.target.value)} />
            </div>
          </div>
          <div className="nf-grid-3">
            <div className="field-group">
              <label className="field-label">Recebida em</label>
              <input type="date" value={dados.gfDataRecebimento} onChange={e => set("gfDataRecebimento", e.target.value)} />
              <p className="hint">Data em que o destinatário deu o recebimento no SISFLORA.</p>
            </div>
            <div className="field-group" style={{ gridColumn: "span 2" }}>
              <label className="field-label">Observação</label>
              <input value={dados.gfObservacao} onChange={e => set("gfObservacao", e.target.value)} />
            </div>
          </div>
          {erro && <p className="error-text">{erro}</p>}
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onFechar} disabled={salvando}>Cancelar</button>
          <button className="btn btn-primary" onClick={salvar} disabled={salvando}>
            {salvando ? "Salvando…" : "Salvar"}
          </button>
        </div>
      </div>
    </div>
  );
}

// Situação da guia de uma nota, para colorir a lista e avisar do prazo.
function situacaoGuia(nota) {
  if (nota.gfDataRecebimento) return { texto: "GF recebida", cor: "#00732F" };
  if (!nota.gfNumero) return { texto: "sem GF", cor: "#c62828" };

  if (nota.gfValidade) {
    const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    const validade = new Date(String(nota.gfValidade).slice(0, 10) + "T12:00:00Z");
    const dias = Math.round((validade - hoje) / 86400000);
    if (dias < 0) return { texto: `GF vencida há ${Math.abs(dias)}d`, cor: "#c62828" };
    if (dias <= 3) return { texto: `GF vence em ${dias}d`, cor: "#b57a12" };
  }
  return { texto: `GF ${nota.gfNumero}`, cor: "#6b6b68" };
}

function RelatorioNfeModal({ onFechar }) {
  const hoje = new Date().toISOString().slice(0, 10);
  const primeiroDia = `${hoje.slice(0, 8)}01`;

  const { items: clientes } = useApiCollection("clientes");
  const [filtro, setFiltro] = useState({ de: primeiroDia, ate: hoje, destinatarioId: "", status: "autorizado" });
  const [dadosAtuais, setDados] = useState(null);
  const [erro, setErro] = useState("");
  const [carregando, setCarregando] = useState(false);

  const [baixando, setBaixando] = useState(false);

  // O zip é montado no servidor, que busca cada XML no provedor. Pode levar
  // alguns segundos num mês cheio.
  const baixarXmls = async () => {
    setErro(""); setBaixando(true);
    try {
      const params = new URLSearchParams({ de: filtro.de, ate: filtro.ate, status: filtro.status });
      await apiDownload(`/relatorios/nfe/xmls?${params}`, `XMLs-NFe-${filtro.de}-a-${filtro.ate}.zip`);
    } catch (e) {
      setErro(e.message);
    } finally { setBaixando(false); }
  };

  // Gerar já manda para a impressão: a tela intermediária com a lista era
  // um passo a mais para ver a mesma coisa que sai no papel.
  const gerar = async () => {
    setErro(""); setCarregando(true);
    try {
      const params = new URLSearchParams({
        de: filtro.de,
        ate: filtro.ate,
        ...(filtro.destinatarioId ? { destinatarioId: filtro.destinatarioId } : {}),
        status: filtro.status,
      });
      const resultado = await apiRequest(`/relatorios/nfe?${params}`);
      setDados(resultado);
      if (!resultado.linhas.length) {
        setErro("Nenhuma nota encontrada nesse período.");
        return;
      }
      imprimir(resultado);
    } catch (e) {
      setErro([e.message, e.detalhe].filter(Boolean).join(" — "));
      setDados(null);
    } finally { setCarregando(false); }
  };

  const dataBr = (iso) => new Date(iso).toLocaleDateString("pt-BR", { timeZone: "America/Cuiaba" });

  const imprimir = (resultado) => {
    const dados = resultado || dadosAtuais;
    if (!dados) return;
    const cliente = clientes?.find(c => String(c.id) === String(filtro.destinatarioId));
    const janela = window.open("", "_blank");
    if (!janela) { alert("O navegador bloqueou a janela de impressão. Libere pop-ups para este site."); return; }

    const linhas = dados.linhas.map(l => `
      <tr${l.status === "cancelado" ? ' class="cancelada"' : ""}>
        <td>${l.numero || "—"}/${l.serie || "—"}</td>
        <td>${dataBr(l.dataEmissao)}</td>
        <td>${l.cliente}</td>
        <td class="doc">${l.documentoCliente || ""}</td>
        <td>${l.naturezaOperacao || ""}</td>
        <td class="num">${l.status === "cancelado" ? "CANCELADA" : `R$ ${formatarMoeda(l.valorTotal)}`}</td>
      </tr>`).join("");

    const porCliente = dados.porCliente.map(c => `
      <tr><td>${c.cliente}</td><td class="doc">${c.documento || ""}</td>
      <td class="num">${c.notas}</td><td class="num">R$ ${formatarMoeda(c.valor)}</td></tr>`).join("");

    janela.document.write(`
      <html><head><meta charset="utf-8"><title>Relação de NF-e</title>
      <style>
        @page { size: A4; margin: 14mm; }
        body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; color: #23231F; font-size: 11px; }
        h1 { font-size: 15px; margin: 0 0 2px; }
        .sub { color: #6B6B68; font-size: 11px; margin-bottom: 14px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 18px; }
        th { text-align: left; font-size: 10px; text-transform: uppercase; letter-spacing: .3px;
             color: #55534C; border-bottom: 1px solid #23231F; padding: 5px 4px; }
        td { padding: 4px; border-bottom: 1px solid #E5E3DA; }
        .num { text-align: right; white-space: nowrap; }
        .doc { color: #6B6B68; white-space: nowrap; }
        .cancelada td { color: #9A9A96; text-decoration: line-through; }
        .totais { margin-top: 10px; font-size: 12px; }
        .totais strong { font-size: 14px; }
        h2 { font-size: 12px; margin: 18px 0 6px; }
        tfoot td { font-weight: 600; border-top: 1px solid #23231F; }
      </style></head><body>
        <h1>Relação de notas fiscais emitidas</h1>
        <div class="sub">
          Período de ${dataBr(`${filtro.de}T12:00:00Z`)} a ${dataBr(`${filtro.ate}T12:00:00Z`)}
          ${cliente ? ` · Cliente: ${cliente.nome}` : ""}
          · Emitido em ${new Date().toLocaleString("pt-BR", { timeZone: "America/Cuiaba" })}
        </div>

        <table>
          <thead><tr>
            <th>Número/Série</th><th>Emissão</th><th>Cliente</th><th>CNPJ/CPF</th>
            <th>Natureza</th><th class="num">Valor</th>
          </tr></thead>
          <tbody>${linhas || '<tr><td colspan="6">Nenhuma nota no período.</td></tr>'}</tbody>
        </table>

        <div class="totais">
          ${dados.totais.autorizadas} nota(s) autorizada(s)${dados.totais.canceladas ? ` · ${dados.totais.canceladas} cancelada(s)` : ""}
          — total <strong>R$ ${formatarMoeda(dados.totais.valorTotal)}</strong>
        </div>

        ${dados.porCliente.length > 1 ? `
          <h2>Resumo por cliente</h2>
          <table>
            <thead><tr><th>Cliente</th><th>CNPJ/CPF</th><th class="num">Notas</th><th class="num">Valor</th></tr></thead>
            <tbody>${porCliente}</tbody>
            <tfoot><tr><td colspan="2">Total</td>
              <td class="num">${dados.totais.autorizadas}</td>
              <td class="num">R$ ${formatarMoeda(dados.totais.valorTotal)}</td></tr></tfoot>
          </table>` : ""}
      </body></html>`);
    janela.document.close();
    janela.focus();
    setTimeout(() => janela.print(), 250);
  };

  return (
    <div className="modal-backdrop">
      <div className="modal" style={{ maxWidth: 720 }}>
      <div className="modal-header">
        <h3>Relação de NF-e emitidas</h3>
        <button className="icon-btn" onClick={onFechar} aria-label="Fechar"><X size={18} /></button>
      </div>
      <div className="modal-body">
      <div className="nf-section">
        <div className="nf-grid-3">
          <div className="field-group">
            <label className="field-label">De</label>
            <input type="date" value={filtro.de} onChange={e => setFiltro(f => ({ ...f, de: e.target.value }))} />
          </div>
          <div className="field-group">
            <label className="field-label">Até</label>
            <input type="date" value={filtro.ate} onChange={e => setFiltro(f => ({ ...f, ate: e.target.value }))} />
          </div>
          <div className="field-group">
            <label className="field-label">Status</label>
            {/* Substitui a caixa de "mostrar canceladas": aqui dá para
                pedir só as canceladas, que é o caso de conferência. */}
            <select value={filtro.status} onChange={e => setFiltro(f => ({ ...f, status: e.target.value }))}>
              <option value="autorizado">Autorizadas</option>
              <option value="cancelado">Canceladas</option>
              <option value="todas">Todas</option>
            </select>
          </div>
        </div>

        <div className="field-group">
          <label className="field-label">Cliente</label>
          <select value={filtro.destinatarioId} onChange={e => setFiltro(f => ({ ...f, destinatarioId: e.target.value }))}>
            <option value="">Todos</option>
            {(clientes || []).map(c => <option key={c.id} value={c.id}>{rotuloPessoa(c)}</option>)}
          </select>
        </div>

        <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
          <button className="btn btn-primary" onClick={gerar} disabled={carregando}>
            {carregando ? "Buscando…" : "Gerar"}
          </button>
          {dadosAtuais && <button className="btn" onClick={() => imprimir()}>Imprimir de novo</button>}
          {/* Pacote de XMLs: é o que o contador pede todo mês. */}
          <button className="btn" onClick={baixarXmls} disabled={baixando}>
            {baixando ? "Compactando…" : "Baixar XMLs do período"}
          </button>
        </div>
      </div>

      {erro && <p className="error-text">{erro}</p>}

      </div>
      <div className="modal-footer">
        <button className="btn" onClick={onFechar}>Fechar</button>
      </div>
      </div>
    </div>
  );
}
