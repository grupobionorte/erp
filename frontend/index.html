const CST_ICMS = [

const emptyEndereco = { cep: "", logradouro: "", numero: "", complemento: "", bairro: "", cidade: "", uf: "MT" };

// ---------- Máscaras (CPF, CNPJ, CEP) ----------
// Aplicadas conforme o usuário digita: guardamos só os dígitos por baixo,
// mas mostramos com pontos/traço/barra formatados.
function formatCPF(v) {
  const d = v.replace(/\D/g, "").slice(0, 11);
  if (d.length > 9) return `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6,9)}-${d.slice(9)}`;
  if (d.length > 6) return `${d.slice(0,3)}.${d.slice(3,6)}.${d.slice(6)}`;
  if (d.length > 3) return `${d.slice(0,3)}.${d.slice(3)}`;
  return d;
}
function formatCNPJ(v) {
  const d = v.replace(/\D/g, "").slice(0, 14);
  if (d.length > 12) return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12)}`;
  if (d.length > 8) return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8)}`;
  if (d.length > 5) return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5)}`;
  if (d.length > 2) return `${d.slice(0,2)}.${d.slice(2)}`;
  return d;
}
// Campo "documento" aceita CPF ou CNPJ: enquanto tiver 11 dígitos ou menos
// formata como CPF; passando disso, assume que é CNPJ.
function formatDocumento(v) {
  const d = v.replace(/\D/g, "");
  return d.length > 11 ? formatCNPJ(v) : formatCPF(v);
}
function formatCEP(v) {
  const d = v.replace(/\D/g, "").slice(0, 8);
  if (d.length > 5) return `${d.slice(0,5)}-${d.slice(5)}`;
  return d;
}

function mapEndereco(endereco) {
  if (!endereco) return emptyEndereco;
  const { cep, logradouro, numero, complemento, bairro, cidade, uf } = endereco;
  return { cep: cep || "", logradouro: logradouro || "", numero: numero || "", complemento: complemento || "", bairro: bairro || "", cidade: cidade || "", uf: uf || "MT" };
}

// Token fica no localStorage do navegador só desse artifact — cada pessoa
// que abrir precisa logar com seu próprio usuário.
function getToken() {
  try { return localStorage.getItem("erpBiomassaToken"); } catch { return null; }
}
function setToken(token) {
  try {
    if (token) localStorage.setItem("erpBiomassaToken", token);
    else localStorage.removeItem("erpBiomassaToken");
  } catch { /* localStorage indisponível — sessão não persiste ao recarregar */ }
}

async function apiRequest(path, options = {}) {
  const token = getToken();
  const res = await fetch(`${API_BASE_URL}${path}`, {
    ...options,
    headers: {
      "Content-Type": "application/json",
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
      ...(options.headers || {}),
    },
  });
  if (res.status === 401) {
    setToken(null);
    window.dispatchEvent(new Event("erp-sessao-expirada"));
  }
  if (!res.ok) {
    let detalhe = res.statusText;
    let detalheProvedor;
    try {
      const corpo = await res.json();
      detalhe = corpo.erro || detalhe;
      detalheProvedor = corpo.detalhe;
    } catch {
      // resposta sem corpo JSON
    }
    const erro = new Error(detalhe);
    erro.detalhe = detalheProvedor;
    throw erro;
  }
  if (res.status === 204) return null;
  return res.json();
}

// Busca, cria, edita e apaga usando o backend real — nada fica só no
// navegador, então qualquer pessoa que abrir esse artifact e apontar pro
// mesmo backend vê os mesmos dados.
function useApiCollection(moduleKey) {
  const config = MODULES[moduleKey];
  const [items, setItems] = useState(null);
  const [erro, setErro] = useState(null);

  const carregar = useCallback(async () => {
    try {
      setErro(null);
      const query = config.listQuery ? `?${config.listQuery}` : "";
      const dados = await apiRequest(`${config.apiPath}${query}`);
      setItems(dados.map(config.fromApi));
    } catch (e) {
      setErro(e.message);
      setItems([]);
    }
  }, [moduleKey]);

  useEffect(() => { carregar(); }, [carregar]);

  const criar = useCallback(async (data) => {
    const registro = await apiRequest(config.createPath || config.apiPath, {
      method: "POST",
      body: JSON.stringify(config.toApi(data)),
    });
    setItems((atual) => [...(atual || []), config.fromApi(registro)]);
  }, [moduleKey]);

  const editar = useCallback(async (id, data) => {
    const registro = await apiRequest(`${config.apiPath}/${id}`, {
      method: "PUT",
      body: JSON.stringify(config.toApi(data)),
    });
    setItems((atual) => atual.map((it) => (it.id === id ? config.fromApi(registro) : it)));
  }, [moduleKey]);

  const remover = useCallback(async (id) => {
    await apiRequest(`${config.apiPath}/${id}`, { method: "DELETE" });
    setItems((atual) => atual.filter((it) => it.id !== id));
  }, [moduleKey]);

  return { items, erro, recarregar: carregar, criar, editar, remover };
}

function NcmField({ value, onChange }) {
  const [sugestoes, setSugestoes] = useState([]);
  const [aberto, setAberto] = useState(false);
  const [buscando, setBuscando] = useState(false);

  useEffect(() => {
    if (!value || value.length < 2) { setSugestoes([]); return; }
    const espera = setTimeout(async () => {
      setBuscando(true);
      try {
        const resultado = await apiRequest(`/ncms?busca=${encodeURIComponent(value)}`);
        setSugestoes(resultado);
      } catch {
        setSugestoes([]);
      } finally {
        setBuscando(false);
      }
    }, 350);
    return () => clearTimeout(espera);
  }, [value]);

  return (
    <div className="ncm-field">
      <input
        value={value ?? ""}
        onChange={e => { onChange(e.target.value); setAberto(true); }}
        onFocus={() => setAberto(true)}
        onBlur={() => setTimeout(() => setAberto(false), 150)}
        placeholder="Digite o código ou parte da descrição"
      />
      {aberto && (buscando || sugestoes.length > 0) && (
        <div className="ncm-suggestions">
          {buscando && <div className="ncm-suggestion-loading">Buscando…</div>}
          {sugestoes.map(s => (
            <button
              key={s.codigo}
              type="button"
              className="ncm-suggestion"
              onMouseDown={() => { onChange(s.codigo); setAberto(false); }}
            >
              <span className="ncm-codigo">{s.codigo}</span>
              <span className="ncm-descricao">{s.descricao}</span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function Field({ field, value, onChange, disabled }) {
  if (field.type === "endereco") {
    const v = value || emptyEndereco;
    const [buscandoCep, setBuscandoCep] = useState(false);
    const set = (k, val) => onChange({ ...v, [k]: val });

    // Assim que o CEP tem 8 dígitos, busca o endereço na base pública dos
    // Correios (ViaCEP) e preenche rua, bairro, cidade e UF sozinho — o
    // usuário só confere e completa o número.
    const buscarPorCep = async (cepDigitado) => {
      const digitos = cepDigitado.replace(/\D/g, "");
      set("cep", cepDigitado);
      if (digitos.length !== 8) return;
      setBuscandoCep(true);
      try {
        const res = await fetch(`https://viacep.com.br/ws/${digitos}/json/`);
        const dados = await res.json();
        if (!dados.erro) {
          onChange({
            ...v,
            cep: cepDigitado,
            logradouro: dados.logradouro || v.logradouro,
            bairro: dados.bairro || v.bairro,
            cidade: dados.localidade || v.cidade,
            uf: dados.uf || v.uf,
          });
        }
      } catch {
        // sem internet ou CEP inválido — usuário preenche na mão mesmo
      } finally {
        setBuscandoCep(false);
      }
    };

    return (
      <div className="field-group">
        <label className="field-label">{field.label}</label>
        <div className="endereco-grid">
          <input placeholder={buscandoCep ? "Buscando…" : "CEP"} value={v.cep} onChange={e => buscarPorCep(formatCEP(e.target.value))} maxLength={9} />
          <input placeholder="Logradouro" value={v.logradouro} onChange={e => set("logradouro", e.target.value)} className="col-span-2" />
          <input placeholder="Número" value={v.numero} onChange={e => set("numero", e.target.value)} />
          <input placeholder="Complemento" value={v.complemento} onChange={e => set("complemento", e.target.value)} />
          <input placeholder="Bairro" value={v.bairro} onChange={e => set("bairro", e.target.value)} />
          <input placeholder="Cidade" value={v.cidade} onChange={e => set("cidade", e.target.value)} />
          <select value={v.uf} onChange={e => set("uf", e.target.value)}>
            {UFS.map(uf => <option key={uf} value={uf}>{uf}</option>)}
          </select>
        </div>
      </div>
    );
  }

  if (field.type === "imagem-upload") {
    const [erroUpload, setErroUpload] = useState("");
    const inputRef = React.useRef(null);

    const selecionarArquivo = (e) => {
      const arquivo = e.target.files?.[0];
      if (!arquivo) return;
      if (!arquivo.type.startsWith("image/")) {
        setErroUpload("Escolha um arquivo de imagem.");
        return;
      }
      if (arquivo.size > 2 * 1024 * 1024) {
        setErroUpload("A imagem precisa ter até 2 MB.");
        return;
      }
      setErroUpload("");
      const leitor = new FileReader();
      leitor.onload = () => onChange(leitor.result);
      leitor.readAsDataURL(arquivo);
    };

    return (
      <div className="field-group">
        <label className="field-label">{field.label}</label>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <div style={{
            width: 56, height: 56, borderRadius: 8, border: "1px solid #e5e3da",
            display: "flex", alignItems: "center", justifyContent: "center",
            overflow: "hidden", background: "#fafaf8", flexShrink: 0,
          }}>
            {value
              ? <img src={value} alt="Logo da empresa" style={{ width: "100%", height: "100%", objectFit: "contain" }} />
              : <Building2 size={22} color="#b4b2a9" />}
          </div>
          <div>
            <button type="button" className="btn" onClick={() => inputRef.current?.click()}>
              {value ? "Trocar imagem" : "Escolher imagem"}
            </button>
            {value && (
              <button type="button" className="btn" style={{ marginLeft: 8 }} onClick={() => onChange("")}>
                Remover
              </button>
            )}
            <input ref={inputRef} type="file" accept="image/*" onChange={selecionarArquivo} style={{ display: "none" }} />
          </div>
        </div>
        {erroUpload && <p className="error-text">{erroUpload}</p>}
        <p className="hint">PNG ou JPG, até 2 MB. Aparece na tela de login.</p>
      </div>
    );
  }

  if (field.type === "empresas-multiselect") {
    const [opcoes, setOpcoes] = useState(null);
    useEffect(() => {
      let cancelado = false;
      apiRequest("/empresas")
        .then((dados) => { if (!cancelado) setOpcoes(dados); })
        .catch(() => { if (!cancelado) setOpcoes([]); });
      return () => { cancelado = true; };
    }, []);
    const selecionadas = value || [];
    const toggle = (id) => {
      onChange(selecionadas.includes(id) ? selecionadas.filter(x => x !== id) : [...selecionadas, id]);
    };
    return (
      <div className="field-group">
        <label className="field-label">{field.label}</label>
        <div className="checklist">
          {opcoes === null && <p className="hint">Carregando…</p>}
          {opcoes?.length === 0 && <p className="hint">Nenhuma empresa cadastrada ainda.</p>}
          {(opcoes || []).map(emp => (
            <label key={emp.id} className="checklist-item">
              <input type="checkbox" checked={selecionadas.includes(emp.id)} onChange={() => toggle(emp.id)} />
              {emp.razaoSocial}
            </label>
          ))}
        </div>
        <p className="hint">Só vale pra usuários com papel Operador — Admin acessa todas as empresas automaticamente.</p>
      </div>
    );
  }

  if (field.type === "transportadora-select") {
    const [opcoes, setOpcoes] = useState(null);
    useEffect(() => {
      let cancelado = false;
      apiRequest("/transportadoras")
        .then((dados) => { if (!cancelado) setOpcoes(dados); })
        .catch(() => { if (!cancelado) setOpcoes([]); });
      return () => { cancelado = true; };
    }, []);
    return (
      <div className="field-group">
        <label className="field-label">{field.label}{field.required && <span className="req">*</span>}</label>
        <select value={value ?? ""} onChange={e => onChange(e.target.value)}>
          <option value="">{opcoes === null ? "Carregando…" : "Selecione…"}</option>
          {(opcoes || []).map(t => <option key={t.id} value={t.id}>{t.razaoSocial}</option>)}
        </select>
        {opcoes?.length === 0 && <p className="hint">Nenhuma transportadora cadastrada ainda.</p>}
      </div>
    );
  }

  if (field.type === "ncm-busca") {
    return (
      <div className="field-group">
        <label className="field-label">{field.label}{field.required && <span className="req">*</span>}</label>
        <NcmField value={value} onChange={onChange} />
      </div>
    );
  }

  if (field.type === "cfop-busca") {
    return (
      <div className="field-group">
        <label className="field-label">{field.label}{field.required && <span className="req">*</span>}</label>
        <CfopField value={value} onChange={onChange} />
      </div>
    );
  }

  return (
    <div className="field-group">
      <label className="field-label">{field.label}{field.required && <span className="req">*</span>}</label>
      {field.type === "select" ? (
        <select value={value ?? field.default ?? ""} onChange={e => onChange(e.target.value)} disabled={disabled}>
          <option value="">Selecione…</option>
          {field.options.map(opt => {
            const valorOpcao = typeof opt === "object" ? opt.value : opt;
            const rotuloOpcao = typeof opt === "object" ? opt.label : opt;
            return <option key={valorOpcao} value={valorOpcao}>{rotuloOpcao}</option>;
          })}
        </select>
      ) : (
        <input
          type={field.type === "number" ? "number" : field.type === "date" ? "date" : field.type === "password" ? "password" : "text"}
          value={value ?? ""}
          disabled={disabled}
          maxLength={field.key === "documento" || field.key === "cnpj" ? 18 : field.key === "cpf" ? 14 : undefined}
          onChange={e => {
            const raw = e.target.value;
            if (field.key === "documento") onChange(formatDocumento(raw));
            else if (field.key === "cnpj") onChange(formatCNPJ(raw));
            else if (field.key === "cpf") onChange(formatCPF(raw));
            else if (field.key === "placa") onChange(raw.toUpperCase());
            else onChange(raw);
          }}
        />
      )}
    </div>
  );
}

function RecordForm({ moduleKey, record, onSave, onCancel }) {
  const config = MODULES[moduleKey];
  const editando = !!record?.id;
  // Alguns campos só fazem sentido na criação (ex: senha de um usuário
  // novo) — escondemos eles ao editar um registro existente.
  const camposVisiveis = config.fields.filter(f => !(f.hideOnEdit && editando));
  const [data, setData] = useState(() => record || {});
  const [error, setError] = useState("");
  const [salvando, setSalvando] = useState(false);

  const setField = (key, value) => setData(d => ({ ...d, [key]: value }));

  const handleSubmit = async () => {
    const missing = camposVisiveis.filter(f => f.required && !data[f.key]);
    if (missing.length) {
      setError(`Preencha: ${missing.map(f => f.label).join(", ")}`);
      return;
    }
    setError("");
    setSalvando(true);
    try {
      await onSave(data);
    } catch (e) {
      setError(e.message || "Erro ao salvar no servidor");
    } finally {
      setSalvando(false);
    }
  };

  return (
    <div className="modal-backdrop">
      <div className="modal" style={{ width: 920, maxWidth: "96vw" }}>
        <div className="modal-header">
          <h3>{editando ? "Editar" : "Novo"} {config.label.replace(/s$/, "")}</h3>
          <button className="icon-btn" onClick={onCancel} aria-label="Fechar"><X size={18} /></button>
        </div>
        <div className="modal-body">
          <div className="cadastro-fields-grid">
            {camposVisiveis.map(f => (
              <div
                key={f.key}
                style={["endereco", "empresas-multiselect", "imagem-upload"].includes(f.type) ? { gridColumn: "1 / -1" } : undefined}
              >
                <Field
                  field={f}
                  value={data[f.key]}
                  onChange={v => setField(f.key, v)}
                  disabled={f.readOnlyOnEdit && editando}
                />
              </div>
            ))}
          </div>
          {error && <p className="error-text">{error}</p>}
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onCancel} disabled={salvando}>Cancelar</button>
          <button className="btn btn-primary" onClick={handleSubmit} disabled={salvando}>
            {salvando ? "Salvando…" : "Salvar"}
          </button>
        </div>
      </div>
    </div>
  );
}

function LoginScreen({ onLogin }) {
  const EMAIL_LEMBRADO_KEY = "erpBiomassaEmailLembrado";
  const EMPRESA_LEMBRADA_KEY = "erpBiomassaEmpresaId";

  const [email, setEmail] = useState(() => {
    try { return localStorage.getItem(EMAIL_LEMBRADO_KEY) || ""; } catch { return ""; }
  });
  const [lembrarEmail, setLembrarEmail] = useState(() => {
    try { return !!localStorage.getItem(EMAIL_LEMBRADO_KEY); } catch { return false; }
  });
  const [senha, setSenha] = useState("");
  const [mostrarSenha, setMostrarSenha] = useState(false);
  const [erro, setErro] = useState("");
  const [carregando, setCarregando] = useState(false);

  // "credenciais" = só e-mail e senha visíveis. Depois do primeiro clique em
  // "Entrar", se o usuário tiver acesso a alguma empresa, o campo de empresa
  // aparece logo abaixo (mesma tela, mesmo formulário) e vira "empresa".
  const [fase, setFase] = useState("credenciais");
  const [empresasParaEscolher, setEmpresasParaEscolher] = useState(null);
  const [resultadoPendente, setResultadoPendente] = useState(null);
  const [empresaId, setEmpresaId] = useState(() => {
    try { return localStorage.getItem(EMPRESA_LEMBRADA_KEY) || ""; } catch { return ""; }
  });

  // Mostra a logo da empresa lembrada (do último login neste navegador)
  // já na tela inicial, antes mesmo de digitar e-mail/senha.
  const [logoEmpresa, setLogoEmpresa] = useState(null);
  useEffect(() => {
    if (!empresaId) return;
    let cancelado = false;
    apiRequest(`/auth/empresas/${empresaId}/logo`)
      .then((dados) => { if (!cancelado && dados.logoUrl) setLogoEmpresa(dados.logoUrl); })
      .catch(() => {});
    return () => { cancelado = true; };
  }, []);

  // Se a pessoa voltar a mexer no e-mail ou na senha depois de já ter
  // visto o seletor de empresa, invalida a verificação anterior — as
  // empresas liberadas dependem de qual usuário está logando.
  function editarCredencial(setter) {
    return (valor) => {
      setter(valor);
      if (fase !== "credenciais") {
        setFase("credenciais");
        setEmpresasParaEscolher(null);
        setResultadoPendente(null);
        setErro("");
      }
    };
  }

  function finalizarLogin(resultado) {
    setToken(resultado.token);
    try {
      if (lembrarEmail) localStorage.setItem(EMAIL_LEMBRADO_KEY, email);
      else localStorage.removeItem(EMAIL_LEMBRADO_KEY);
      if (resultado.empresa?.id) localStorage.setItem(EMPRESA_LEMBRADA_KEY, String(resultado.empresa.id));
    } catch { /* localStorage indisponível — segue sem lembrar */ }
    onLogin({ ...resultado.usuario, empresa: resultado.empresa || null });
  }

  const enviar = async (e) => {
    e.preventDefault();
    setErro("");
    setCarregando(true);
    try {
      if (fase === "credenciais") {
        // Primeiro clique: confere e-mail/senha e descobre quais empresas
        // esse usuário pode acessar.
        const resultado = await apiRequest("/auth/login", {
          method: "POST",
          body: JSON.stringify({ email, senha }),
        });

        if (resultado.requerEmpresa) {
          const lembrada = (() => { try { return localStorage.getItem(EMPRESA_LEMBRADA_KEY); } catch { return null; } })();
          setEmpresasParaEscolher(resultado.empresas);
          setEmpresaId(resultado.empresas.some(emp => String(emp.id) === lembrada) ? lembrada : "");
          setFase("empresa");
        } else if (resultado.empresa) {
          // Só uma empresa disponível — mostra ela já selecionada e guarda
          // o login (já confirmado) pra concluir no próximo clique, sem
          // precisar checar a senha de novo.
          setEmpresasParaEscolher([resultado.empresa]);
          setEmpresaId(String(resultado.empresa.id));
          setResultadoPendente(resultado);
          setFase("empresa");
        } else {
          // Nenhuma empresa cadastrada no sistema ainda — entra direto.
          finalizarLogin(resultado);
        }
      } else {
        // Segundo clique: empresa escolhida.
        if (!empresaId) {
          setErro("Selecione uma empresa para continuar.");
          setCarregando(false);
          return;
        }
        if (resultadoPendente) {
          finalizarLogin(resultadoPendente);
        } else {
          const resultado = await apiRequest("/auth/login", {
            method: "POST",
            body: JSON.stringify({ email, senha, empresaId: Number(empresaId) }),
          });
          finalizarLogin(resultado);
        }
      }
    } catch (e2) {
      setErro(e2.message === "Credenciais inválidas" ? "E-mail ou senha incorretos." : e2.message);
    } finally {
      setCarregando(false);
    }
  };

  return (
    <div className="login-wrap">
      <style>{`
        .login-wrap {
          display: flex; min-height: 600px; width: 100%;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          -webkit-font-smoothing: antialiased;
        }
        .login-brand { flex: 1; background: #1F3B57; color: #fff; display: flex; flex-direction: column; justify-content: center; padding: 3rem 2.5rem; }
        .login-brand-mark { width: 360px; height: 360px; max-width: 85%; border-radius: 24px; background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; margin: 0 auto; color: #fff; }
        .login-brand-title { font-size: 25px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 18px; text-align: center; }

        .login-form-side { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; background: #fff; border: 1.5px solid #00923F; box-sizing: border-box; }
        .login-card { width: 340px; max-width: 100%; }
        .login-heading { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 6px; color: #1F3B57; }
        .login-subtitle { font-size: 13.5px; color: #6b6b68; margin: 0 0 28px; line-height: 1.5; }

        .login-field { margin-bottom: 18px; }
        .login-label { display: block; font-size: 13px; font-weight: 500; color: #33332f; margin-bottom: 6px; }
        .login-input {
          width: 100%; box-sizing: border-box; padding: 11px 12px; font-size: 14px;
          border-radius: 8px; border: 1px solid #d6d3c8; background: #fff; color: #1a1a1a;
          font-family: inherit; transition: border-color 0.15s, box-shadow 0.15s;
        }
        .login-input:focus { outline: none; border-color: #00923F; box-shadow: 0 0 0 3px rgba(0,146,63,0.12); }
        .login-password-wrap { position: relative; }
        .login-password-wrap .login-input { padding-right: 40px; }
        .login-password-toggle {
          position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
          border: none; background: none; cursor: pointer; color: #8a887f; padding: 8px;
          display: flex; border-radius: 6px;
        }
        .login-password-toggle:hover { color: #1F3B57; background: #f1efe8; }

        .login-remember { display: flex; align-items: center; gap: 8px; margin: -6px 0 20px; user-select: none; cursor: pointer; }
        .login-remember input { width: 15px; height: 15px; accent-color: #00923F; cursor: pointer; }
        .login-remember span { font-size: 13px; color: #55534c; }

        .login-error { color: #a32d2d; font-size: 13px; margin: -8px 0 16px; }
        .login-submit {
          width: 100%; padding: 11px 14px; border-radius: 8px; border: none;
          background: #00923F; color: #fff; font-size: 14px; font-weight: 600;
          cursor: pointer; transition: background 0.15s;
        }
        .login-submit:hover:not(:disabled) { background: #00732F; }
        .login-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        @media (max-width: 640px) { .login-brand { display: none; } }
      `}</style>

      <div className="login-brand">
        <h1 className="login-brand-title">Biomassa ERP</h1>
        <div className="login-brand-mark">
          {logoEmpresa ? <img src={logoEmpresa} alt="Logo da empresa" style={{ width: "100%", height: "100%", objectFit: "contain", borderRadius: 24 }} /> : <Leaf size={96} />}
        </div>
      </div>

      <div className="login-form-side">
        <form className="login-card" onSubmit={enviar}>
          <h2 className="login-heading">Entrar</h2>
          <p className="login-subtitle">Use seu e-mail e senha cadastrados.</p>

          <div className="login-field">
            <label className="login-label">E-mail</label>
            <input
              className="login-input"
              type="email"
              value={email}
              onChange={e => editarCredencial(setEmail)(e.target.value)}
              required
              autoFocus
            />
          </div>

          <div className="login-field">
            <label className="login-label">Senha</label>
            <div className="login-password-wrap">
              <input
                className="login-input"
                type={mostrarSenha ? "text" : "password"}
                value={senha}
                onChange={e => editarCredencial(setSenha)(e.target.value)}
                required
              />
              <button
                type="button"
                className="login-password-toggle"
                onClick={() => setMostrarSenha(v => !v)}
                aria-label={mostrarSenha ? "Ocultar senha" : "Mostrar senha"}
              >
                {mostrarSenha ? <EyeOff size={16} /> : <Eye size={16} />}
              </button>
            </div>
          </div>

          {fase === "empresa" && (
            <div className="login-field">
              <label className="login-label">Empresa</label>
              <select
                className="login-input"
                value={empresaId}
                onChange={e => {
                  setEmpresaId(e.target.value);
                  const escolhida = empresasParaEscolher.find(emp => String(emp.id) === e.target.value);
                  setLogoEmpresa(escolhida?.logoUrl || null);
                }}
                required
                autoFocus
              >
                <option value="">Selecione…</option>
                {empresasParaEscolher.map(emp => <option key={emp.id} value={emp.id}>{emp.razaoSocial}</option>)}
              </select>
            </div>
          )}

          {fase === "credenciais" && (
            <label className="login-remember">
              <input type="checkbox" checked={lembrarEmail} onChange={e => setLembrarEmail(e.target.checked)} />
              <span>Lembrar meu e-mail</span>
            </label>
          )}

          {erro && <p className="login-error">{erro}</p>}

          <button className="login-submit" type="submit" disabled={carregando}>
            {carregando ? "Entrando…" : fase === "empresa" ? "Entrar" : "Continuar"}
          </button>
        </form>
      </div>
    </div>
  );
}

function ModuleView({ moduleKey }) {
  const config = MODULES[moduleKey];
  const Icon = config.icon;
  const colors = COLOR_MAP[config.color];
  const { items, erro, recarregar, criar, editar, remover } = useApiCollection(moduleKey);
  const [query, setQuery] = useState("");
  const [editing, setEditing] = useState(null);
  const [showForm, setShowForm] = useState(false);

  if (items === null) {
    return <div className="loading">Carregando {config.label.toLowerCase()}… (o servidor pode levar alguns segundos pra acordar)</div>;
  }

  const filtered = items.filter(it => {
    if (!query) return true;
    const hay = JSON.stringify(it).toLowerCase();
    return hay.includes(query.toLowerCase());
  });

  const handleSave = async (data) => {
    if (data.id) {
      await editar(data.id, data);
    } else {
      await criar(data);
    }
    setShowForm(false);
    setEditing(null);
  };

  const handleDelete = async (id) => {
    try {
      await remover(id);
    } catch (e) {
      alert(`Não foi possível excluir: ${e.message}`);
    }
  };

  return (
    <div>
      <div className="view-header">
        <div className="view-title">
          <div className="icon-badge" style={{ background: colors.bg, color: colors.text }}>
            <Icon size={20} />
          </div>
          <div>
            <h2>{config.label}</h2>
            <p className="subtle">{items.length} cadastro{items.length !== 1 ? "s" : ""}</p>
          </div>
        </div>
        <button className="btn btn-primary" onClick={() => { setEditing(null); setShowForm(true); }}>
          <Plus size={16} /> Novo
        </button>
      </div>

      {erro && (
        <div className="error-banner">
          <AlertCircle size={16} />
          <span>Não consegui falar com o servidor: {erro}. <button className="link-btn" onClick={recarregar}>Tentar de novo</button></span>
        </div>
      )}

      <div className="search-bar">
        <Search size={16} className="search-icon" />
        <input placeholder={`Buscar em ${config.label.toLowerCase()}…`} value={query} onChange={e => setQuery(e.target.value)} />
      </div>

      {filtered.length === 0 ? (
        <div className="empty-state">
          <Icon size={32} strokeWidth={1.5} />
          <p>{items.length === 0 ? `Nenhum cadastro ainda.` : `Nada encontrado para "${query}".`}</p>
          {items.length === 0 && (
            <button className="btn btn-primary" onClick={() => setShowForm(true)}>
              <Plus size={16} /> Criar o primeiro
            </button>
          )}
        </div>
      ) : (
        <table className="data-table">
          <thead>
            <tr>
              {config.columns.map(col => (
                <th key={col}>{config.fields.find(f => f.key === col.split(".")[0])?.label || COLUMN_LABELS[col] || col}</th>
              ))}
              <th className="actions-col"></th>
            </tr>
          </thead>
          <tbody>
            {filtered.map(item => (
              <tr key={item.id}>
                {config.columns.map(col => (
                  <td key={col}>{getPath(item, col) || "—"}</td>
                ))}
                <td className="actions-col">
                  <button className="icon-btn" onClick={() => { setEditing(item); setShowForm(true); }} aria-label="Editar">
                    <Pencil size={15} />
                  </button>
                  <button className="icon-btn icon-btn-danger" onClick={() => handleDelete(item.id)} aria-label="Excluir">
                    <Trash2 size={15} />
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      )}

      {showForm && (
        <RecordForm
          moduleKey={moduleKey}
          record={editing}
          onSave={handleSave}
          onCancel={() => { setShowForm(false); setEditing(null); }}
        />
      )}
    </div>
  );
}

function EmissaoView() {
  const { items: transportadoras } = useApiCollection("transportadoras");
  const [transportadoraId, setTransportadoraId] = useState("");
  const [gerado, setGerado] = useState(null);

  const podeGerar = !!transportadoraId;

  const gerarSimulacao = () => {
    const transp = (transportadoras || []).find(t => t.id === Number(transportadoraId));
    setGerado({
      tipo: "MDFe",
      numero: Math.floor(100000 + Math.random() * 900000),
      transportadora: transp,
      data: new Date().toLocaleDateString("pt-BR"),
    });
  };

  return (
    <div>
      <div className="view-header">
        <div className="view-title">
          <div className="icon-badge" style={{ background: "#faece7", color: "#712b13" }}>
            <FileText size={20} />
          </div>
          <div>
            <h2>Emissão de MDFe (simulação)</h2>
            <p className="subtle">Monta o documento a partir dos cadastros reais — sem envio à SEFAZ</p>
          </div>
        </div>
      </div>

      <div className="emissao-form">
        <div className="field-group">
          <label className="field-label">Transportadora</label>
          <select value={transportadoraId} onChange={e => setTransportadoraId(e.target.value)}>
            <option value="">Selecione uma transportadora…</option>
            {(transportadoras || []).map(t => <option key={t.id} value={t.id}>{t.nome}</option>)}
          </select>
          {transportadoras?.length === 0 && <p className="hint">Nenhuma transportadora cadastrada ainda.</p>}
        </div>

        <button className="btn btn-primary" disabled={!podeGerar} onClick={gerarSimulacao}>
          Gerar simulação de MDFe
        </button>
      </div>

      {gerado && (
        <div className="doc-preview">
          <div className="doc-preview-header">
            <p className="doc-tipo">{gerado.tipo} nº {gerado.numero}</p>
            <p className="subtle">{gerado.data}</p>
          </div>
          {gerado.transportadora && <p><strong>Transportadora:</strong> {gerado.transportadora.nome} — RNTRC {gerado.transportadora.rntrc || "—"}</p>}
          <p className="hint" style={{ marginTop: 12 }}>Documento simulado — não foi enviado à SEFAZ.</p>
        </div>
      )}
    </div>
  );
}

const MODALIDADES_FRETE = ["Sem frete", "Por conta do emitente", "Por conta do destinatário", "Por conta de terceiros"];
const FINALIDADES_OPERACAO = ["Normal", "Complementar", "Ajuste", "Devolução"];

const FORMAS_PAGAMENTO = ["Dinheiro", "Cartão de Crédito", "Cartão de Débito", "PIX", "Boleto", "Transferência Bancária", "Sem pagamento (a prazo)"];

function NotaFiscalForm({ nota, clientes, produtosDisponiveis, transportadoras, colaboradores, veiculos, onSave, onCancel }) {
  const hoje = new Date().toISOString().slice(0, 10);
  const [dataEmissao, setDataEmissao] = useState(nota?.dataEmissao ? nota.dataEmissao.slice(0, 10) : hoje);

  const [transportadoraId, setTransportadoraId] = useState(nota?.transportadoraId ? String(nota.transportadoraId) : "");
  const [naturezaOperacao, setNaturezaOperacao] = useState(nota?.naturezaOperacao || "Venda de mercadoria");
  const [modalidadeFrete, setModalidadeFrete] = useState(nota?.modalidadeFrete || "Sem frete");
  const [dataSaida, setDataSaida] = useState(nota?.dataSaida ? nota.dataSaida.slice(0, 10) : "");
  const [informacoesComplementares, setInformacoesComplementares] = useState(nota?.informacoesComplementares || "");
  const [finalidadeOperacao, setFinalidadeOperacao] = useState(nota?.finalidadeOperacao || "Normal");
  const [consumidorFinal, setConsumidorFinal] = useState(nota?.consumidorFinal ?? false);
  const [indicadorPresenca, setIndicadorPresenca] = useState(nota?.indicadorPresenca || "Não se aplica");
  const [formaPagamento, setFormaPagamento] = useState(nota?.formaPagamento || "Dinheiro");
  const [valorFrete, setValorFrete] = useState(nota?.valorFrete ?? "");
  const [valorSeguro, setValorSeguro] = useState(nota?.valorSeguro ?? "");
  const [valorDesconto, setValorDesconto] = useState(nota?.valorDesconto ?? "");
  const [quantidadeVolumes, setQuantidadeVolumes] = useState(nota?.quantidadeVolumes ?? "");
  const [especieVolumes, setEspecieVolumes] = useState(nota?.especieVolumes || "");
  const [pesoBrutoTotal, setPesoBrutoTotal] = useState(nota?.pesoBrutoTotal ?? "");
  const [pesoLiquidoTotal, setPesoLiquidoTotal] = useState(nota?.pesoLiquidoTotal ?? "");
  const [baseCalculoIcms, setBaseCalculoIcms] = useState(nota?.baseCalculoIcms ?? "");
  const [valorIcms, setValorIcms] = useState(nota?.valorIcms ?? "");
  const [baseCalculoIcmsSt, setBaseCalculoIcmsSt] = useState(nota?.baseCalculoIcmsSt ?? "");
  const [valorIcmsSt, setValorIcmsSt] = useState(nota?.valorIcmsSt ?? "");
  const [outrasDespesas, setOutrasDespesas] = useState(nota?.outrasDespesas ?? "");
  const [valorIpi, setValorIpi] = useState(nota?.valorIpi ?? "");
  const [itens, setItens] = useState(() =>
    nota?.itens?.length
      ? nota.itens.map(i => ({ produtoId: String(i.produtoId), quantidade: i.quantidade, valorUnitario: i.valorUnitario, cfopUtilizado: i.cfopUtilizado || "", ncmUtilizado: i.ncmUtilizado || "", cstUtilizado: i.cstUtilizado || "" }))
      : [{ produtoId: "", quantidade: 1, valorUnitario: "", cfopUtilizado: "", ncmUtilizado: "", cstUtilizado: "" }]
  );
  const [erro, setErro] = useState("");
  const [salvando, setSalvando] = useState(false);

  const atualizarItem = (index, campo, valor) => {
    setItens(prev => prev.map((it, i) => {
      if (i !== index) return it;
      const atualizado = { ...it, [campo]: valor };
      if (campo === "produtoId") {
        const produto = (produtosDisponiveis || []).find(p => String(p.id) === valor);
        if (produto) {
          atualizado.valorUnitario = produto.valorUnitario ?? "";
          atualizado.cfopUtilizado = produto.cfop || "";
          atualizado.ncmUtilizado = produto.ncm || "";
          atualizado.cstUtilizado = produto.cst || "";
        }
      }
      return atualizado;
    }));
  };

  const adicionarItem = () => setItens(prev => [...prev, { produtoId: "", quantidade: 1, valorUnitario: "", cfopUtilizado: "", ncmUtilizado: "", cstUtilizado: "" }]);
  const removerItem = (index) => setItens(prev => prev.length > 1 ? prev.filter((_, i) => i !== index) : prev);

  const totalItens = itens.reduce((soma, it) => soma + (Number(it.quantidade) || 0) * (Number(it.valorUnitario) || 0), 0);
  const valorTotalGeral = totalItens
    + (Number(valorFrete) || 0) + (Number(valorSeguro) || 0) - (Number(valorDesconto) || 0)
    + (Number(valorIpi) || 0) + (Number(outrasDespesas) || 0);

  const clienteSelecionado = (clientes || []).find(c => String(c.id) === destinatarioId);

  const salvar = async () => {
    if (!destinatarioId) { setErro("Selecione o cliente."); return; }
    const itensValidos = itens.filter(it => it.produtoId && Number(it.quantidade) > 0);
    if (itensValidos.length === 0) { setErro("Adicione pelo menos um item com produto e quantidade."); return; }
    setErro("");
    setSalvando(true);
    try {
      await onSave({
        destinatarioId: Number(destinatarioId),
        transportadoraId: transportadoraId ? Number(transportadoraId) : undefined,
        veiculoId: veiculoId ? Number(veiculoId) : undefined,
        colaboradorResponsavelId: colaboradorResponsavelId ? Number(colaboradorResponsavelId) : undefined,
        dataEmissao: dataEmissao || undefined,
        naturezaOperacao,
        modalidadeFrete,
        dataSaida: dataSaida || undefined,
        informacoesComplementares,
        finalidadeOperacao,
        consumidorFinal,
        indicadorPresenca,
        formaPagamento,
        valorFrete: valorFrete !== "" ? Number(valorFrete) : undefined,
        valorSeguro: valorSeguro !== "" ? Number(valorSeguro) : undefined,
        valorDesconto: valorDesconto !== "" ? Number(valorDesconto) : undefined,
        quantidadeVolumes: quantidadeVolumes !== "" ? Number(quantidadeVolumes) : undefined,
        especieVolumes: especieVolumes || undefined,
        pesoBrutoTotal: pesoBrutoTotal !== "" ? Number(pesoBrutoTotal) : undefined,
        pesoLiquidoTotal: pesoLiquidoTotal !== "" ? Number(pesoLiquidoTotal) : undefined,
        baseCalculoIcms: baseCalculoIcms !== "" ? Number(baseCalculoIcms) : undefined,
        valorIcms: valorIcms !== "" ? Number(valorIcms) : undefined,
        baseCalculoIcmsSt: baseCalculoIcmsSt !== "" ? Number(baseCalculoIcmsSt) : undefined,
        valorIcmsSt: valorIcmsSt !== "" ? Number(valorIcmsSt) : undefined,
        outrasDespesas: outrasDespesas !== "" ? Number(outrasDespesas) : undefined,
        valorIpi: valorIpi !== "" ? Number(valorIpi) : undefined,
        itens: itensValidos.map(it => ({
          produtoId: Number(it.produtoId),
          quantidade: Number(it.quantidade),
          valorUnitario: it.valorUnitario !== "" ? Number(it.valorUnitario) : undefined,
          cfopUtilizado: it.cfopUtilizado || undefined,
          ncmUtilizado: it.ncmUtilizado || undefined,
          cstUtilizado: it.cstUtilizado || undefined,
        })),
      });
    } catch (e) {
      setErro(e.message || "Erro ao salvar a nota fiscal");
    } finally {
      setSalvando(false);
    }
  };

  return (
    <div className="modal-backdrop">
      <div className="modal" style={{ width: 920, maxWidth: "96vw" }}>
        <div className="modal-header">
          <h3>{nota?.id ? "Editar" : "Nova"} Nota Fiscal</h3>
          <button className="icon-btn" onClick={onCancel} aria-label="Fechar"><X size={18} /></button>
        </div>
        <div className="modal-body">
          <div className="nf-section">
            <h4 className="nf-section-title">Dados gerais</h4>
            <div className="nf-grid-3">
              <div className="field-group">
                <label className="field-label">Natureza da operação</label>
                <input value={naturezaOperacao} onChange={e => setNaturezaOperacao(e.target.value)} />
              </div>
              <div className="field-group">
                <label className="field-label">Colaborador responsável</label>
                <select value={colaboradorResponsavelId} onChange={e => setColaboradorResponsavelId(e.target.value)}>
                  <option value="">Nenhum</option>
                  {(colaboradores || []).map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
                </select>
              </div>
              <div className="field-group">
                <label className="field-label">Finalidade da operação</label>
                <select value={finalidadeOperacao} onChange={e => setFinalidadeOperacao(e.target.value)}>
                  {FINALIDADES_OPERACAO.map(o => <option key={o} value={o}>{o}</option>)}
                </select>
              </div>
            </div>
            <div className="endereco-grid">
              <div className="field-group">
                <label className="field-label">Data de saída</label>
                <input type="date" value={dataSaida} onChange={e => setDataSaida(e.target.value)} />
              </div>
              <div className="field-group">
                <label className="field-label">Data de emissão</label>
                <input type="date" value={dataEmissao} onChange={e => setDataEmissao(e.target.value)} />
              </div>
            </div>
          </div>

          <div className="nf-section">
            <h4 className="nf-section-title">Destinatário</h4>
            <div className="endereco-grid">
              <div className="field-group">
                <label className="field-label">Cliente<span className="req">*</span></label>
                <select value={destinatarioId} onChange={e => setDestinatarioId(e.target.value)}>
                  <option value="">Selecione…</option>
                  {(clientes || []).map(c => <option key={c.id} value={c.id}>{c.nome}</option>)}
                </select>
                {clientes?.length === 0 && <p className="hint">Nenhum cliente cadastrado ainda.</p>}
              </div>
              <div className="field-group">
                <label className="field-label">CNPJ / CPF</label>
                <input value={clienteSelecionado?.documento || ""} disabled placeholder="Selecione o cliente" />
              </div>
            </div>
            <div className="endereco-grid">
              <div className="field-group">
                <label className="field-label">Presença do comprador</label>
                <select value={indicadorPresenca} onChange={e => setIndicadorPresenca(e.target.value)}>
                  {INDICADORES_PRESENCA.map(o => <option key={o} value={o}>{o}</option>)}
                </select>
              </div>
              <div className="field-group">
                <label className="field-label">Contribuinte</label>
                <input value={clienteSelecionado?.contribuinte || ""} disabled placeholder="Selecione o cliente" />
              </div>
            </div>
          </div>

          <div className="nf-section">
            <h4 className="nf-section-title">Fatura</h4>
            <div className="endereco-grid">
              <div className="field-group">
                <label className="field-label">Forma de pagamento</label>
                <select value={formaPagamento} onChange={e => setFormaPagamento(e.target.value)}>
                  {FORMAS_PAGAMENTO.map(o => <option key={o} value={o}>{o}</option>)}
                </select>
              </div>
              <div className="field-group" style={{ display: "flex", alignItems: "flex-end" }}>
                <label className={`nf-toggle ${consumidorFinal ? "nf-toggle-ativo" : ""}`}>
                  <input type="checkbox" checked={consumidorFinal} onChange={e => setConsumidorFinal(e.target.checked)} />
                  <span>Venda para consumidor final</span>
                </label>
              </div>
            </div>
          </div>

          <div className="nf-section">
            <h4 className="nf-section-title">Transporte</h4>
            <div className="field-group">
              <label className="field-label">Modalidade do frete</label>
              <select value={modalidadeFrete} onChange={e => setModalidadeFrete(e.target.value)}>
                {MODALIDADES_FRETE.map(o => <option key={o} value={o}>{o}</option>)}
              </select>
            </div>
            <div className="endereco-grid">
              <div className="field-group">
                <label className="field-label">Transportadora</label>
                <select value={transportadoraId} onChange={e => setTransportadoraId(e.target.value)}>
                  <option value="">Nenhuma</option>
                  {(transportadoras || []).map(t => <option key={t.id} value={t.id}>{t.nome}</option>)}
                </select>
              </div>
              <div className="field-group">
                <label className="field-label">Veículo (placa)</label>
                <select value={veiculoId} onChange={e => setVeiculoId(e.target.value)}>
                  <option value="">Nenhum</option>
                  {(veiculos || []).map(v => <option key={v.id} value={v.id}>{v.placa}</option>)}
                </select>
              </div>
            </div>
            <div className="nf-grid-4">
              <div className="field-group">
                <label className="field-label">Volumes (qtd.)</label>
                <input type="number" value={quantidadeVolumes} onChange={e => setQuantidadeVolumes(e.target.value)} />
              </div>
              <div className="field-group">
                <label className="field-label">Espécie dos volumes</label>
                <input placeholder="Ex: Caixas, Sacos" value={especieVolumes} onChange={e => setEspecieVolumes(e.target.value)} />
              </div>
              <div className="field-group">
                <label className="field-label">Peso bruto total (kg)</label>
                <input type="number" value={pesoBrutoTotal} onChange={e => setPesoBrutoTotal(e.target.value)} />
              </div>
              <div className="field-group">
                <label className="field-label">Peso líquido total (kg)</label>
                <input type="number" value={pesoLiquidoTotal} onChange={e => setPesoLiquidoTotal(e.target.value)} />
              </div>
            </div>
          </div>

          <div className="nf-section">
            <h4 className="nf-section-title">Itens<span className="req">*</span></h4>
            <div className="nf-itens-table">
              <div className="nf-itens-header">
                <span>Produto</span>
                <span>Qtd.</span>
                <span>Vlr. unit.</span>
                <span>CFOP</span>
                <span>NCM</span>
                <span>CST</span>
                <span style={{ textAlign: "right" }}>Total</span>
                <span></span>
              </div>
              {itens.map((item, index) => {
                const totalItem = (Number(item.quantidade) || 0) * (Number(item.valorUnitario) || 0);
                return (
                  <div key={index} className="nf-item-row">
                    <select value={item.produtoId} onChange={e => atualizarItem(index, "produtoId", e.target.value)}>
                      <option value="">Selecione…</option>
                      {(produtosDisponiveis || []).map(p => <option key={p.id} value={p.id}>{p.descricao}</option>)}
                    </select>
                    <input type="number" value={item.quantidade} onChange={e => atualizarItem(index, "quantidade", e.target.value)} />
                    <input type="number" value={item.valorUnitario} onChange={e => atualizarItem(index, "valorUnitario", e.target.value)} />
                    <input value={item.cfopUtilizado} onChange={e => atualizarItem(index, "cfopUtilizado", e.target.value)} />
                    <input value={item.ncmUtilizado} onChange={e => atualizarItem(index, "ncmUtilizado", e.target.value)} />
                    <input value={item.cstUtilizado} onChange={e => atualizarItem(index, "cstUtilizado", e.target.value)} />
                    <span className="nf-item-total">R$ {totalItem.toFixed(2)}</span>
                    <button type="button" className="icon-btn icon-btn-danger" onClick={() => removerItem(index)} aria-label="Remover item">
                      <Trash2 size={14} />
                    </button>
                  </div>
                );
              })}
            </div>
            <button type="button" className="btn" onClick={adicionarItem}><Plus size={14} /> Adicionar item</button>
          </div>

          <div className="nf-section">
            <h4 className="nf-section-title">Frete, seguro e desconto</h4>
            <div className="nf-grid-3">
              <div className="field-group">
                <label className="field-label">Valor do frete (R$)</label>
                <input type="number" value={valorFrete} onChange={e => setValorFrete(e.target.value)} />
              </div>
              <div className="field-group">
                <label className="field-label">Valor do seguro (R$)</label>
                <input type="number" value={valorSeguro} onChange={e => setValorSeguro(e.target.value)} />
              </div>
              <div className="field-group">
                <label className="field-label">Desconto (R$)</label>
                <input type="number" value={valorDesconto} onChange={e => setValorDesconto(e.target.value)} />
              </div>
            </div>
            <div className="field-group" style={{ marginBottom: 0 }}>
              <label className="field-label">Informações complementares</label>
              <input value={informacoesComplementares} onChange={e => setInformacoesComplementares(e.target.value)} />
            </div>
          </div>

          <div className="nf-section">
            <h4 className="nf-section-title">Impostos</h4>
            <div className="nf-grid-3">
              <div className="field-group">
                <label className="field-label">Base de cálculo do ICMS (R$)</label>
                <input type="number" value={baseCalculoIcms} onChange={e => setBaseCalculoIcms(e.target.value)} />
              </div>
              <div className="field-group">
                <label className="field-label">Valor do ICMS (R$)</label>
                <input type="number" value={valorIcms} onChange={e => setValorIcms(e.target.value)} />
              </div>
              <div className="field-group">
                <label className="field-label">Valor do IPI (R$)</label>
                <input type="number" value={valorIpi} onChange={e => setValorIpi(e.target.value)} />
              </div>
            </div>
            <div className="nf-grid-3">
              <div className="field-group">
                <label className="field-label">Base de cálculo do ICMS ST (R$)</label>
                <input type="number" value={baseCalculoIcmsSt} onChange={e => setBaseCalculoIcmsSt(e.target.value)} />
              </div>
              <div className="field-group">
                <label className="field-label">Valor do ICMS ST (R$)</label>
                <input type="number" value={valorIcmsSt} onChange={e => setValorIcmsSt(e.target.value)} />
              </div>
              <div className="field-group">
                <label className="field-label">Outras despesas (R$)</label>
                <input type="number" value={outrasDespesas} onChange={e => setOutrasDespesas(e.target.value)} />
              </div>
            </div>
            <p className="hint" style={{ marginTop: -4 }}>ICMS e ICMS ST são informativos (já embutidos no valor dos itens). IPI e outras despesas entram no total da nota.</p>
          </div>

          <div className="nf-total-card">
            <div className="nf-total-row"><span>Subtotal dos itens</span><span>R$ {totalItens.toFixed(2)}</span></div>
            <div className="nf-total-row"><span>+ Frete</span><span>R$ {(Number(valorFrete) || 0).toFixed(2)}</span></div>
            <div className="nf-total-row"><span>+ Seguro</span><span>R$ {(Number(valorSeguro) || 0).toFixed(2)}</span></div>
            <div className="nf-total-row"><span>− Desconto</span><span>R$ {(Number(valorDesconto) || 0).toFixed(2)}</span></div>
            <div className="nf-total-row"><span>+ IPI</span><span>R$ {(Number(valorIpi) || 0).toFixed(2)}</span></div>
            <div className="nf-total-row"><span>+ Outras despesas</span><span>R$ {(Number(outrasDespesas) || 0).toFixed(2)}</span></div>
            <div className="nf-total-final"><span>Total da nota</span><span>R$ {valorTotalGeral.toFixed(2)}</span></div>
          </div>

          {erro && <p className="error-text" style={{ marginTop: 14 }}>{erro}</p>}
        </div>
        <div className="modal-footer">
          <button className="btn" onClick={onCancel} disabled={salvando}>Cancelar</button>
          <button className="btn btn-primary" onClick={salvar} disabled={salvando}>{salvando ? "Salvando…" : "Salvar"}</button>
        </div>
      </div>
    </div>
  );
}

const STATUS_DOCUMENTO_LABEL = {
  rascunho: "Rascunho",

  autorizado: "Autorizado",
  rejeitado: "Rejeitado",
  cancelado: "Cancelado",
