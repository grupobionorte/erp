databases:
  - name: erp-biomassa-db
    plan: 0.1c-256mb
    postgresMajorVersion: 16

services:
  - type: web
    name: erp-biomassa-backend
    runtime: node
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: erp-biomassa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FOCUS_NFE_BASE_URL
        sync: false
      - key: FOCUS_NFE_TOKEN
        sync: false
      - key: FRONTEND_URL
        value: https://erp-biomassa-frontend.onrender.com

  # Dispara os lembretes da agenda (resumo das 7h e aviso 1 hora antes).
  # O servidor não agenda nada por conta própria: sem este serviço, esses
  # avisos nunca saem. O intervalo precisa casar com INTERVALO_CRON_MIN em
  # backend/src/routes/lembretes.js.
  - type: cron
    name: erp-biomassa-lembretes
    runtime: node
    plan: starter
    schedule: "*/5 * * * *"
    rootDir: backend
    buildCommand: echo "sem build necessario"
    startCommand: curl -fsS -X POST -H "x-cron-token:$CRON_TOKEN" https://erp-biomassa-backend.onrender.com/lembretes
    envVars:
      - key: CRON_TOKEN
        sync: false

  - type: web
    name: erp-biomassa-frontend
    runtime: static
    rootDir: frontend
    buildCommand: echo "sem build necessario"
    staticPublishPath: .
