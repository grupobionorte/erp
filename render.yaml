databases:
  - name: erp-biomassa-db
    plan: 0.1c-256mb
    postgresMajorVersion: 16

services:
  - type: web
    name: erp-biomassa-backend
    runtime: node
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: erp-biomassa-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FOCUS_NFE_BASE_URL
        sync: false
      - key: FOCUS_NFE_TOKEN
        sync: false
      - key: FRONTEND_URL
        value: https://erp-biomassa-frontend.onrender.com

  - type: web
    name: erp-biomassa-frontend
    runtime: static
    rootDir: frontend
    buildCommand: echo "sem build necessario"
    staticPublishPath: .
